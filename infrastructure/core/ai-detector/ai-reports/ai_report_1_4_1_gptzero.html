ormance ***with respect to the correct answers for the IOI dataset, not the ABC dataset***, because we want our ABC dataset to carry no information that helps with the IOI task (hence patching it in gives us signals which are totally uncorrelated with the correct answer)."}, {"score": 0.00026066045513421446, "sentence": "For instance, the model will obviously not complete sentences like `\"When Max and Victoria got a snack at the store, Clark decided to give it to\"` with the name `\"Tyler\"`."}]}, {"content": "Finally, let's define a new `ioi_metric` function which works for our new data.\n\nIn order to match the paper's results, we'll use a different convention here. 0 means performance is the same as on the IOI dataset (i.e. hasn't been harmed in any way), and -1 means performance is the same as on the ABC dataset (i.e. the model has completely lost the ability to distinguish between the subject and indirect object).\n\nAgain, we'll call this function something slightly different.", "index": 154, "line_start": 3051, "score": 0.00018949795730473673, "sentence_scores": [{"score": 0.00044721421702064465, "sentence": "Finally, let's define a new `ioi_metric` function which works for our new data."}, {"score": 0.00017415762411889126, "sentence": "In order to match the paper's results, we'll use a different convention here."}, {"score": 0.0002085036401885509, "sentence": "0 means performance is the same as on the IOI dataset (i.e."}, {"score": 0.00020483376844934514, "sentence": "hasn't been harmed in any way), and -1 means performance is the same as on the ABC dataset (i.e."}, {"score": 0.0002145070124093781, "sentence": "the model has completely lost the ability to distinguish between the subject and indirect object)."}, {"score": 0.00019474699730524797, "sentence": "Again, we'll call this function something slightly different."}]}, {"content": "In the previous section, we looked at activation patching, which answers questions like *what would happen if you took an attention head, and swapped the value it writes to the residual stream with the value it would have written under a different distribution, while keeping everything else the same?*. This proved to be a good way to examine the role of individual components like attention heads, and it allowed us to perform some more subtle analysis like patching keys / queries / values in turn to figure out which of them were more important for which heads.\n\nHowever, when we're studying a circuit, rather than just swapping out an entire attention head, we might want to ask more nuanced questions like *what would happen if the direct input from attention head $A$ to head $B$ (where $B$ comes after $A$) was swapped out with the value it would have been under a different distribution, while keeping everything else the same?*. Rather than answering the general question of how important attention heads are, this answers the more specific question of how important the circuit formed by connecting up these two attention heads is. Path patching is designed to answer questions like these.", "index": 157, "line_start": 3093, "score": 1.072462986344222e-05, "sentence_scores": [{"score": 3.9048064663201134e-05, "sentence": "In the previous section, we looked at activation patching, which answers questions like *what would happen if you took an attention head, and swapped the value it writes to the residual stream with the value it would have written under a different distribution, while keeping everything else the same?*."}, {"score": 3.5243301711591936e-05, "sentence": "This proved to be a good way to examine the role of individual components like attention heads, and it allowed us to perform some more subtle analysis like patching keys / queries / values in turn to figure out which of them were more important for which heads."}, {"score": 3.297806800504995e-05, "sentence": "However, when we're studying a circuit, rather than just swapping out an entire attention head, we might want to ask more nuanced questions like *what would happen if the direct input from attention head $A$ to head $B$ (where $B$ comes after $A$) was swapped out with the value it would have been under a different distribution, while keeping everything else the same?*."}, {"score": 4.3341904889555e-05, "sentence": "Rather than answering the general question of how important attention heads are, this answers the more specific question of how important the circuit formed by connecting up these two attention heads is."}, {"score": 0.0002883626080578333, "sentence": "Path patching is designed to answer questions like these."}]}, {"content": "The following diagrams might help explain the difference between activation and path patching in transformers. Recall that activation patching looked like:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-2c.png\" width=\"420\">\n\nwhere the black and green distributions are our clean and corrupted datasets respectively (so this would be `ioi_dataset` and `abc_dataset`). In contrast, path patching involves replacing **edges** rather than **nodes**. In the diagram below, we're replacing the edge $D \\to G$ with what it would be on the corrupted distribution. So in our patched run, $G$ is calculated just like it would be on the clean distribution, but as if the **direct** input from $D$ had come from the corrupted distribution instead.\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-3c.png\" width=\"560\">", "index": 158, "line_start": 3103, "score": 1.8525774482436187e-05, "sentence_scores": [{"score": 0.00016500726276665539, "sentence": "The following diagrams might help explain the difference between activation and path patching in transformers."}, {"score": 0.00015806195884719937, "sentence": "Recall that activation patching looked like:"}, {"score": 0.00010427457150192975, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-2c.png\" width=\"420\">"}, {"score": 0.00014789836728989133, "sentence": "where the black and green distributions are our clean and corrupted datasets respectively (so this would be `ioi_dataset` and `abc_dataset`)."}, {"score": 0.00012136766446688735, "sentence": "In contrast, path patching involves replacing **edges** rather than **nodes**."}, {"score": 0.00011005769617369322, "sentence": "In the diagram below, we're replacing the edge $D \\to G$ with what it would be on the corrupted distribution."}, {"score": 0.0001952764417215496, "sentence": "So in our patched run, $G$ is calculated just like it would be on the clean distribution, but as if the **direct** input from $D$ had come from the corrupted distribution instead."}, {"score": 0.00010484254140665964, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-3c.png\" width=\"560\">"}]}, {"content": "Unfortunately, for a transformer, this is easier to describe than to actually implement. This is because the \"nodes\" are attention heads, and the \"edges\" are all tangled together in the residual stream (that is to say, it's not clear how one could change the value of one edge without without affecting every path that includes that edge). The solution is to use the 3-step algorithm shown in the diagram below (which reads from right to left).\n\nTerminology note - we call head $D$ the **sender node**, and head $G$ the **receiver node**. Also, by \"freezing\" nodes, we mean \"patch with the value that is the same as the input\". For instance, if we didn't freeze head $H$ in step 2 below, it would have a different value because it would be affected by the corrupted value of head $D$.\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-4c.png\" width=\"900\">", "index": 159, "line_start": 3117, "score": 6.815245942647509e-06, "sentence_scores": [{"score": 2.7614700475947876e-05, "sentence": "Unfortunately, for a transformer, this is easier to describe than to actually implement."}, {"score": 3.1652144892396564e-05, "sentence": "This is because the \"nodes\" are attention heads, and the \"edges\" are all tangled together in the residual stream (that is to say, it's not clear how one could change the value of one edge without without affecting every path that includes that edge)."}, {"score": 3.3391313566659135e-05, "sentence": "The solution is to use the 3-step algorithm shown in the diagram below (which reads from right to left)."}, {"score": 3.147533503461747e-05, "sentence": "Terminology note - we call head $D$ the **sender node**, and head $G$ the **receiver node**."}, {"score": 3.04637081212073e-05, "sentence": "Also, by \"freezing\" nodes, we mean \"patch with the value that is the same as the input\"."}, {"score": 3.4976315559331275e-05, "sentence": "For instance, if we didn't freeze head $H$ in step 2 below, it would have a different value because it would be affected by the corrupted value of head $D$."}, {"score": 0.00010649362576011905, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-4c.png\" width=\"900\">"}]}, {"content": "Let's make this concrete, and take a simple 3-layer transformer with 2 heads per layer. Let's perform path patching on the edge from head `0.0` to `2.0` (terminology note: `0.0` is the **sender**, and `2.0` is the **receiver**). Note that here, we're considering \"direct paths\" as anything that doesn't go through another attention head (so it can go through any combination of MLPs). Intuitively, the nodes (attention heads) are the only things that can move information around in the model, and this is the thing we want to study. In contrast, MLPs just perform information processing, and they're not as interesting for this task.\n\nOur 3-step process looks like the diagram below (remember green is corrupted, grey is clean).\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-alg-transformers-6.png\" width=\"700\">\n\n(Note - in this diagram, the uncoloured nodes indicate we aren't doing any patching; we're just allowing them to be computed from the values of nodes which are downstream of it.)", "index": 160, "line_start": 3129, "score": 0.0015647105041669861, "sentence_scores": [{"score": 0.01306561120044089, "sentence": "Let's make this concrete, and take a simple 3-layer transformer with 2 heads per layer."}, {"score": 0.015465077065518404, "sentence": "Let's perform path patching on the edge from head `0.0` to `2.0` (terminology note: `0.0` is the **sender**, and `2.0` is the **receiver**)."}, {"score": 0.007601502552248567, "sentence": "Note that here, we're considering \"direct paths\" as anything that doesn't go through another attention head (so it can go through any combination of MLPs)."}, {"score": 0.005296272203597432, "sentence": "Intuitively, the nodes (attention heads) are the only things that can move information around in the model, and this is the thing we want to study."}, {"score": 0.006025370151001642, "sentence": "In contrast, MLPs just perform information processing, and they're not as interesting for this task."}, {"score": 0.005557590895085542, "sentence": "Our 3-step process looks like the diagram below (remember green is corrupted, grey is clean)."}, {"score": 0.007341621779338215, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-alg-transformers-6.png\" width=\"700\">"}, {"score": 0.00511410630483887, "sentence": "(Note - in this diagram, the uncoloured nodes indicate we aren't doing any patching; we're just allowing them to be computed from the values of nodes which are downstream of it.)"}]}, {"content": "Why does this work? If you stare at the middle picture above for long enough, you'll realise that the contribution from every non-direct path from `0.0` $\\to$ `2.0` is the same as it would be on the clean distribution, while all the direct paths' contributions are the same as they would be on the corrupted distribution.\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-decomp-four.png\" width=\"850\">", "index": 161, "line_start": 3143, "score": 2.0664496264566835e-05, "sentence_scores": [{"score": 0.00011025810478859668, "sentence": "Why does this work?"}, {"score": 9.293329360168363e-05, "sentence": "If you stare at the middle picture above for long enough, you'll realise that the contribution from every non-direct path from `0.0` $\\to$ `2.0` is the same as it would be on the clean distribution, while all the direct paths' contributions are the same as they would be on the corrupted distribution."}, {"score": 0.0008408782907671707, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-decomp-four.png\" width=\"850\">"}]}, {"content": "You might be wondering why we're including MLPs as part of our direct path. The short answer is that this is what the IOI paper does, and we're trying to replicate it! The slightly longer answer is that both this method and a method which doesn't count MLPs as the direct path are justifiable.\n\nTo take one example, suppose the output of head `0.0` is being used directly by head `2.0`, but one of the MLPs is acting as a mediator. To oversimplify, we might imagine that `0.0` writes the vector $v$ into the residual stream, some neuron detects $v$ and writes $w$ to the residual stream, and `2.0` detects $w$. If we didn't count MLPs as a direct path then we wouldn't catch this causal relationship. The drawback is that things get a bit messier, because now we're essentially passing a \"fake input\" into our MLPs, and it's dangerous to assume that any operation as clean as the one previously described (with vectors $v$, $w$) would still happen under these new circumstances.\n\nAlso, having MLPs as part of the direct path doesn't help us understand what role the MLPs play in the circuit, all it does is tell us that some of them are important! Luckily, in the IOI circuit, MLPs aren't important (except for MLP0), and so doing both these forms of path patching get pretty similar results. As an optional exercise, you can reproduce the results from the following few sections using this different form of path patching. It's actually algorithmically easier to implement, because we only need one forward pass rather than two. Can you see why?\n\n<details>\n<summary>Answer</summary>\n\nBecause the MLPs were part of the direct paths between sender and receiver in the previous version of the algorithm, we had to do a forward pass to find the value we'd be patching into the receivers. But if MLPs aren't part of the direct path, then we can directly compute what to patch into the receiver nodes:\n\n```\norig_receiver_input <- orig_receiver_input + (new_sender_output - old_sender_output)\n```\n\nDiagram with direct paths not including MLPs:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-decomp-one.png\" width=\"1200\">\n\n</details>", "index": 163, "line_start": 3161, "score": 1.3429702726724055e-05, "sentence_scores": [{"score": 1.9855362139037303e-05, "sentence": "You might be wondering why we're including MLPs as part of our direct path."}, {"score": 1.4946531303833325e-05, "sentence": "The short answer is that this is what the IOI paper does, and we're trying to replicate it!"}, {"score": 2.4238824109101098e-05, "sentence": "The slightly longer answer is that both this method and a method which doesn't count MLPs as the direct path are justifiable."}, {"score": 2.335181883515816e-05, "sentence": "To take one example, suppose the output of head `0.0` is being used directly by head `2.0`, but one of the MLPs is acting as a mediator."}, {"score": 2.418883767241178e-05, "sentence": "To oversimplify, we might imagine that `0.0` writes the vector $v$ into the residual stream, some neuron detects $v$ and writes $w$ to the residual stream, and `2.0` detects $w$."}, {"score": 2.028660767877518e-05, "sentence": "If we didn't count MLPs as a direct path then we wouldn't catch this causal relationship."}, {"score": 1.579314539519902e-05, "sentence": "The drawback is that things get a bit messier, because now we're essentially passing a \"fake input\" into our MLPs, and it's dangerous to assume that any operation as clean as the one previously described (with vectors $v$, $w$) would still happen under these new circumstances."}, {"score": 1.7648659549820017e-05, "sentence": "Also, having MLPs as part of the direct path doesn't help us understand what role the MLPs play in the circuit, all it does is tell us that some of them are important!"}, {"score": 4.629977923186353e-05, "sentence": "Luckily, in the IOI circuit, MLPs aren't important (except for MLP0), and so doing both these forms of path patching get pretty similar results."}, {"score": 2.7058744810783934e-05, "sentence": "As an optional exercise, you can reproduce the results from the following few sections using this different form of path patching."}, {"score": 3.5565090145197624e-05, "sentence": "It's actually algorithmically easier to implement, because we only need one forward pass rather than two."}, {"score": 2.9548286881789326e-05, "sentence": "Can you see why?"}, {"score": 4.495443570067252e-05, "sentence": "<details>"}, {"score": 4.235689016166175e-05, "sentence": "<summary>Answer</summary>"}, {"score": 3.563547926870899e-05, "sentence": "Because the MLPs were part of the direct paths between sender and receiver in the previous version of the algorithm, we had to do a forward pass to find the value we'd be patching into the receivers."}, {"score": 9.946293939868563e-05, "sentence": "But if MLPs aren't part of the direct path, then we can directly compute what to patch into the receiver nodes:"}, {"score": 0.0010000099999376726, "sentence": "```"}, {"score": 0.0006036239086122591, "sentence": "orig_receiver_input <- orig_receiver_input + (new_sender_output - old_sender_output)"}, {"score": 0.00014095486797417479, "sentence": "```"}, {"score": 0.00043253528059253673, "sentence": "Diagram with direct paths not including MLPs:"}, {"score": 0.00048539788011057653, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-decomp-one.png\" width=\"1200\">"}, {"score": 0.0009983067017206664, "sentence": "</details>"}]}, {"content": "We'll start with a simple type of path patching - with just one receiver node, which is the final value of the residual stream. We've only discussed receiver nodes being other attention heads so far, but the same priciples hold for any choice of receiver nodes.\n\n<details>\n<summary>Question - can you explain the difference between path patching from an attention head to the residual stream, and activation patching on that attention head?</summary>\n\nActivation patching changes the value of that head, and all subsequent layers which depend on that head.\n\nPath patching will answer the question \"what if the value written by the head directly to the residual stream was the same as in $x_{new}$, but every non-direct path from this head to the residual stream (i.e. paths going through other heads) the value was the same as it would have been under $x_{orig}$?\n</details>\n\nThis patching is described at the start of section 3.1 in [the paper](https://arxiv.org/pdf/2211.00593.pdf) (page 5). The 3-step process will look like:\n\n1. Run the model on clean and corrupted input. Cache the head outputs.\n2. Run the model on clean input, with the sender head **patched** from the corrupted input, and every other head **frozen** to their values on the clean input. Cache the final value of the residual stream (i.e. `resid_post` in the final layer).\n3. Normally we would re-run the model on the clean input and patch in the cached value of the final residual stream, but in this case we don't need to because we can just unembed the final value of the residual stream directly without having to run another forward pass.\n\nHere is an illustration for a 2-layer transformer:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-residpost-newest.png\" width=\"680\">", "index": 165, "line_start": 3196, "score": 1.9110908964260368e-05, "sentence_scores": [{"score": 0.00012775244122867062, "sentence": "We'll start with a simple type of path patching - with just one receiver node, which is the final value of the residual stream."}, {"score": 5.419199284981132e-05, "sentence": "We've only discussed receiver nodes being other attention heads so far, but the same priciples hold for any choice of receiver nodes."}, {"score": 4.590366105907324e-05, "sentence": "<details>"}, {"score": 5.88778309504763e-05, "sentence": "<summary>Question - can you explain the difference between path patching from an attention head to the residual stream, and activation patching on that attention head?</summary>"}, {"score": 4.3660381898238e-05, "sentence": "Activation patching changes the value of that head, and all subsequent layers which depend on that head."}, {"score": 8.228786734673974e-05, "sentence": "Path patching will answer the question \"what if the value written by the head directly to the residual stream was the same as in $x_{new}$, but every non-direct path from this head to the residual stream (i.e."}, {"score": 6.137529833728227e-05, "sentence": "paths going through other heads) the value was the same as it would have been under $x_{orig}$?"}, {"score": 3.071462685620328e-05, "sentence": "</details>"}, {"score": 5.237969905393996e-05, "sentence": "This patching is described at the start of section 3.1 in [the paper](https://arxiv.org/pdf/2211.00593.pdf) (page 5)."}, {"score": 5.7646897983670675e-05, "sentence": "The 3-step process will look like:"}, {"score": 9.580805386246119e-05, "sentence": "1. Run the model on clean and corrupted input."}, {"score": 8.810235735987112e-05, "sentence": "Cache the head outputs."}, {"score": 5.9881754442986685e-05, "sentence": "2. Run the model on clean input, with the sender head **patched** from the corrupted input, and every other head **frozen** to their values on the clean input."}, {"score": 0.00015937559443627693, "sentence": "Cache the final value of the residual stream (i.e."}, {"score": 0.0005385654492708592, "sentence": "`resid_post` in the final layer)."}, {"score": 0.000349428401038976, "sentence": "3. Normally we would re-run the model on the clean input and patch in the cached value of the final residual stream, but in this case we don't need to because we can just unembed the final value of the residual stream directly without having to run another forward pass."}, {"score": 0.02043191679032428, "sentence": "Here is an illustration for a 2-layer transformer:"}, {"score": 0.03602888439461656, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/path-patching-residpost-newest.png\" width=\"680\">"}]}, {"content": "You should implement path patching from heads to the residual stream, as described above (and in the paper).\n\nThis exercise is expected to be challenging, with several moving parts. We've purposefully left it very open-ended, including a function & docstring but nothing else. \n\nHere are a few hints / tips for how to proceed:\n\n* Split your function up into 3 parts (one for each of the steps above), and write each section one at a time.\n* You'll need a new hook function: one which performs freezing / patching for step 2 of the algorithm.\n* You can reuse a lot of code from your activation patching function.\n* When calling `model.run_with_cache`, you can use the keyword argument `names_filter`, which is a function from name to boolean. If you use this argument, your model will only cache activations with a name which passes this filter (e.g. you can use it like `names_filter = lambda name: name.endswith(\"q\")` to only cache query vectors).\n\nYou can also look at the dropdowns to get more hints and guidance (e.g. if you want to start from a function docstring).\n\nYou'll know you've succeeded if you can plot the results, and replicate Figure 3(b) from [the paper](https://arxiv.org/pdf/2211.00593.pdf) (at the top of page 6).\n\n**Note - if you use `model.add_hook` then `model.run_with_cache`, you might have to pass the argument `level=1` to the `add_hook` method. I don't know why the function sometimes fails unless you do this (this bug only started appearing after the exercises were written). I've not had time to track this down, but extra credit to anyone who can (-:**", "index": 166, "line_start": 3222, "score": 2.491316348325518e-05, "sentence_scores": [{"score": 0.004937024502513263, "sentence": "You should implement path patching from heads to the residual stream, as described above (and in the paper)."}, {"score": 0.0031952837917451392, "sentence": "This exercise is expected to be challenging, with several moving parts."}, {"score": 0.0010435849182133066, "sentence": "We've purposefully left it very open-ended, including a function & docstring but nothing else."}, {"score": 0.0005019617140487555, "sentence": "Here are a few hints / tips for how to proceed:"}, {"score": 0.0004556014092839628, "sentence": "* Split your function up into 3 parts (one for each of the steps above), and write each section one at a time."}, {"score": 0.0004648909461407556, "sentence": "* You'll need a new hook function: one which performs freezing / patching for step 2 of the algorithm."}, {"score": 0.0003333033241170369, "sentence": "* You can reuse a lot of code from your activation patching function."}, {"score": 0.00032263921767335216, "sentence": "* When calling `model.run_with_cache`, you can use the keyword argument `names_filter`, which is a function from name to boolean."}, {"score": 0.00024581646925487144, "sentence": "If you use this argument, your model will only cache activations with a name which passes this filter (e.g."}, {"score": 0.00044627275358579045, "sentence": "you can use it like `names_filter = lambda name: name.endswith(\"q\")` to only cache query vectors)."}, {"score": 0.00012644320964892675, "sentence": "You can also look at the dropdowns to get more hints and guidance (e.g."}, {"score": 0.00011548161827422015, "sentence": "if you want to start from a function docstring)."}, {"score": 0.00013555943519008508, "sentence": "You'll know you've succeeded if you can plot the results, and replicate Figure 3(b) from [the paper](https://arxiv.org/pdf/2211.00593.pdf) (at the top of page 6)."}, {"score": 0.00026661104412645877, "sentence": "**Note - if you use `model.add_hook` then `model.run_with_cache`, you might have to pass the argument `level=1` to the `add_hook` method."}, {"score": 0.0001244212749457864, "sentence": "I don't know why the function sometimes fails unless you do this (this bug only started appearing after the exercises were written)."}, {"score": 0.000211664427352021, "sentence": "I've not had time to track this down, but extra credit to anyone who can (-:**"}]}, {"content": "What is the interpretation of this plot? How does it compare to the equivalent plot we got from activation patching? (Remember that our metric is defined in a different way, so we should expect a sign difference between the two results.)\n\n<details>\n<summary>Some thoughts</summary>\n\nThis plot is actually almost identical to the one we got from activation patching (apart from the results being negated, because of the new metric).\n\nThis makes sense; the only reason activation patching would do something different to path patching is if the heads writing in the `Mary - John` direction had their outputs used by a later head (because this would be accounted for in activation patching, whereas path patching isolates the direct effect on the residual stream only). Since attention heads' primary purpose is to move information around the model, it's reasonable to guess that this probably isn't happening.\n\nDon't worry though, in the next set of exercises we'll do some more interesting path patching, and we'll get some results which are meaningfully different from our activation patching results.\n</details>", "index": 171, "line_start": 3512, "score": 5.226124818841296e-06, "sentence_scores": [{"score": 2.4262803200214546e-05, "sentence": "What is the interpretation of this plot?"}, {"score": 2.5376504340217767e-05, "sentence": "How does it compare to the equivalent plot we got from activation patching?"}, {"score": 1.7013526416892344e-05, "sentence": "(Remember that our metric is defined in a different way, so we should expect a sign difference between the two results.)"}, {"score": 4.9406693791567925e-05, "sentence": "<details>"}, {"score": 3.1224519521360486e-05, "sentence": "<summary>Some thoughts</summary>"}, {"score": 1.5318091990578588e-05, "sentence": "This plot is actually almost identical to the one we got from activation patching (apart from the results being negated, because of the new metric)."}, {"score": 3.256213254249862e-05, "sentence": "This makes sense; the only reason activation patching would do something different to path patching is if the heads writing in the `Mary - John` direction had their outputs used by a later head (because this would be accounted for in activation patching, whereas path patching isolates the direct effect on the residual stream only)."}, {"score": 2.5219168469660043e-05, "sentence": "Since attention heads' primary purpose is to move information around the model, it's reasonable to guess that this probably isn't happening."}, {"score": 1.7594320016771357e-05, "sentence": "Don't worry though, in the next set of exercises we'll do some more interesting path patching, and we'll get some results which are meaningfully different from our activation patching results."}, {"score": 6.87831318805474e-05, "sentence": "</details>"}]}, {"content": "In the first section on path patching, we performed a simple kind of patching - from the output of an attention head to the final value of the residual stream. Here we'll do something a bit more interesting, and patch from the output of one head to the input of a later head. The purpose of this is to examine exactly how two heads are composing, and what effect the composed heads have on the model's output.\n\nWe got a hint of this in the previous section, where we patched the values of the S-inhibition heads and found that they were important. But this didn't tell us which inputs to these value vectors were important; we had to make educated guesses about this based on our analysis earlier parts of the model. In path patching, we can perform a more precise test to find which heads are important.\n\nThe paper's results from path patching are shown in figure 5(b), on page 7.", "index": 173, "line_start": 3538, "score": 3.516499959383785e-05, "sentence_scores": [{"score": 0.00016259084005957494, "sentence": "In the first section on path patching, we performed a simple kind of patching - from the output of an attention head to the final value of the residual stream."}, {"score": 0.00015324823585046167, "sentence": "Here we'll do something a bit more interesting, and patch from the output of one head to the input of a later head."}, {"score": 0.00014620685589748403, "sentence": "The purpose of this is to examine exactly how two heads are composing, and what effect the composed heads have on the model's output."}, {"score": 0.00015446420845449817, "sentence": "We got a hint of this in the previous section, where we patched the values of the S-inhibition heads and found that they were important."}, {"score": 0.00015116165676675843, "sentence": "But this didn't tell us which inputs to these value vectors were important; we had to make educated guesses about this based on our analysis earlier parts of the model."}, {"score": 0.00019606623961636888, "sentence": "In path patching, we can perform a more precise test to find which heads are important."}, {"score": 0.000697021016208747, "sentence": "The paper's results from path patching are shown in figure 5(b), on page 7."}]}, {"content": "You should fill in the function `get_path_patch_head_to_head` below. It takes as arguments a list of receiver nodes (as well as the type of input - keys, queries, or values), and returns a tensor of shape\\* `(layer, head)` where each element is the result of running the patching metric on the output of the model, after applying the 3-step path patching algorithm from one of the model's heads to all the receiver heads. You should be able to replicate the paper's results (figure 5(b)).\n\n\\**Actually, you don't need to return all layers, because the causal effect from any sender head which is on the same or a later layer than the last of your receiver heads will necessarily be zero.*\n\nIf you want a bit more guidance, you can use the dropdown below to see the ways in which this function should be different from your first path patching function (in most ways these functions will be similar, so you can start by copying that function).\n\n<details>\n<summary>Differences from first path patching function</summary>\n\nStep 1 is identical in both - gather all the observations.\n\nStep 2 is very similar. The only difference is that you'll be caching a different set of activations (your receiver heads).\n\nIn section 3, since your receiver nodes are in the middle of the model rather than at the very end, you will have to run the model again with these nodes patched in rather than just calculating the logit output directly from the patched values of the final residual stream. To do this, you'll have to write a new hook function to patch in the inputs to an attention head (if you haven't done this already).\n</details>", "index": 174, "line_start": 3550, "score": 5.208216030524465e-05, "sentence_scores": [{"score": 0.00073716303970433, "sentence": "You should fill in th  open-ended and challenging."}, {"score": 6.318055241152039e-05, "sentence": "You'll be given somewhat less guidance in the exercises."}]}, {"content": "We'll start this section by replicating the paper's analysis of the **name mover heads** and **negative name mover heads**. Our previous analysis should have pretty much convinced us that these heads are copying / negatively copying our indirect object token, but the results here show this with a bit more rigour.", "index": 181, "line_start": 3765, "score": 0.0001303689437581755, "sentence_scores": [{"score": 0.0004534453034049909, "sentence": "We'll start this section by replicating the paper's analysis of the **name mover heads** and **negative name mover heads**."}, {"score": 0.0003525823113105705, "sentence": "Our previous analysis should have pretty much convinced us that these heads are copying / negatively copying our indirect object token, but the results here show this with a bit more rigour."}]}, {"content": "Let's look at figure 3(c) from the paper. This plots the output of the strongest name mover and negative name mover heads against the attention probabilities for `END` attending to `IO` or `S` (color-coded).\n\nSome clarifications:\n* \"Projection\" here is being used synonymously with \"dot product\".\n* We're projecting onto the name embedding, i.e. the embedding vector for the token which is being paid attention to. This is not the same as the logit diff (which we got by projecting the heads' output onto the difference between the unembedding vectors for `IO` and `S`).\n    * We're doing this because the question we're trying to answer is *\"does the attention head copy (or anti-copy) the names which it pays attention to?\"*", "index": 182, "line_start": 3773, "score": 3.495077444363931e-06, "sentence_scores": [{"score": 3.827512807538108e-05, "sentence": "Let's look at figure 3(c) from the paper."}, {"score": 5.4167018570434224e-05, "sentence": "This plots the output of the strongest name mover and negative name mover heads against the attention probabilities for `END` attending to `IO` or `S` (color-coded)."}, {"score": 1.2248320151025772e-05, "sentence": "Some clarifications:"}, {"score": 1.907286219929006e-05, "sentence": "* \"Projection\" here is being used synonymously with \"dot product\"."}, {"score": 2.342404989546403e-05, "sentence": "* We're projecting onto the name embedding, i.e."}, {"score": 2.1350125713262354e-05, "sentence": "the embedding vector for the token which is being paid attention to."}, {"score": 2.8429882317773403e-05, "sentence": "This is not the same as the logit diff (which we got by projecting the heads' output onto the difference between the unembedding vectors for `IO` and `S`)."}, {"score": 3.127255571065676e-05, "sentence": "* We're doing this because the question we're trying to answer is *\"does the attention head copy (or anti-copy) the names which it pays attention to?"}, {"score": 0.0006073168118990564, "sentence": "\"*"}]}, {"content": "You should write code to replicate the paper's results in the cells below. Given four 1D tensors storing the results for a particular head (i.e. the projections and attention probabilities, for the `IO` and `S` tokens respectively), we've given you code to generate a plot which looks like the one in the paper. Again, you'll know that your code has worked if you can get results that resemble those in the paper.", "index": 183, "line_start": 3796, "score": 0.00013070664287721234, "sentence_scores": [{"score": 0.00048174636659731004, "sentence": "You should write code to replicate the paper's results in the cells below."}, {"score": 0.0006160371928498662, "sentence": "Given four 1D tensors storing the results for a particular head (i.e."}, {"score": 0.0006637853030925483, "sentence": "the projections and attention probabilities, for the `IO` and `S` tokens respectively), we've given you code to generate a plot which looks like the one in the paper."}, {"score": 0.0004506396466266443, "sentence": "Again, you'll know that your code has worked if you can get results that resemble those in the paper."}]}, {"content": "Now let's do a different kind of test of the name mover heads' copying, by looking directly at the OV circuits.\n\nFrom page 6 of the paper:\n\n\nNote the similarity between their method and how we studied copying in induction heads, during an earlier set of exercises. However, there are differences (e.g. we're only looking at whether the head copies names, rather than whether it copies tokens in general).", "index": 186, "line_start": 3910, "score": 9.3350211958429e-05, "sentence_scores": [{"score": 0.00034263432270646894, "sentence": "Now let's do a different kind of test of the name mover heads' copying, by looking directly at the OV circuits."}, {"score": 0.00023518688063446582, "sentence": "From page 6 of the paper:"}, {"score": 0.0003610779483787767, "sentence": "Note the similarity between their method and how we studied copying in induction heads, during an earlier set of exercises."}, {"score": 0.0003286949607763433, "sentence": "However, there are differences (e.g."}, {"score": 0.00038208089221844195, "sentence": "we're only looking at whether the head copies names, rather than whether it copies tokens in general)."}]}, {"content": "You should replicate these results by completing the `get_copying_scores` function below.\n\nYou could do this by indexing from the `ioi_cache`, but a much more principled alternative would be to embed all the names in the `NAMES` list and apply operations like MLPs, layernorms and OV matrices manually. This is what the solutions do.\n\nA few notes:\n\n* You can use `model.to_tokens` to convert the names to tokens. Remember to use `prepend_bos=False`, since you just want the tokens of names so you can embed them. Note that this function will treat the list of names as a batch of single-token inputs, which works fine for our purposes.\n* You can apply MLPs and layernorms as functions, by just indexing t 're only observing it on a certain distribution. For instance, it's not clear what the role of induction heads and duplicate token heads is when there are no duplicates (they could in theory do something completely different).\n</details>", "index": 193, "line_start": 4126, "score": 5.4161601161657975e-05, "sentence_scores": [{"score": 0.0007351353753519301, "sentence": "There are three different kinds of heads which appear early in the circuit, which can be validated by looking at their attention patterns on simple random sequences of tokens."}, {"score": 0.0005801398960312894, "sentence": "Can you figure out which three types these are, and how to validate them in this way?"}, {"score": 0.0001787210147065317, "sentence": "<details>"}, {"score": 0.00023835999784908, "sentence": "<summary>Answer</summary>"}, {"score": 0.0007439866068334182, "sentence": "Previous token heads, induction heads, and duplicate token heads."}, {"score": 0.0007156954037179954, "sentence": "We can validate them all at the same time, using sequences of `n` random tokens followed by those same `n` random tokens repeated."}, {"score": 0.00045202408646985074, "sentence": "This works as follows:"}, {"score": 0.0009448821042853705, "sentence": "* Prev token heads, by measuring the attention patterns with an offset of one (i.e."}, {"score": 0.0005101759428236769, "sentence": "one below the diagonal)."}, {"score": 0.0009479234235298629, "sentence": "* Induction heads, by measuring the attention patterns with an offset of `n-1` (i.e."}, {"score": 0.0009229006545339067, "sentence": "the second instance of a token paying attention to the token after its first instance)."}, {"score": 0.0008470620885855121, "sentence": "* Duplicate token heads, by measuring the attention patterns with an offset of `n` (i.e."}, {"score": 0.0008501603817204637, "sentence": "a token paying attention to its previous instance)."}, {"score": 0.0009250903515387685, "sentence": "In all three cases, if heads score close to 1 on _tokens` (which is similar to the one you used from exercise set 1.2, except that it has no start token, to match the paper), and a helper function `plot_early_head_validation_results` which calls the `get_attn_scores` function and plots the results (in a way which should look like Figure 18)."}, {"score": 0.0006466719868691228, "sentence": "So it's just the `get_attn_scores` function that you need to fill in."}]}, {"content": "Note - these figures suggest that it would be a useful bit of infrastructure to have a \"wiki\" for the heads of a model, giving their scores according to some metrics re head functions, like the ones we've seen here. HookedTransformer makes this pretty easy to make, as just changing the name input to `HookedTransformer.from_pretrained` gives a different model but in the same architecture, so the same code should work. If you want to make this, I'd love to see it!\n\nAs a proof of concept, [I made a mosaic of all induction heads across the 40 models then in HookedTransformer](https://www.neelnanda.io/mosaic).", "index": 198, "line_start": 4283, "score": 0.0001343259954907079, "sentence_scores": [{"score": 5.0171626620997005e-05, "sentence": "Note - these figures suggest that it would be a useful bit of infrastructure to have a \"wiki\" for the heads of a model, giving their scores according to some metrics re head functions, like the ones we've seen here."}, {"score": 6.574762248732395e-05, "sentence": "HookedTransformer makes this pretty easy to make, as just changing the name input to `HookedTransformer.from_pretrained` gives a different model but in the same architecture, so the same code should work."}, {"score": 3.912452573126434e-05, "sentence": "If you want to make this, I'd love to see it!"}, {"score": 9.865170778789972e-05, "sentence": "As a proof of concept, [I made a mosaic of all induction heads across the 40 models then in HookedTransformer](https://www.neelnanda.io/mosaic)."}]}, {"content": "The authors developed three criteria for validating their circuit explanations: faithfulness, completeness and minimality. They are defined as follows:\n\n* **Faithful** = the circuit can perform as well as the whole model\n* **Complete** = the circuit contains all nodes used to perform the task\n* **Minimal** = the circuit doesn't contain nodes irrelevant to the task\n\nIf all three criteria are met, then the circuit is considered a reliable explanation for model behaviour.\n\nExercise - can you understand why each of these criteria is important? For each pair of criteria, is it possible for a circuit to meet them both but fail the third (and if yes, can you give examples?).\n\n<details>\n<summary>Answer</summary>\n\nThe naive circuit (containing the entire model) is trivially faithful and complete, but obviously not minimal. In general, the problem with non-minimal circuits is that they may not be mechanistically understandable, which defeats the purpose of this kind of circuit analysis.\n\nCompleteness obviously implies faithfulness, because if a node isn't involved in the task, then it can't improve the model's performance on that task.\n\nYou might initially think faithfulness implies completeness, but this actually isn't true. Backup name mover heads illustrate this point. They are used in the task, and without understanding the role they play you'll have an incorrect model of reality (e.g. you'll think ablating the name mover heads would destroy performance, which turns out not to be true). So if you define a circuit that doesn't contain backup name mover heads then it will be faithful (the backup name mover heads won't be used) but not complete.\n\nSummary:\n\n* **Faithful & complete, not minimal** = possible (example: naive circuit)\n* **Faithful & minimal, not complete** = possible (example: circuit missing backup name mover heads)\n* **Complete & minimal, not faithful** = impossible (since completeness implies faithfulness)\n\nIn the paper, the authors formalise these concepts. Faithfulness is equivalent to $|F(C) - F(M)|$ being small (where $C$ is our circuit, $M$ is the model, and $F$ is our performance metric function), and completeness is equivalent to $|F(C\\backslash K) - F(M\\backslash K)|$ being small **for any subset $K \\subset C$** (including when $K$ is the empty set, showing that completeness implies faithfulness). Can you see how our circuit missing backup name mover heads violates this condition?\n\n<details>\n<summary>Answer</summary>\n\nIt violates the condition when $K$ is the set of name mover heads. $C \\backslash K$ performs worse than $M \\backslash K$, because the latter contains backup name mover heads while the former has lost its name mover heads ***and*** backup name mover heads.\n</details>\n</details>", "index": 201, "line_start": 4309, "score": 3.0312997872094126e-05, "sentence_scores": [{"score": 0.0001380077588276074, "sentence": "The authors developed three criteria for validating their circuit explanations: faithfulness, completeness and minimality."}, {"score": 4.424013454251923e-05, "sentence": "They are defined as follows:"}, {"score": 8.057140075593088e-05, "sentence": "* **Faithful** = the circuit can perform as well as the whole model"}, {"score": 8.704620260551677e-05, "sentence": "* **Complete** = the circuit contains all nodes used to perform the task"}, {"score": 6.471635357860268e-05, "sentence": "* **Minimal** = the circuit doesn't contain nodes irrelevant to the task"}, {"score": 8.456998288679033e-05, "sentence": "If all three criteria are met, then the circuit is considered a reliable explanation for model behaviour."}, {"score": 3.0201858279093285e-05, "sentence": "Exercise - can you understand why each of these criteria is important?"}, {"score": 4.3011741426084216e-05, "sentence": "For each pair of criteria, is it possible for a circuit to meet them both but fail the third (and if yes, can you give examples?"}, {"score": 3.648375530065452e-05, "sentence": ")."}, {"score": 7.17379273792747e-05, "senten 5722, "sentence": "These three sections are all optional, and you can do as many of them as you want (in whichever order you prefer)."}, {"score": 0.00038905065524281904, "sentence": "There will also be some further directions of investigation at the end of this section, which have been suggested either by the authors or by Neel."}]}, {"content": "As we've discussed, a really weird observation is that some of the early heads detecting duplicated tokens are induction heads, not just direct duplicate token heads. This is very weird! What's up with that?", "index": 228, "line_start": 5051, "score": 0.0003360494000486439, "sentence_scores": [{"score": 0.0017258941075702, "sentence": "As we've discussed, a really weird observation is that some of the early heads detecting duplicated tokens are induction heads, not just direct duplicate token heads."}, {"score": 0.0014683724847347878, "sentence": "This is very weird!"}, {"score": 0.001166719380627677, "sentence": "What's up with that?"}]}, {"content": "First off, let's just recap what induction heads are. An induction head is an important type of attention head that can detect and continue repeated sequences. It is the second head in a two head induction circuit, which looks for previous copies of the current token and attends to the token *after* it, and then copies that to the current position and predicts that it will come next. They're enough of a big deal that [Anthropic wrote a whole paper on them](https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html).\n\nThe diagram below shows a diagram for how they work to predict that the token `\"urs\"` follows `\" D\"`, the second time the word `\"Dursley\"` appears (note that we assume the model has not been trained on Harry Potter, so this is an example of in-context learning).\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ih-simple.png\" width=\"650\">", "index": 229, "line_start": 5059, "score": 6.275330324101506e-05, "sentence_scores": [{"score": 0.0005458746045746015, "sentence": "First off, let's just recap what induction heads are."}, {"score": 0.00044521856087914266, "sentence": "An induction head is an important type of attention head that can detect and continue repeated sequences."}, {"score": 0.0003991182778780203, "sentence": "It is the second head in a two head induction circuit, which looks for previous copies of the current token and attends to the token *after* it, and then copies that to the current position and predicts that it will come next."}, {"score": 0.00045499803105294567, "sentence": "They're enough of a big deal that [Anthropic wrote a whole paper on them](https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html)."}, {"score": 0.0004859028385122157, "sentence": "The diagram below shows a diagram for how they work to predict that the token `\"urs\"` follows `\" D\"`, the second time the word `\"Dursley\"` appears (note that we assume the model has not been trained on Harry Potter, so this is an example of in-context learning)."}, {"score": 0.0008999456455193256, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ih-simple.png\" width=\"650\">"}]}, {"content": "Why is it surprising that induction heads up here? It's surprising because it feels like overkill. The model doesn't care about *what* token comes after the first copy of the subject, just that it's duplicated. And it already has simpler duplicate token heads. My best guess is that it just already had induction heads around and that, in addition to their main function, they *also* only activate on duplicated tokens. So it was useful to repurpose this existing machinery.\n\nThis suggests that as we look for circuits in larger models life may get more and more complicated, as components in simpler circuits get repurposed and built upon.", "index": 230, "line_start": 5071, "score": 2.8067933643983e-06, "sentence_scores": [{"score": 1.906244640976572e-05, "sentence": "Why is it surprising that induction heads up here?"}, {"score": 2.478879849471583e-05, "sentence": "It's surprising because it feels like overkill."}, {"score": 2.351580922865861e-05, "sentence": "The model doesn't care about *what* token comes after the first copy of the subject, just that it's duplicated."}, {"score": 1.9711777972031917e-05, "sentence": "And it already has simpler duplicate token heads."}, {"score": 8.378774451217657e-06, "sentence": "My best guess is that it just already had induction heads around and that, in addition to their main function, they *also* only activate on duplicated tokens."}, {"score": 9.826916485321276e-06, "sentence": "So it was useful to repurpose this existing machinery."}, {"score": 1.1203123477942387e-05, "sentence": "This suggests that as we look for circuits in larger models life may get more and more complicated, as components in simpler circuits get repurposed and built upon."}]}, {"content": "First, in the cell below, you should visualise the attention patterns of the induction heads (`5.5` and `6.9`) on sequences containg repeated tokens, and verify that they are attending to the token *after* the previous instance of that same token. You might want to repeat code you wrote in the \"Validation of duplicate token heads\" section.", "index": 231, "line_start": 5081, "score": 0.00020857131664069587, "sentence_scores": [{"score": 0.0019005694795639198, "sentence": "First, in the cell below, you should visualise the attention patterns of the induction heads (`5.5` and `6.9`) on sequences containg repeated tokens, and verify that they are attending to the token *after* the previous instance of that same token."}, {"score": 0.0013461022585001135, "sentence": "You might want to repeat code you wrote in the \"Validation of duplicate token heads\" section."}]}, {"content": "One implication of this is that it's useful to categories heads according to whether they occur in simpler circuits, so that as we look for more complex circuits we can easily look for them. This is Hooked to do here! An interesting fact about induction heads is that they work on a sequence of repeated random tokens - notable for being wildly off distribution from the natural language GPT-2 was trained on. Being able to predict a model's behaviour off distribution is a good mark of success for mechanistic interpretability! This is a good sanity check for whether a head is an induction head or not.\n\nWe can characterise an induction head by just giving a sequence of random tokens repeated once, and measuring the average attention paid from the second copy of a token to the token after the first copy. At the same time, we can also measure the average attention paid from the second copy of a token to the first copy of the token, which is the attention that the induction head would pay if it were a duplicate token head, and the average attention paid to the previous token to find previous token heads.\n\nNote that this is a superficial study of whether something is an induction head - we totally ignore the question of whether it actually does boost the correct token or whether it composes with a single previous head and how. In particular, we sometimes get anti-induction heads which suppress the induction-y token (no clue why!), and this technique will find those too.", "index": 233, "line_start": 5127, "score": 0.00010631394060949516, "sentence_scores": [{"score": 0.00010662185585189541, "sentence": "One implication of this is that it's useful to categories heads according to whether they occur in simpler circuits, so that as we look for more complex circuits we can easily look for them."}, {"score": 0.00012127841384548876, "sentence": "This is Hooked to do here!"}, {"score": 8.345670818330183e-05, "sentence": "An interesting fact about induction heads is that they work on a sequence of repeated random tokens - notable for being wildly off distribution from the natural language GPT-2 was trained on."}, {"score": 0.0001021320477015143, "sentence": "Being able to predict a model's behaviour off distribution is a good mark of success for mechanistic interpretability!"}, {"score": 9.387470929303265e-05, "sentence": "This is a good sanity check for whether a head is an induction head or not."}, {"score": 9.416289166329761e-05, "sentence": "We can characterise an induction head by just giving a sequence of random tokens repeated once, and measuring the average attention paid from the second copy of a token to the token after the first copy."}, {"score": 0.0001248098872631835, "sentence": "At the same time, we can also measure the average attention paid from the second copy of a token to the first copy of the token, which is the attention that the induction head would pay if it were a duplicate token head, and the average attention paid to the previous token to find previous token heads."}, {"score": 0.00012945703893360838, "sentence": "Note that this is a superficial study of whether something is an induction head - we totally ignore the question of whether it actually does boost the correct token or whether it composes with a single previous head and how."}, {"score": 0.0001336206895748703, "sentence": "In particular, we sometimes get anti-induction heads which suppress the induction-y token (no clue why!"}, {"score": 9.569987437345146e-05, "sentence": "), and this technique will find those too."}]}, {"content": "The paper mentions that heads `2.2` and `4.11` are previous token heads. Hopefully you already validated this in the previous section by plotting the previous token scores (in your replication of Figure 18). But this time, you'll perform a particular kind of path patching to prove that these heads are functioning as previous token heads, in the way implied by our circuit diagram.\n\n<details>\n<summary>Question - what kind of path patching should you perform?</summary>\n\nTo show these heads are acting as prev token heads in an induction circuit, we want to perform key-patching (i.e. patch the path from the output of the prev token heads to the key inputs of the induction heads).\n\nWe expect this to worsen performance, because it interrupts the duplicate token signal provided by the induction heads.\n</details>", "index": 234, "line_start": 5139, "score": 6.602582135295147e-06, "sentence_scores": [{"score": 7.121012461688222e-05, "sentence": "The paper mentions that heads `2.2` and `4.11` are previous token heads."}, {"score": 3.9878349060897815e-05, "sentence": "Hopefully you already validated this in the previous section by plotting the previous token scores (in your replication of Figure 18)."}, {"score": 3.3716471746135205e-05, "sentence": "But this time, you'll perform a particular kind of path patching to prove that these heads are functioning as previous token heads, in the way implied by our circuit diagram."}, {"score": 2.8667118353392304e-05, "sentence": "<details>"}, {"score": 2.3504485831388676e-05, "sentence": "<summary>Question - what kind of path patching should you perform?</summary>"}, {"score": 3.7806479019969575e-05, "sentence": "To show these heads are acting as prev token heads in an induction circuit, we want to perform key-patching (i.e."}, {"score": 3.505522700230601e-05, "sentence": "patch the path from the output of the prev token heads to the key inputs of the induction heads)."}, {"score": 4.203809292241578e-05, "sentence": "We expect this to worsen performance, because it interrupts the duplicate token signal provided by the induction heads."}, {"score": 9.660479753685955e-05, "sentence": "</details>"}]}, {"content": "You might notice that there are two other heads in the induction heads box in the paper's diagram, both in brackets (heads `5.8` and `5.9`). Can you try and figure out what these heads are doing, and why they're in brackets?", "index": 237, "line_start": 5209, "score": 5.795903897469182e-05, "sentence_scores": [{"score": 0.00039847418564891866, "sentence": "You might notice that there are two other heads in the induction heads box in the paper's diagram, both in brackets (heads `5.8` and `5.9`)."}, {"score": 0.00028555938663966875, "sentence": "Can you try and figure out what these heads are doing, and why they're in brackets?"}]}, {"content": "<details>\n<summary>Hint</summary>\n\nRecall the path patching section, where you applied patching from attention heads' outputs to the value inputs to the S-inhibition heads (hopefully replicating figure 4b from the paper). Try patching the **keys** of the S-inhibition heads instead. Do heads `5.8` and `5.9` stand out here?\n</details>\n\n<details>\n<summary>Answer</summary>\n\nAfter making the plot suggested in the hint, you should find that patching from `5.8` and `5.9` each have around a 5% negative impact on the logit difference if you patch from them to the S-inhibition heads. We'd like to conclude that these are induction heads, and they're acting to increase the attention paid by `end` to `S2`. Unfortunately, they don't seem to be induction heads according to the results of figure 18 in the paper (which we replicated in the section \"validation of early heads\").\n\nIt turns out that they're acting as induction heads on this distribution, but not in general. A simple way we can support this hypothesis is to look at attention patterns (we find that `S2` pays attention to `S1+1` in both head `5.8` and `5.9`).\n</details>\n\n<details>\n<summary>Aside - a lesson in nonlinearity</summary>\n\nIn the dropdown above, I claimed that `5.8` and `5.9` were doing induction on this distribution. A more rigorous way to test this would be to path patch to the keys of these heads, and see if either of the previous token heads have a large effect. If they do, this is very strong evidence for induction. However, it turns out that neither of the prev token heads affect the model's IOI performance via their path through the fuzzy induction heads. Does this invalidate our hypothesis?\n\nIn fact, no, because of nonlinearity. The two prev token heads `2.2` and `4.11` will be adding onto the **logits** used to calculate the attention probability from `S2` to `S1+1`, rather than adding onto the probabilities directly. SO it might be the case that one head on its own doesn't increase the attention probability very much, both both heads acting together significantly increase it. (Motivating example: suppose we only had 2 possible source tokens, without either head acting the logits are `[0.0, -8.0]`, and the action of each head is to add `4.0` to the second logit. If one head acts then the probability on the second token goes from basically zero to `0.018` (which will have a very small impact on the attention head's output), but if both heads are acting then the logits are equal and the probability is `0.5` (which obviously has a much larger effect)).\n\nThis is in fact what I found here - after modifying the path patching function to allow more than one sender head, I found that patching from both `2.2` and `4.11` to `5.8` and `5.9` had a larger effect on the model's IOI performance than patching from either head alone (about a 1% drop in performance for both vs almost 0% for either individually). The same effect can be found when we patch from these heads to all four induction heads, although it's even more pronounced (a 3% and 15% drop respectively for the heads individually, vs 31% for both).\n</details>", "index": 238, "line_start": 5217, "score": 3.616544463388083e-05, "sentence_scores": [{"score": 4.509104876536853e-05, "sentence": "<details>"}, {"score": 9.460313658603079e-05, "sentence": "<summary>Hint</summary>"}, {"score": 0.0002423134469785095, "sentence": "Recall the path patching section, where you applied patching from attention heads' outputs to the value inputs to the S-inhibition heads (hopefully replicating figure 4b from the paper)."}, {"score": 0.00012343430248480525, "sentence": "Try patching the **keys** of the S-inhibition heads instead."}, {"score": 0.00019483265277736076, "sentence": "Do heads `5.8` and `5.9` stand out here?"}, {"score": 3.480995562106834e-05, "sentence": "</details>"}, {"score": 3.921858574793838e-05, "sentence": "<details>"}, {"score": 4.411418164895552e-05, "sentence": "<summary>Answer</summary>"}, {"score": 0.00010036901637660072, "sentence": "After making the plot suggested in the hint, you should find that patching from `5.8` and `5.9` each have around a 5% negative impact on the logit difference if you patch from them to the S-inhibition heads."}, {"score": 5.453181071070512e-05, "sentence": "We'd like to conclude that these are induction heads, and they're acting to increase the attention paid by `end` to `S2`."}, {"score": 4.005274428841536e-05, "sentence": "Unfortunately, they don't seem to be induction heads according to the results of figure 18 in the paper (which we replicated in the section \"validation of early heads\")."}, {"score": 2.723792682144537e-05, "sentence": "It turns out that they're acting as induction heads on this distribution, but not in general."}, {"score": 7.109856242518795e-05, "sentence": "A simple way we can support this hypothesis is to look at attention patterns (we find that `S2` pays attention to `S1+1` in both head `5.8` and `5.9`)."}, {"score": 2.8302840688912583e-05, "sentence": "</details>"}, {"score": 3.4011340747182156e-05, "sentence": "<details>"}, {"score": 3.446535035849708e-05, "sentence": "<summary>Aside - a lesson in nonlinearity</summary>"}, {"score": 4.7178769326093426e-05, "sentence": "In the dropdown above, I claimed that `5.8` and `5.9` were doing induction on this distribution."}, {"score": 2.9041629614693933e-05, "sentence": "A more rigorous way to test this would be to path patch to the keys of these heads, and see if either of the previous token heads have a large effect."}, {"score": 3.9455426416292895e-05, "sentence": "If they do, this is very strong evidence for induction."}, {"score": 5.03529585492284e-0 , vs 31% for both)."}, {"score": 0.0006883715032630803, "sentence": "</details>"}]}, {"content": "Another fascinating anomaly is that of the **backup name mover heads**. A standard technique to apply when interpreting model internals is ablations, or knock-out. If we run the model but intervene to set a specific head to zero, what happens? If the model is robust to this intervention, then naively we can be confident that the head is not doing anything important, and conversely if the model is much worse at the task this suggests that head was important. There are several conceptual flaws with this approach, making the evidence only suggestive, e.g. that the average output of the head may be far from zero and so the knockout may send it far from expected activations, breaking internals on *any* task. But it's still an Hooked technique to apply to give some data.\n\nBut a wild finding in the paper is that models have **built in redundancy**. If we knock out one of the name movers, then there are some backup name movers in later layers that *change their behaviour* and do (some of) the job of the original name mover head. This means that naive knock-out will significantly underestimate the importance of the name movers.", "index": 240, "line_start": 5255, "score": 7.519211175343425e-05, "sentence_scores": [{"score": 0.00011448970677304463, "sentence": "Another fascinating anomaly is that of the **backup name mover heads**."}, {"score": 8.526339977868974e-05, "sentence": "A standard technique to apply when interpreting model internals is ablations, or knock-out."}, {"score": 7.165445243181887e-05, "sentence": "If we run the model but intervene to set a specific head to zero, what happens?"}, {"score": 8.176256446797889e-05, "sentence": "If the model is robust to this intervention, then naively we can be confident that the head is not doing anything important, and conversely if the model is much worse at the task this suggests that head was important."}, {"score": 7.707507940710942e-05, "sentence": "There are several conceptual flaws with this approach, making the evidence only suggestive, e.g."}, {"score": 8.534162193212201e-05, "sentence": "that the average output of the head may be far from zero and so the knockout may send it far from expected activations, breaking internals on *any* task."}, {"score": 7.510916511459728e-05, "sentence": "But it's still an Hooked technique to apply to give some data."}, {"score": 9.631566952136842e-05, "sentence": "But a wild finding in the paper is that models have **built in redundancy**."}, {"score": 0.00011469462616024767, "sentence": "If we knock out one of the name movers, then there are some backup name movers in later layers that *change their behaviour* and do (some of) the job of the original name mover head."}, {"score": 0.0001986338503866004, "sentence": "This means that naive knock-out will significantly underestimate the importance of the name movers."}]}, {"content": "Let's test this! Let's ablate the most important name mover (which is `9.9`, as the code below verifies for us) on just the `end` token, and compare performance.", "index": 241, "line_start": 5265, "score": 0.001031336115717182, "sentence_scores": [{"score": 0.006483450897990782, "sentence": "Let's test this!"}, {"score": 0.0074283495088044585, "sentence": "Let's ablate the most important name mover (which is `9.9`, as the code below verifies for us) on just the `end` token, and compare performance."}]}, {"content": "<pre style=\"white-space:pre;overflow-x:auto;line-height:normal;font-family:Menlo,'DejaVu Sans Mono',consolas,'Courier New',monospace\">Top Name Mover to ablate: 9.9\n\n<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">2.8052</span> = Original logit diff\n<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">1.7086</span> = Direct Logit Attribution of top name mover head\n<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">1.0966</span> = Naive prediction of post ablation logit diff\n<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">2.6290</span> = Logit diff after ablating L9H9\n</pre>", "index": 243, "line_start": 5329, "score": 0.0004005671099538888, "sentence_scores": [{"score": 0.00546570158253467, "sentence": "<pre style=\"white-space:pre;overflow-x:auto;line-height:normal;font-family:Menlo,'DejaVu Sans Mono',consolas,'Courier New',monospace\">Top Name Mover to ablate: 9.9"}, {"score": 0.004662000859375376, "sentence": "<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">2.8052</span> = Original logit diff"}, {"score": 0.004977805261683622, "sentence": "<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">1.7086</span> = Direct Logit Attribution of top name mover head"}, {"score": 0.004934009940406001, "sentence": "<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">1.0966</span> = Naive prediction of post ablation logit diff"}, {"score": 0.005570473154317443, "sentence": "<span style=\"color: #008080; text-decoration-color: #008080; font-weight: bold\">2.6290</span> = Logit diff after ablating L9H9"}, {"score": 0.0033831436568798946, "sentence": "</pre>"}]}, {"content": "What's going on here? We calculate the logit diff for our full model, and how much of that is coming directly from head `9.9`. Given this, we come up with an estimate for what the logit diff will fall to when we ablate this head. In fact, performance is **much** better than this naive prediction.\n\nWhy is this happening? As before, we can look at the direct logit attribution of each head to get a sense of what's going on.", "index": 244, "line_start": 5343, "score": 0.00023549689500923382, "sentence_scores": [{"score": 0.0008124628177369402, "sentence": "What's going on here?"}, {"score": 0.001223154335102004, "sentence": "We calculate the logit diff for our full model, and how much of that is coming directly from head `9.9`."}, {"score": 0.001284117612462732, "sentence": "Given this, we come up with an estimate for what the logit diff will fall to when we ablate this head."}, {"score": 0.001334116224649269, "sentence": "In fact, performance is **much** better than this naive prediction."}, {"score": 0.000914347281554039, "sentence": "Why is this happening?"}, {"score": 0.0012655279279923488, "sentence": "As before, we can look at the direct logit attribution of each head to get a sense of what's going on."}]}, {"content": "The first plots show us that, after we ablate head `9.9`, while its direct contribution to the logit diff falls (obviously), a lot of contributions from other heads (particularly in layer 10) actually increase. The second plot shows this in a different way (the distinctive heads in the right hand heatmap are the same as the heads lying well below the y=x line in the scatter plot).\n\nOne natural hypothesis is that this is because the final LayerNorm scaling has changed, which can scale up or down the final residual stream. This is slightly true, and we can see that the typical head is a bit off from the x=y line. But the average LN scaling ratio is 1.04, and this should uniformly change *all* heads by the same factor, so this can't be sufficient.", "index": 247, "line_start": 5433, "score": 1.6455182730201e-05, "sentence_scores": [{"score": 3.9333068579582915e-05, "sentence": "The first plots show us that, after we ablate head `9.9`, while its direct contribution to the logit diff falls (obviously), a lot of contributions from other heads (particularly in layer 10) actually increase."}, {"score": 2.4499116136504094e-05, "sentence": "The second plot shows this in a different way (the distinctive heads in the right hand heatmap are the same as the heads lying well below the y=x line in the scatter plot)."}, {"score": 2.7854942096452812e-05, "sentence": "One natural hypothesis is that this is because the final LayerNorm scaling has changed, which can scale up or down the final residual stream."}, {"score": 2.240397020169167e-05, "sentence": "This is slightly true, and we can see that the typical head is a bit off from the x=y line."}, {"score": 2.8615839549714288e-05, "sentence": "But the average LN scaling ratio is 1.04, and this should uniformly change *all* heads by the same factor, so this can't be sufficient."}]}, {"content": "**Exercise to the reader:** Can you finish off this analysis? What's going on here? Why are the backup name movers changing their behaviour? Why is one negative name mover becoming significantly less important?", "index": 251, "line_start": 5499, "score": 4.170779015902009e-05, "sentence_scores": [{"score": 0.00017080550971520868, "sentence": "**Exercise to the reader:** Can you finish off this analysis?"}, {"score": 0.00014597032513888518, "sentence": "What's going on here?"}, {"score": 0.00016394141887508682, "sentence": "Why are the backup name movers changing their behaviour?"}, {"score": 0.0002002545940013759, "sentence": "Why is one negative name mover becoming significantly less important?"}]}, {"content": "In section A of the appendix (titled **Disentangling token and positional signal in the output of S-Inhibition Heads**), the authors attempt to figure out whether the S-Inhibition heads are using token or positional information to supress the attention paid to `S1`. This is illustrated in my IOI diagram, by purple vs pink boxes.\n\nThe way the authors find out which one is which is ingenious. They construct datasets from the original IOI dataset, with some of the signals erased or flipped. For instance, if they want to examine the effect of inverting the positional information but preserving the token information written by the S-inhibition heads, they can replace sentences like:\n\n```\nWhen Mary and John went to the store, John gave a drink to Mary\n```\n\nwith:\n\n```\nWhen John and Mary went to the store, John gave a drink to Mary\n```\n\nLet's be exactly clear on why this works. The information written to the `end` token position by the S-inhibition heads will be some combination of \"don't pay attention to the duplicated token\" and \"don't pay attention to the token that's in the same position as the duplicated token\". If we run our model on the first sentence above but then patch in the second sentence, then:\n\n* The **\"don't pay attention to the duplicated token\"** signal will be unchanged (because this signal still refers to John)\n* The **\"don't pay attention to the token that's in the same position as the duplicated token\"** signal will flip (because this information points to the position of `Mary` in the second sentence, hence to the position of `John` in the first sentence).", "index": 252, "line_start": 5507, "score": 2.6943180478807615e-05, "sentence_scores": [{"score": 0.00012062304287868885, "sentence": "In section A of the appendix (titled **Disentangling token and positional signal in the output of S-Inhibition Heads**), the authors attempt to figure out whether the S-Inhibition heads are using token or positional information to supress the attention paid to `S1`."}, {"score": 5.548838257962448e-05, "sentence": "This is illustrated in my IOI diagram, by purple vs pink boxes."}, {"score": 5.296488129580317e-05, "sentence": "The way the authors find out which one is which is ingenious."}, {"score": 6.200582978725563e-05, "sentence": "They construct datasets from the original IOI dataset, with some of the signals erased or flipped."}, {"score": 9.6491744028025e-05, "sentence": "For instance, if they want to examine the effect of inverting the positional information but preserving the token information written by the S-inhibition heads, they can replace sentences like:"}, {"score": 0.000618534632698002, "sentence": "```"}, {"score": 0.0003435032321165399, "sentence": "When Mary and John went to the store, John gave a drink to Mary"}, {"score": 0.0003431534886591712, "sentence": "```"}, {"s
