n't do much.\n\nIn this framing, it makes sense that MLP0 matters on `S2`, because that's the one position with a different input token (i.e. it has a different extended embedding between the two prompt versions, and all other tokens will have basically the same extended embeddings).\n\nWhy does this happen? It seems like most of the effect comes from the fact that **the embedding and unembedding matrices in GPT2-Small are tied**, i.e. the one equals the transpose of the other. On one hand this seems principled - if two words mean similar things (e.g. \"big\" and \"large\") then they should be substitutable, i.e. have similar embeddings and unembeddings. This would seem to suggest that the geometric structure of the embedding and unembedding spaces should be related. On the other hand, there's one major reason why this isn't as principled as it seems - the embedding and the unembedding together form the direct path (if we had no other components then the transformer would just be the linear map $x \\to x^T W_E W_U$), and we do not want this to be symmetric because bigram prediction isn't symmetric! As an example, if $W_E = W_U^T$ then in order to predict \"Barack Obama\" as a probable bigram, we'd also have to predict \"Obama Barack\" with equally high probability, which obviously shouldn't happen. So it makes sense that the first MLP layer might be used in part to overcome this asymmetry: we now think of $\\operatorname{MLP}_0(x^T W_E) W_U$ as the direct path, which is no longer symmetric when $W_E$ and $W_U$ are tied.", "index": 100, "line_start": 2004, "score": 1.5577978141385773e-05, "sentence_scores": [{"score": 0.00018513111722327872, "sentence": "It's often observed on GPT-2 Small that MLP0 matters a lot, and that ablating it utterly destroys performance."}, {"score": 8.926598287633595e-05, "sentence": "The current accepted hypothesis is that the first MLP layer is essentially acting as an **extension of the embedding**, and that when later layers want to access the input tokens they mostly read in the output of the first MLP layer, rather than the token embeddings."}, {"score": 9.523735310565539e-05, "sentence": "Within this frame, the first attention layer doesn't do much."}, {"score": 6.385245621443985e-05, "sentence": "In this framing, it makes sense that MLP0 matters on `S2`, because that's the one position with a different input token (i.e."}, {"score": 5.353339975395325e-05, "sentence": "it has a different extended embedding between the two prompt versions, and all other tokens will have basically the same extended embeddings)."}, {"score": 4.7581201785331436e-05, "sentence": "Why does this happen?"}, {"score": 7.168893400343734e-05, "sentence": "It seems like most of the effect comes from the fact that **the embedding and unembedding matrices in GPT2-Small are tied**, i.e."}, {"score": 6.307832049805245e-05, "sentence": "the one equals the transpose of the other."}, {"score": 6.948937765305202e-05, "sentence": "On one hand this seems principled - if two words mean similar things (e.g."}, {"score": 9.799851712711264e-05, "sentence": "\"big\" and \"large\") then they should be substitutable, i.e."}, {"score": 5.6554923795600753e-05, "sentence": "have similar embeddings and unembeddings."}, {"score": 5.944922337871428e-05, "sentence": "This would seem to suggest that the geometric structure of the embedding and unembedding spaces should be related."}, {"score": 9.031590565684385e-05, "sentence": "On the other hand, there's one major reason why this isn't as principled as it seems - the embedding and the unembedding together form the direct path (if we had no other components then the transformer would just be the linear map $x \\to x^T W_E W_U$), and we do not want this to be symmetric because bigram prediction isn't symmetric!"}, {"score": 0.00018612845765218305, "sentence": "As an example, if $W_E = W_U^T$ then in order to predict \"Barack Obama\" as a probable bigram, we'd also have to predict \"Obama Barack\" with equally high probability, which obviously shouldn't happen."}, {"score": 0.0006034504507182174, "sentence": "So it makes sense that the first MLP layer might be used in part to overcome this asymmetry: we now think of $\\operatorname{MLP}_0(x^T W_E) W_U$ as the direct path, which is no longer symmetric when $W_E$ and $W_U$ are tied."}]}, {"content": "If you want, you can implement the `get_act_patch_resid_pre` function for fun, although it's similar enough to the previous exercise that doing this isn't compulsory.", "index": 101, "line_start": 2018, "score": 0.0002111108895495544, "sentence_scores": [{"score": 0.0012680667267335436, "sentence": "If you want, you can implement the `get_act_patch_resid_pre` function for fun, although it's similar enough to the previous exercise that doing this isn't compulsory."}]}, {"content": "We can refine the above analysis by patching in individual heads! This is somewhat more annoying, because there are now three dimensions `(head_index, position and layer)`.\n\nThe code below patches a head's output over all sequence positions, and returns the results (for each head in the model).", "index": 106, "line_start": 2139, "score": 7.379890347468001e-05, "sentence_scores": [{"score": 0.00019367970784689719, "sentence": "We can refine the above analysis by patching in individual heads!"}, {"score": 0.00020960941459474008, "sentence": "This is somewhat more annoying, because there are now three dimensions `(head_index, position and layer)`."}, {"score": 0.00029837375212982077, "sentence": "The code below patches a head's output over all sequence positions, and returns the results (for each head in the model)."}]}, {"content": "<details>\n<summary>Question - what are the interpretations of this graph? Which heads do you think are important?</summary>\n\nWe see some of the heads that we observed in our attention plots at the end of last section (e.g. `9.9` having a large positive score, and `10.7` having a large negative score). But we can also see some other important heads, for instance:\n\n* In layers 7-8 there are several important heads. We might deduce that these are the ones responsible for moving information from `S2` to `end`.\n* In the earlier layers, there are some more important heads (e.g. `3.0` and `5.5`). We might guess these are performing some primitive logic, e.g. causing the second `\" John\"` token to attend to previous instances of itself.\n\n</details>", "index": 110, "line_start": 2196, "score": 9.959437255011526e-05, "sentence_scores": [{"score": 0.00034495004053581603, "sentence": "<details>"}, {"score": 0.0002803720727948483, "sentence": "<summary>Question - what are the interpretations of this graph?"}, {"score": 0.00021333390570012345, "sentence": "Which heads do you think are important?</summary>"}, {"score": 0.0003619433172729721, "sentence": "We see some of the heads that we observed in our attention plots at the end of last section (e.g."}, {"score": 0.00047645800012508627, "sentence": "`9.9` having a large positive score, and `10.7` having a large negative score)."}, {"score": 0.00020334610076103374, "sentence": "But we can also see some other important heads, for instance:"}, {"score": 0.0003168564841234099, "sentence": "* In layers 7-8 there are several important heads."}, {"score": 0.0003116993415719299, "sentence": "We might deduce that these are the ones responsible for moving information from `S2` to `end`."}, {"score": 0.00020279347753469635, "sentence": "* In the earlier layers, there are some more important heads (e.g."}, {"score": 0.0004441489354881111, "sentence": "`3.0` and `5.5`)."}, {"score": 0.00039015092576570566, "sentence": "We might guess these are performing some primitive logic, e.g."}, {"score": 0.0006591696570730411, "sentence": "causing the second `\" John\"` token to attend to previous instances of itself."}, {"score": 0.0006311782479973291, "sentence": "</details>"}]}, {"content": "You should implement your own version of this patching function below.\n\nYou'll need to define a new hook function, but most of the code from the previous exercise should be reusable.", "index": 111, "line_start": 2212, "score": 0.0005062724624274586, "sentence_scores": [{"score": 0.00644163588765995, "sentence": "You should implement your own version of this patching function below."}, {"score": 0.004621296751567933, "sentence": "You'll need to define a new hook function, but most of the code from the previous exercise should be reusable."}]}, {"content": "Finally, we'll look at one more example of activation patching.\n\nDecomposing attention layers into patching in individual heads has already helped us localise the behaviour a lot. But we can understand it further by decomposing heads. An attention head consists of two semi-independent operations - calculating *where* to move information from and to (represented by the attention pattern and implemented via the QK-circuit) and calculating *what* information to move (represented by the value vectors and implemented by the OV circuit). We can disentangle which of these is important by patching in just the attention pattern *or* the value vectors. See [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) or [Neel's walkthrough video](https://www.youtube.com/watch?v=KV5gbOmHbjU) for more on this decomposition.", "index": 117, "line_start": 2365, "score": 6.062565822952444e-05, "sentence_scores": [{"score": 0.00016810640232652367, "sentence": "Finally, we'll look at one more example of activation patching."}, {"score": 0.0001094987915782781, "sentence": "Decomposing attention layers into patching in individual heads has already helped us localise the behaviour a lot."}, {"score": 6.249880764020731e-05, "sentence": "But we can understand it further by decomposing heads."}, {"score": 9.714403243612058e-05, "sentence": "An attention head consists of two semi-independent operations - calculating *where* to move information from and to (represented by the attention pattern and implemented via the QK-circuit) and calculating *what* information to move (represented by the value vectors and implemented by the OV circuit)."}, {"score": 7.916351319743592e-05, "sentence": "We can disentangle which of these is important by patching in just the attention pattern *or* the value vectors."}, {"score": 0.0009853259933983167, "sentence": "See [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) or [Neel's walkthrough video](https://www.youtube.com/watch?v=KV5gbOmHbjU) for more on this decomposition."}]}, {"content": "A useful function for doing this is `get_act_patch_attn_head_all_pos_every`. Rather than just patching on head output (like the previous one), it patches on:\n* Output (this is equivalent to patching the value the head writes to the residual stream)\n* Querys (i.e. the patching the query vectors, without changing the key or value vectors)\n* Keys\n* Values\n* Patterns (i.e. the attention patterns).\n\nAgain, note that this function isn't patching multiple things at once. It's looping through each of these five, and getting the results from patching them one at a time.", "index": 118, "line_start": 2375, "score": 2.6670359450476945e-05, "sentence_scores": [{"score": 0.00028795990226736733, "sentence": "A useful function for doing this is `get_act_patch_attn_head_all_pos_every`."}, {"score": 7.4858271022977e-05, "sentence": "Rather than just patching on head output (like the previous one), it patches on:"}, {"score": 0.00015255857662657788, "sentence": "* Output (this is equivalent to patching the value the head writes to the residual stream)"}, {"score": 0.00012489118593494829, "sentence": "* Querys (i.e."}, {"score": 9.589772740832632e-05, "sentence": "the patching the query vectors, without changing the key or value vectors)"}, {"score": 0.00010224491699862609, "sentence": "* Keys"}, {"score": 5.538678898377774e-05, "sentence": "* Values"}, {"score": 0.00010674591222469592, "sentence": "* Patterns (i.e."}, {"score": 0.00016228980511843848, "sentence": "the attention patterns)."}, {"score": 4.8871905355334295e-05, "sentence": "Again, note that this function isn't patching multiple things at once."}, {"score": 7.624286834662095e-05, "sentence": "It's looping through each of these five, and getting the results from patching them one at a time."}]}, {"content": "Again, if you want to implement this yourself then you can do so below, but it isn't a compulsory exercise because it isn't conceptually different from the previous exercises. If you don't implement it, then you should still look at the solution to make sure you understand what's going on.", "index": 122, "line_start": 2442, "score": 1.5525807043846334e-05, "sentence_scores": [{"score": 2.0652761876460796e-05, "sentence": "Again, if you want to implement this yourself then you can do so below, but it isn't a compulsory exercise because it isn't conceptually different from the previous exercises."}, {"score": 1.621238107097017e-05, "sentence": "If you don't implement it, then you should still look at the solution to make sure you understand what's going on."}]}, {"content": "Note - we can do this in an even more fine-grained way; the function `patching.get_act_patch_attn_head_by_pos_every` (i.e. same as above but replacing `all_pos` with `by_pos`) will give you the same decomposition, but by sequence position *as well as* by layer, head and component. The same holds for the `patching.get_act_patch_attn_head_out_all_pos` function earlier (replace `all_pos` with `by_pos`). These functions are unsurprisingly pretty slow though!", "index": 126, "line_start": 2573, "score": 4.7991966383466565e-05, "sentence_scores": [{"score": 6.39258199006928e-05, "sentence": "Note - we can do this in an even more fine-grained way; the function `patching.get_act_patch_attn_head_by_pos_every` (i.e."}, {"score": 5.0001062955460646e-05, "sentence": "same as above but replacing `all_pos` with `by_pos`) will give you the same decomposition, but by sequence position *as well as* by layer, head and component."}, {"score": 5.056034672841936e-05, "sentence": "The same holds for the `patching.get_act_patch_attn_head_out_all_pos` function earlier (replace `all_pos` with `by_pos`)."}, {"score": 4.084674209329468e-05, "sentence": "These functions are unsurprisingly pretty slow though!"}]}, {"content": "This plot has some striking features. For instance, this shows us that we have at least three different groups of heads:\n\n* Earlier heads (`3.0`, `5.5`, `6.9`) which matter because of their attention patterns (specifically their query vectors).\n* Middle heads in layers 7 & 8 (`7.3`, `7.9`, `8.6`, `8.10`) seem to matter more because of their value vectors.\n* Later heads which improve the logit difference (`9.9`, `10.0`), which matter because of their query vectors.\n\nQuestion - what is the significance of the results for the middle heads (i.e. the important ones in layers 7 & 8)? In particular, how should we interpret the fact that value patching has a much bigger effect than the other two forms of patching?\n\n*Hint - if you're confused, try plotting the attention patterns of heads `7.3`, `7.9`, `8.6`, `8.10`. You can mostly reuse the code from above when we displayed the output of attention heads.*\n\n\n\n<details>\n<summary>Answer</summary>\n\nThe attention patterns show us that these heads attend from `END` to `S2`, so we can guess that they're responsible for moving information from `S2` to `END` which is used to determine the answer. This agrees with our earlier results, when we saw that most of the information gets moved over layers 7 & 8.\n\nThe fact that value patching is the most important thing for them suggests that the interesting computation goes into **what information they move from `S2` to `end`**, rather than **why `end` attends to `S2`**. See the diagram below if you're confused why we can draw this inference.\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/k-vs-v-patching-explained.png\" width=\"900\">\n\n</details>", "index": 127, "line_start": 2581, "score": 8.835085001599881e-06, "sentence_scores": [{"score": 0.021201516703401254, "sentence": "This plot has some striking features."}, {"score": 0.00013586747686401382, "sentence": "For instance, this shows us that we have at least three different groups of heads:"}, {"score": 0.000243131681455223, "sentence": "* Earlier heads (`3.0`, `5.5`, `6.9`) which matter because of their attention patterns (specifically their query vectors)."}, {"score": 0.0002217451366025309, "sentence": "* Middle heads in layers 7 & 8 (`7.3`, `7.9`, `8.6`, `8.10`) seem to matter more because of their value vectors."}, {"score": 0.00023021293227230377, "sentence": "* Later heads which improve the logit difference (`9.9`, `10.0`), which matter because of their query vectors."}, {"score": 3.117368300207408e-05, "sentence": "Question - what is the significance of the results for the middle heads (i.e."}, {"score": 0.00011259259822598694, "sentence": "the important ones in layers 7 & 8)?"}, {"score": 3.583206441114264e-05, "sentence": "In particular, how should we interpret the fact that value patching has a much bigger effect than the other two forms of patching?"}, {"score": 8.545760351848103e-05, "sentence": "*Hint - if you're confused, try plotting the attention patterns of heads `7.3`, `7.9`, `8.6`, `8.10`."}, {"score": 6.360806307926216e-05, "sentence": "You can mostly reuse the code from above when we displayed the output of attention heads."}, {"score": 2.249116037022864e-05, "sentence": "*"}, {"score": 6.778703001079999e-05, "sentence": "<details>"}, {"score": 3.581329475407334e-05, "sentence": "<summary>Answer</summary>"}, {"score": 7.517046258942335e-05, "sentence": "The attention patterns show us that these heads attend from `END` to `S2`, so we can guess that they're responsible for moving information from `S2` to `END` which is used to determine the answer."}, {"score": 5.213113981646603e-05, "sentence": "This agrees with our earlier results, when we saw that most of the information gets moved over layers 7 & 8."}, {"score": 0.00010907655086511269, "sentence": "The fact that value patching is the most important thing for them suggests that the interesting computation goes into **what information they move from `S2` to `end`**, rather than **why `end` attends to `S2`**."}, {"score": 8.303542688746946e-05, "sentence": "See the diagram below if you're confused why we can draw this inference."}, {"score": 0.0006405092645651313, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/k-vs-v-patching-explained.png\" width=\"900\">"}, {"score": 0.0008651057841924755, "sentence": "</details>"}]}, {"content": "OK, let's zoom out and reconsolidate. Here's a recap of the most important observations we have so far:\n\n* Heads `9.9`, `9.6`, and `10.0` are the most important heads in terms of directly writing to the residual stream. In all these heads, the `END` attends strongly to the `IO`.\n    * We discovered this by taking the values written by each head in each layer to the residual stream, and projecting them along the logit diff direction by using `residual_stack_to_logit_diff`. We also looked at attention patterns using `circuitsvis`.\n    * <span style=\"color:darkorange\">**This suggests that these heads are copying `IO` to `end`, to use it as the predicted next token.**</span>\n    * The question then becomes *\"how do these heads know to attend to this token, and not attend to `S`?\"*\n\n<br>\n\n* All the action is on `S2` until layer 7 and then transitions to `END`. And that attention layers matter a lot, MLP layers not so much (apart from MLP0, likely as an extended embedding).\n    * We discovered this by doing **activation patching** on `resid_pre`, `attn_out`, and `mlp_out`.\n    * <span style=\"color:darkorange\">**This suggests that there is a cluster of heads in layers 7 & 8, which move information from `S2` to `END`. We deduce that this information is how heads `9.9`, `9.6` and `10.0` know to attend to `IO`.**</span>\n    * The question then becomes *\"what is this information, how does it end up in the `S2` token, and how does `END` know to attend to it?\"*\n\n<br>\n\n* The significant heads in layers 7 & 8 are `7.3`, `7.9`, `8.6`, `8.10`. These heads have high activation patching values for their value vectors, less so for their queries and keys.\n    * We discovered this by doing **activation patching** on the value inputs for these heads.\n    * <span style=\"color:darkorange\">**This supports the previous observation, and it tells us that the interesting computation goes into *what gets moved* from `S2` to `END`, rather than the fact that `END` attends to `S2`.**</span>.\n    * We still don't know: *\"what is this information, and how does it end up in the `S2` token?\"*\n\n<br>\n\n* As well as the 2 clusters of heads given above, there's a third cluster of important heads: early heads (e.g. `3.0`, `5.5`, `6.9`) whose query vectors are particularly important for getting good performance.\n    * We discovered this by doing **activation patching** on the query inputs for these heads.", "index": 129, "line_start": 2641, "score": 0.00010163311659549234, "sentence_scores": [{"score": 0.0019898950775208936, "sentence": "OK, let's zoom out and reconsolidate."}, {"score": 0.00022929713348998512, "sentence": "Here's a recap of the most important observations we have so far:"}, {"score": 0.00031752534490253647, "sentence": "* Heads `9.9`, `9.6`, and `10.0` are the most important heads in terms of directly writing to the residual stream."}, {"score": 0.00022633256283669073, "sentence": "In all these heads, the `END` attends strongly to the `IO`."}, {"score": 0.00022940289989461404, "sentence": "* We discovered this by taking the values written by each head in each layer to the residual stream, and projecting them along the logit diff direction by using `residual_stack_to_logit_diff`."}, {"score": 0.00025306007455774474, "sentence": "We also looked at attention patterns using `circuitsvis`."}, {"score": 0.00017837624602938347, "sentence": "* <span style=\"color:darkorange\">**This suggests that these heads are copying `IO` to `end`, to use it as the predicted next token."}, {"score": 0.00010013153993842629, "sentence": "**</span>"}, {"score": 0.00020111697122610577, "sentence": "* The question then becomes *\"how do these heads know to attend to this token, and not attend to `S`?"}, {"score": 0.00012654712863368497, "sentence": "\"*"}, {"score": 8.412961230880095e-05, "sentence": "<br>"}, {"score": 0.00017459672851412485, "sentence": "* All the action is on `S2` until layer 7 and then transitions to `END`."}, {"score": 0.00013389295279165334, "sentence": "And that attention layers matter a lot, MLP layers not so much (apart from MLP0, likely as an extended embedding)."}, {"score": 0.00028726479302515625, "sentence": "* We discovered this by doing **activation patching** on `resid_pre`, `attn_out`, and `mlp_out`."}, {"score": 0.00027064975842690876, "sentence": "* <span style=\"color:darkorange\">**This suggests that there is a cluster of heads in layers 7 & 8, which move information from `S2` to `END`."}, {"score": 0.0002867673529482135, "sentence": "We deduce that this information is how heads `9.9`, `9.6` and `10.0` know to attend to `IO`."}, {"score": 8.022814470147436e-05, "sentence": "**</span>"}, {"score": 0.0001242407357780948, "sentence": "* The question then becomes *\"what is this information, how does it end up in the `S2` token, and how does `END` know to attend to it?"}, {"score": 5.260120739413883e-05, "sentence": "\"*"}, {"score": 0.00010552544979192406, "sentence": "<br>"}, {"score": 0.00019875217222594757, "sentence": "* The significant heads in layers 7 & 8 are `7.3`, `7.9`, `8.6`, `8.10`."}, {"score": 0.00011419895731233278, "sentence": "These heads have high activation patching values for their value vectors, less so for their queries and keys."}, {"score": 4.935308331938465e-05, "sentence": "* We discovered this by doing **activation patching** on the value inputs for these heads."}, {"score": 5.570078716081324e-05, "sentence": "* <span style=\"color:darkorange\">**This supports the previous observation, and it tells us that the interesting computation goes into *what gets moved* from `S2` to `END`, rather than the fact that `END` attends to `S2`.**</span>."}, {"score": 5.6786742562565285e-05, "sentence": "* We still don't know: *\"what is this information, and how does it end up in the `S2` token?"}, {"score": 2.510150754971166e-05, "sentence": "\"*"}, {"score": 3.0888200907296726e-05, "sentence": "<br>"}, {"score": 5.423306304437013e-05, "sentence": "* As well as the 2 clusters of heads given above, there's a third cluster of important heads: early heads (e.g."}, {"score": 0.0001084802961656961, "sentence": "`3.0`, `5.5`, `6.9`) whose query vectors are particularly important for getting good performance."}, {"score": 7.502111899150334e-05, "sentence": "* We discovered this by doing **activation patching** on the query inputs for these heads."}]}, {"content": "With all this in mind, can you come up with a theory for what these three heads are doing, and come up with a simple model of the whole circuit?\n\n*Hint - if you're still stuck, try plotting the attention pattern of head `3.0`. The patterns of `5.5` and `6.9` might seem a bit confusing at first (they add complications to the \"simplest possible picture\" of how the circuit works); we'll discuss them later so they don't get in the way of understanding the core of the circuit.*\n\n<details>\n<summary>Answer (and simple diagram of circuit)</summary>\n\nIf you plotted the attention pattern for head `3.0`, you should have seen that `S2` paid attention to `S1`. This suggests that the early heads are detecting when the destination token is a duplicate. So the information that the subject is a duplicate gets stored in `S2`.\n\nHow can the information that the subject token is a duplicate help us predict the token after `end`? Well, the correct answer (the `IO` token) is the non-duplicated token. So we can infer that the information that the subject token is a duplicate is used to *inhibit* the attention of the late heads to the duplicated token, and they instead attend to the non-duplicated token.\n\nTo summarise the second half of the circuit: information about this duplicated token is then moved from `S2` to `end` by the middle cluster of heads `7.3`, `7.9`, `8.6` and `8.10`, and this information goes into the queries of the late heads `9.9`, `9.6` and `10.0`, making them *inhibit* their attention to the duplicated token. Instead, they attend to `IO` (copying this token directly to the logits).\n\nThis picture of the circuit turns out to be mostly right. It misses out on some subtleties which we'll discuss shortly, but it's a good rough picture to have in your head. We might illustrate this as follows:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-simple.png\" width=\"1000\">\n\nExplanation:\n\n* We call the early heads **DTH** (duplicate token heads), their job is to detect that `S2` is a duplicate.\n* The second group of heads are called **SIH** (S-inhibition heads), their job is to move the duplicated token information from `S2` to `END`. We've illustrated this as them moving the positional information, but in principle this could also be token embedding information (more on this in the final section).\n* The last group of heads are called **NMH** (name mover heads), their job is to copy the `IO` token to the `END` token, where it is used as the predicted next token (thanks to the S-inihbition heads, these heads don't pay attention to the `S` token).\n\nNote - if you're still confused about how to interpret this diagram, but you understand induction circuits and how they work, it might help to compare this diagram to one written in the same style which I made for [induction circuits](https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ih-simple.png). Also, if you've read my induction heads [LessWrong post](https://www.lesswrong.com/posts/TvrfY4c9eaGLeyDkE/induction-heads-illustrated) and you're confused about how this style of diagram is different from that one, [here](https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ih-compared.png) is an image comparing the two diagrams (for induction heads) and explaining how they differ.\n\n</details>", "index": 130, "line_start": 2673, "score": 5.328384488262243e-05, "sentence_scores": [{"score": 0.00011290253441302288, "sentence": "With all this in mind, can you come up with a theory for what these three heads are doing, and come up with a simple model of the whole circuit?"}, {"score": 0.00010661517359765828, "sentence": "*Hint - if you're still stuck, try plotting the attention pattern of head `3.0`."}, {"score": 9.866915114540922e-05, "sentence": "The patterns of `5.5` and `6.9` might seem a bit confusing at first (they add complications to the \"simplest possible picture\" of how the circuit works); we'll discuss them later so they don't get in the way of understanding the core of the circuit."}, {"score": 1.4690563648960649e-05, "sentence": "*"}, {"score": 6.127993001823513e-05, "sentence": "<details>"}, {"score": 7.313306281582274e-05, "sentence": "<summary>Answer (and simple diagram of circuit)</summary>"}, {"score": 0.00011543645979840224, "sentence": "If you plotted the attention pattern for head `3.0`, you should have seen that `S2` paid attention to `S1`."}, {"score": 0.00017085437761080755, "sentence": "This suggests that the early heads are detecting when the destination token is a duplicate."}, {"score": 7.537586229781505e-05, "sentence": "So the information that the subject is a duplicate gets stored in `S2`."}, {"score": 8.280301000922794e-05, "sentence": "How can the information am of large circuit</summary>\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-full-c.png\" width=\"1250\">\n</details>", "index": 131, "line_start": 2706, "score": 3.1915803369196744e-05, "sentence_scores": [{"score": 0.00012177799291569062, "sentence": "Now, let's flesh out this picture a bit more by comparing our results to the paper results."}, {"score": 8.440594271166112e-05, "sentence": "Below is a more complicated version of the diagram in the dropdown above, which also labels the important heads."}, {"score": 0.0002400003207009374, "sentence": "The diagram is based on the paper's [original diagram](https://res.cloudinary.com/lesswrong-2-0/image/upload/v1672942728/mirroredImages/3ecs6duLmTfyra3Gp/h5icqzpyuhu4mqvfjhvw.png)."}, {"score": 8.434497255057143e-05, "sentence": "Don't worry if you don't understand everything in this diagram; the boundaries of the circuit are fuzzy and the \"role\" of every head is in this circuit is a leaky abstraction."}, {"score": 8.80613182070191e-05, "sentence": "Rather, this diagram is meant to point your intuitions in the right direction for better understanding this circuit."}, {"score": 0.000344624906091035, "sentence": "<details>"}, {"score": 0.0002993372682769394, "sentence": "<summary>Diagram of large circuit</summary>"}, {"score": 0.00046985772508712946, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-full-c.png\" width=\"1250\">"}, {"score": 0.0013355195294398208, "sentence": "</details>"}]}, {"content": "Here are the main ways it differs from the one above:", "index": 132, "line_start": 2720, "score": 0.0004836600470264644, "sentence_scores": [{"score": 0.0026737154907470464, "sentence": "Here are the main ways it differs from the one above:"}]}, {"content": "Rather than just having duplicate token heads in the first cluster of heads, we have two other types of heads as well: previous token heads and induction heads. The induction heads do the same thing as the duplicate token heads, via an induction mechanism. They cause token `S2` to attend to `S1+1` (mediated by the previous token heads), and their output is used as both a pointer to `S1` and as a signal that `S1` is duplicated (more on the distinction between these two in the paragraph \"Position vs token information being moved\" below).\n\n*(Note - the original paper's diagram implies the induction heads and duplicate token heads compose with each other. This is misleading, and is not the case.)*\n\nWhy are induction heads used in this circuit? We'll dig into this more in the bonus section, but one likely possibility is that induction heads are just a thing that forms very early on in training by default, and so it makes sense for the model to repurpose this already-existing machinery for this job. See [this paper](https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html) for more on induction heads, and how / why they form.", "index": 133, "line_start": 2728, "score": 5.754246115608265e-05, "sentence_scores": [{"score": 0.00010494329512052547, "sentence": "Rather than just having duplicate token heads in the first cluster of heads, we have two other types of heads as well: previous token heads and induction heads."}, {"score": 8.240000862216816e-05, "sentence": "The induction heads do the same thing as the duplicate token heads, via an induction mechanism."}, {"score": 9.168600316346273e-05, "sentence": "They cause token `S2` to attend to `S1+1` (mediated by the previous token heads), and their output is used as both a pointer to `S1` and as a signal that `S1` is duplicated (more on the distinction between these two in the paragraph \"Position vs token information being moved\" below)."}, {"score": 6.965614747551472e-05, "sentence": "*(Note - the original paper's diagram implies the induction heads and duplicate token heads compose with each other."}, {"score": 6.544628010728361e-05, "sentence": "This is misleading, and is not the case."}, {"score": 5.562460094613431e-05, "sentence": ")*"}, {"score": 8.174174783566984e-05, "sentence": "Why are induction heads used in this circuit?"}, {"score": 7.671773384462072e-05, "sentence": "We'll dig into this more in the bonus section, but one likely possibility is that induction heads are just a thing that forms very early on in training by default, and so it makes sense for the model to repurpose this already-existing machinery for this job."}, {"score": 0.00010706255902643231, "sentence": "See [this paper](https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html) for more on induction heads, and how / why they form."}]}, {"content": "Earlier, we saw that some heads in later layers were actually harming performance. These heads turn out to be doing something pretty similar to name mover heads, but in reverse (i.e. they inhibit the correct answer). It's not obvious why the model does this; the paper speculates that these heads might help the model \"hedge\" so as to avoid high cross-entropy loss when making mistakes.\n\nBackup name mover heads are possibly even weirder. It turns out that when we **ablate** the name mover heads, these ones pick up the slack and do the task anyway (even though they don't seem to do it when the NMHs aren't ablated). This is an example of **built-in redundancy** in the model. One possible explanation is that this resulted from the model being trained with dropout, although this explanation isn't fully satisfying (models trained without dropout still seem to have BNMHs, although they aren't as strong as they are in this model). Like with induction heads, we'll dig into this more in the final section.", "index": 134, "line_start": 2742, "score": 6.934253778537656e-06, "sentence_scores": [{"score": 0.00010389631507043812, "sentence": "Earlier, we saw that some heads in later layers were actually harming performance."}, {"score": 7.279266060078683e-05, "sentence": "These heads turn out to be doing something pretty similar to name mover heads, but in reverse (i.e."}, {"score": 0.000156236634751258, "sentence": "they inhibit the correct answer)."}, {"score": 0.00016384383165742993, "sentence": "It's not obvious why the model does this; the paper speculates that these heads might help the model \"hedge\" so as to avoid high cross-entropy loss when making mistakes."}, {"score": 0.00011133343910749213, "sentence": "Backup name mover heads are possibly even weirder."}, {"score": 4.57563348917241e-05, "sentence": "It turns out that when we **ablate** the name mover heads, these ones pick up the slack and do the task anyway (even though they don't seem to do it when the NMHs aren't ablated)."}, {"score": 3.746410008353977e-05, "sentence": "This is an example of **built-in redundancy** in the model."}, {"score": 3.2531837919039124e-05, "sentence": "One possible explanation is that this resulted from the model being trained with dropout, although this explanation isn't fully satisfying (models trained without dropout still seem to have BNMHs, although they aren't as strong as they are in this model)."}, {"score": 4.302338325344801e-05, "sentence": "Like with induction heads, we'll dig into this more in the final section."}]}, {"content": "There are 2 kinds of S-inhibition heads shown in the diagram - ones that inhibit based on positional information (pink), and ones that inhibit based on token information (purple). It's not clear which heads are doing which (and in fact some heads might be doing both!).\n\nThe paper has an ingenious way of teasing apart which type of information is being used by which of the S-inhibition heads, which we'll discuss in the final section.", "index": 135, "line_start": 2754, "score": 4.0605917782965215e-05, "sentence_scores": [{"score": 0.00021147136023021712, "sentence": "There are 2 kinds of S-inhibition heads shown in the diagram - ones that inhibit based on positional information (pink), and ones that inhibit based on token information (purple)."}, {"score": 0.000201087138526213, "sentence": "It's not clear which heads are doing which (and in fact some heads might be doing both!"}, {"score": 8.837298648320975e-05, "sentence": ")."}, {"score": 0.00020422106092295302, "sentence": "The paper has an ingenious way of teasing apart which type of information is being used by which of the S-inhibition heads, which we'll discuss in the final section."}]}, {"content": "When we did activation patching on the keys and values of S-inhibition heads, we found that the values were important and the keys weren't. We concluded that K-composition isn't really happening in these heads, and `END` must be paying attention to `S2` for reasons other than the duplicate token information (e.g. it might just be paying attention to the closest name, or to any names which aren't separated from it by a comma). Although this is mostly true, it turns out that there is a bit of K-composition happening in these heads. We can think of this as the duplicate token heads writing the \"duplicated\" flag to the residual stream (without containing any information about the identity and position of this token), and this flag is being used by the keys of the S-inhibition heads (i.e. they make `END` pay attention to `S2`). In the diagram, this is represented by the dark grey boxes (rather than just the light grey boxes we had in the simplified version). We haven't seen any evidence for this happening yet, but we will in the next section (when we look at path patching).\n\nNote - whether the early heads are writing positional information or \"duplicate flag\" information to the residual stream is not necessarily related to whether the head is an induction head or a duplicate token head. In principle, either type of head could write either type of information.", "index": 136, "line_start": 2766, "score": 4.015511682557051e-05, "sentence_scores": [{"score": 0.00023199621082086182, "sentence": "When we did activation patching on the keys and values of S-inhibition heads, we found that the values were important and the keys weren't."}, {"score": 0.00012950998465585526, "sentence": "We concluded that K-composition isn't really happening in these heads, and `END` must be paying attention to `S2` for reasons other than the duplicate token information (e.g."}, {"score": 0.00012366902733331966, "sentence": "it might just be paying attention to the closest name, or to any names which aren't separated from it by a comma)."}, {"score": 0.00011951723614601197, "sentence": "Although this is mostly true, it turns out that there is a bit of K-composition happening in these heads."}, {"score": 0.00014260325357210937, "sentence": "We can think of this as the duplicate token heads writing the \"duplicated\" flag to the residual stream (without containing any information about the identity and position of this token), and this flag is being used by the keys of the S-inhibition heads (i.e."}, {"score": 0.00018305005792696932, "sentence": "they make `END` pay attention to `S2`)."}, {"score": 8.64291139568208e-05, "sentence": "In the diagram, this is represented by the dark grey boxes (rather than just the light grey boxes we had in the simplified version)."}, {"score": 7.484631479101793e-05, "sentence": "We haven't seen any evidence for this happening yet, but we will in the next section (when we look at path patching)."}, {"score": 0.0001178722553370911, "sentence": "Note - whether the early heads are writing positional information or \"duplicate flag\" information to the residual stream is not necessarily related to whether the head is an induction head or a duplicate token head."}, {"score": 0.0001414080056994201, "sentence": "In principle, either type of head could write either type of information."}]}, {"content": "This section will be a lot less conceptual and exploratory than the last two sections, and a lot more technical and rigorous. You'll learn what path patching is and how it works, and you'll use it to replicate many of the paper's results (as well as some other paper results not related to path patching).", "index": 138, "line_start": 2786, "score": 5.3041979218597513e-05, "sentence_scores": [{"score": 0.00013765134040735535, "sentence": "This section will be a lot less conceptual and exploratory than the last two sections, and a lot more technical and rigorous."}, {"score": 0.00011560533345263318, "sentence": "You'll learn what path patching is and how it works, and you'll use it to replicate many of the paper's results (as well as some other paper results not related to path patching)."}]}, {"content": "Here, we'll be more closely following the setup that the paper's authors used, rather than the rough-and-ready exploration we used in the first few sections. To be clear, a lot of the rigour that we'll be using in the setup here isn't necessary if you're just starting to investigate a model's circuit. This rigour is necessary if you're publishing a paper, but it can take a lot of time and effort!", "index": 140, "line_start": 2802, "score": 0.0038432894030320554, "sentence_scores": [{"score": 0.0073223675133209515, "sentence": "Here, we'll be more closely following the setup that the paper's authors used, rather than the rough-and-ready exploration we used in the first few sections."}, {"score": 0.008923327605977636, "sentence": "To be clear, a lot of the rigour that we'll be using in the setup here isn't necessary if you're just starting to investigate a model's circuit."}, {"score": 0.008830293683055645, "sentence": "This rigour is necessary if you're publishing a paper, but it can take a lot of time and effort!"}]}, {"content": "The dataset we'll be using is an instance of `IOIDataset`, which is generated by randomly choosing names from the `NAMES` list (as well as sentence templates and objects from different lists). You can look at the `ioi_dataset.py` file to see details of how this is done.\n\n(Note - you can reduce `N` if you're getting memory errors from running this code. If you're still getting memory errors from `N = 10` then you're recommended to switch to Colab, or to use a virtual machine e.g. via Lambda Labs.)", "index": 142, "line_start": 2816, "score": 2.742057195829149e-05, "sentence_scores": [{"score": 6.842171781692652e-05, "sentence": "The dataset we'll be using is an instance of `IOIDataset`, which is generated by randomly choosing names from the `NAMES` list (as well as sentence templates and objects from different lists)."}, {"score": 6.566247209534041e-05, "sentence": "You can look at the `ioi_dataset.py` file to see details of how this is done."}, {"score": 3.1302358917910054e-05, "sentence": "(Note - you can reduce `N` if you're getting memory errors from running this code."}, {"score": 3.933444731932497e-05, "sentence": "If you're still getting memory errors from `N = 10` then you're recommended to switch to Colab, or to use a virtual machine e.g."}, {"score": 4.743317607079859e-05, "sentence": "via Lambda Labs.)"}]}, {"content": "This dataset has a few useful attributes & methods. Here are the main ones you should be aware of for these exercises:\n\n* `toks` is a tensor of shape `(batch_size, max_seq_len)` containing the token IDs (i.e. this is what you pass to your model)\n* `s_tokenIDs` and `io_tokenIDs` are lists containing the token IDs for the subjects and objects\n* `sentences` is a list containing the sentences (as strings)\n* `word_idx` is a dictionary mapping word types (e.g. `\"S1\"`, `\"S2\"`, `\"IO\"` or `\"end\"`) to tensors containing the positions of those words for each sequence in the dataset.\n    * This is particularly handy for indexing, since the positions of the subject, indirect object, and end tokens are no longer the same in every sentence like they were in previous sections.", "index": 144, "line_start": 2840, "score": 0.03156374747679994, "sentence_scores": [{"score": 0.1586800405678144, "sentence": "This dataset has a few useful attributes & ect the residual stream for the latter prompt to carry no token or positional information which could help it solve the IOI task (i.e. favouring `Mary` over `John`, or favouring the 2nd token over the 4th token).\n\nWe define this dataset below. Note the syntax of the `gen_flipped_prompts` method - the letters tell us how to replace the names in the sequence. For instance, `ABB->XYZ` tells us to take sentences of the form `\"When Mary and John went to the store, John gave a drink to Mary\"` with `\"When [X] and [Y] went to the store, [Z] gave a drink to Mary\"` for 3 independent randomly chosen names `[X]`, `[Y]` and `[Z]`. We'll use this function more in the bonus section, when we're trying to disentangle positional and token signals (since we can also do fun things like `ABB->BAB` to swap the first two names, etc).", "index": 145, "line_start": 2854, "score": 0.009806378855919146, "sentence_scores": [{"score": 0.0889809272147281, "sentence": "Firstly, what dataset should we use for patching?"}, {"score": 0.08607006219632275, "sentence": "In the previous section we just flipped the subject and indirect object tokens around, which meant the direction of the signal was flipped around."}, {"score": 0.07847881291424595, "sentence": "However, what we'll be doing here is a bit more principled - rather than flipping the IOI signal, we'll be erasing it."}, {"score": 0.09850551030143746, "sentence": "We do this by constructing a new dataset from `ioi_dataset` which replaces every name with a different random name."}, {"score": 0.0929989228214847, "sentence": "This way, the sentence structure stays the same, but all information related to the actual indirect object identification task (i.e."}, {"score": 0.08615958233187698, "sentence": "the identities and positions of repeated names) has been erased."}, {"score": 0.09023346454921133, "sentence": "For instance, given the sentence `\"When John and Mary went to the shops, John gave the bag to Mary\"`, the corresponding sentence
