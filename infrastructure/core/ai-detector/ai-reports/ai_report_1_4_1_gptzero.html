ur metric is further refined, because each prompt is repeated twice, for each possible indirect object."}, {"score": 2.8505183359892525e-05, "sentence": "This controls for irrelevant behaviour such as the model learning that John is a more frequent token than Mary (this actually happens!"}, {"score": 3.569961561851897e-05, "sentence": "The final layernorm bias increases the John logit by 1 relative to the Mary logit)."}, {"score": 2.0234826646820067e-05, "sentence": "Another way to handle this would be to use a large enough dataset (with names randomly chosen) that this effect is averaged out, which is what we'll do in section 3."}]}, {"content": "<details> <summary>Ignoring LayerNorm</summary>\n\nLayerNorm is an analogous normalization technique to BatchNorm (that's friendlier to massive parallelization) that transformers use. Every time a transformer layer reads information from the residual stream, it applies a LayerNorm to normalize the vector at each position (translating to set the mean to 0 and scaling to set the variance to 1) and then applying a learned vector of weights and biases to scale and translate the normalized vector. This is *almost* a linear map, apart from the scaling step, because that divides by the norm of the vector and the norm is not a linear function. (The `fold_ln` flag when loading a model factors out all the linear parts).\n\nBut if we fixed the scale factor, the LayerNorm would be fully linear. And the scale of the residual stream is a global property that's a function of *all* components of the stream, while in practice there is normally just a few directions relevant to any particular component, so in practice this is an acceptable approximation. So when doing direct logit attribution we use the `apply_ln` flag on the `cache` to apply the global layernorm scaling factor to each constant. See [my clean GPT-2 implementation](https://colab.research.google.com/github/neelnanda-io/TransformerLens/blob/clean-transformer-demo/Clean_Transformer_Demo.ipynb#scrollTo=Clean_Transformer_Implementation) for more on LayerNorm.\n</details>", "index": 37, "line_start": 857, "score": 5.414410812267734e-06, "sentence_scores": [{"score": 5.9585511511240644e-05, "sentence": "<details> <summary>Ignoring LayerNorm</summary>"}, {"score": 2.971751826024618e-05, "sentence": "LayerNorm is an analogous normalization technique to BatchNorm (that's friendlier to massive parallelization) that transformers use."}, {"score": 2.635486200374335e-05, "sentence": "Every time a transformer layer reads information from the residual stream, it applies a LayerNorm to normalize the vector at each position (translating to set the mean to 0 and scaling to set the variance to 1) and then applying a learned vector of weights and biases to scale and translate the normalized vector."}, {"score": 1.2567968310885728e-05, "sentence": "This is *almost* a linear map, apart from the scaling step, because that divides by the norm of the vector and the norm is not a linear function."}, {"score": 1.8617012831924306e-05, "sentence": "(The `fold_ln` flag when loading a model factors out all the linear parts)."}, {"score": 1.5816656369511293e-05, "sentence": "But if we fixed the scale factor, the LayerNorm would be fully linear."}, {"score": 1.1696910691895906e-05, "sentence": "And the scale of the residual stream is a global property that's a function of *all* components of the stream, while in practice there is normally just a few directions relevant to any particular component, so in practice this is an acceptable approximation."}, {"score": 3.219272801273649e-05, "sentence": "So when doing direct logit attribution we use the `apply_ln` flag on the `cache` to apply the global layernorm scaling factor to each constant."}, {"score": 6.302447201927485e-05, "sentence": "See [my clean GPT-2 implementation](https://colab.research.google.com/github/neelnanda-io/TransformerLens/blob/clean-transformer-demo/Clean_Transformer_Demo.ipynb#scrollTo=Clean_Transformer_Implementation) for more on LayerNorm."}, {"score": 0.0002926824309560132, "sentence": "</details>"}]}, {"content": "***Getting an output logit is equivalent to projecting onto a direction in the residual stream, and the same is true for getting the logit diff.***\n\n<details>\n<summary>If it's not clear what is meant by this statement, read this dropdown.</summary>\n\nSuppose our final value in the residual stream for a single sequence and a position within that sequence is $x$ (i.e. $x$ is a vector of length $d_{model}$). Then (ignoring layernorm - see the point above for why it's okay to do this), we get logits by multiplying by the unembedding matrix $W_U$ (which has shape $(d_{model}, d_{vocab})$):\n\n$$\n\\text{output} = x^T W_U\n$$\n\nNow, remember that we want the logit diff, which is $\\text{output}_{IO} - \\text{output}_{S}$ (the difference between the logits for our indirect object and subject). We can write this as:\n\n$$\n\\text{logit diff} = (x^T W_U)_{IO} - (x^T W_U)_{S} = x^T (u_{IO} - u_{S})\n$$\n\nwhere $u_{IO}$ and $u_S$ are the **columns of the unembedding matrix** $W_U$ corresponding to the indirect object and subject tokens respectively.\n\nTo summarize, we've written the logit diff as a dot product between the vector in the residual stream and a constant vector (which is a function of the model's unembedding matrix). We call this vector $u_{IO} - u_{S}$ the **logit difference direction** (because it *\"points in the direction of largest logit difference\"*). To put it another way, if $x$ is a vector of fixed magnitude, then it maximises the logit difference when it is pointing in the same direction as the vector $u_{IO} - u_{S}$. We use the term \"projection\" synonymously with \"dot product\" here.\n\n(If you've completed the exercise where we interpret a transformer on balanced / unbalanced bracket strings, this is basically the same principle. The only difference here is that we actually have a much larger unembedding vocabulary than just the classifications `{balanced, unbalanced}`, but since we're only interested in comparing the model's prediction for IO vs S, and the logits for these two tokens are usually larger than most others, this method is still well-justified).\n</details>\n\nWe use `model.tokens_to_residual_directions` to map the answer tokens to that direction, and then convert this to a logit difference direction for each batch", "index": 39, "line_start": 878, "score": 0.0021773424074433795, "sentence_scores": [{"score": 0.008530584856944582, "sentence": "***Getting an output logit is equivalent to projecting onto a direction in the residual stream, and the same is true for getting the logit diff."}, {"score": 0.003316249354585701, "sentence": "***"}, {"score": 0.004831045168375757, "sentence": "<details>"}, {"score": 0.006801571116395457, "sentence": "<summary>If it's not clear what is meant by this statement, read this dropdown.</summary>"}, {"score": 0.008539061863859831, "sentence": "Suppose our final value in the residual stream for a single sequence and a position within that sequence is $x$ (i.e."}, {"score": 0.007762800007443363, "sentence": "$x$ is a vector of length $d_{model}$)."}, {"score": 0.009290166152922141, "sentence": "Then (ignoring layernorm - see the point above for why it's okay to do this), we get logits by multiplying by the unembedding matrix $W_U$ (which has shape $(d_{model}, d_{vocab})$):"}, {"score": 0.010366704102218493, "sentence": "$$"}, {"score": 0.009950413690664421, "sentence": "\\text{output} = x^T W_U"}, {"score": 0.008363485876776261, "sentence": "$$"}, {"score": 0.011230536333389527, "sentence": "Now, remember that we want the logit diff, which is $\\text{output}_{IO} - \\text{output}_{S}$ (the difference between the logits for our indirect object and subject)."}, {"score": 0.014066974391061006, "sentence": "We can write this as:"}, {"score": 0.009174915201464134, "sentence": "$$"}, {"score": 0.010163316897438476, "sentence": "\\text{logit diff} = (x^T W_U)_{IO} - (x^T W_U)_{S} = x^T (u_{IO} - u_{S})"}, {"score": 0.008987404128948339, "sentence": "$$"}, {"score": 0.010768411001685583, "sentence": "where $u_{IO}$ and $u_S$ are the **columns of the unembedding matrix** $W_U$ corresponding to the indirect object and subject tokens respectively."}, {"score": 0.009092284934077018, "sentence": "To summarize, we've written the logit diff as a dot product between the vector in the residual stream and a constant vector (which is a function of the model's unembedding matrix)."}, {"score": 0.008117661094552584, "sentence": "We call this vector $u_{IO} - u_{S}$ the **logit difference direction** (because it *\"points in the direction of largest logit difference\"*)."}, {"score": 0.009154995999708955, "sentence": "To put it another way, if $x$ is a vector of fixed magnitude, then it maximises the logit difference when it is pointing in the same direction as the vector $u_{IO} - u_{S}$."}, {"score": 0.01227923110252765, "sentence": "We use the term \"projection\" synonymously with \"dot product\" here."}, {"score": 0.023416166084743263, "sentence": "(If you've completed the exercise where we interpret a transformer on balanced / unbalanced bracket strings, this is basically the same principle."}, {"score": 0.013586546412082364, "sentence": "The only difference here is that we actually have a much larger unembedding vocabulary than just the classifications `{balanced, unbalanced}`, but since we're only interested in comparing the model's prediction for IO vs S, and the logits for these two tokens are usually larger than most others, this method is still well-justified)."}, {"score": 0.010575829208669885, "sentence": "</details>"}, {"score": 0.017869387287965832, "sentence": "We use `model.tokens_to_residual_directions` to map the answer tokens to that direction, and then convert this to a logit difference direction for each batch"}]}, {"content": "To verify that this works, we can apply this to the final residual stream for our cached prompts (after applying LayerNorm scaling) and verify that we get the same answer.\n\n<details> <summary>Technical details</summary>\n\n`logits = Unembed(LayerNorm(final_residual_stream))`, so we technically need to account for the centering, and then learned translation and scaling of the layernorm, not just the variance 1 scaling.\n\nThe centering is accounted for with the preprocessing flag `center_writing_weights` which ensures that every weight matrix writing to the residual stream has mean zero.\n\nThe learned scaling is folded into the unembedding weights `model.unembed.W_U` via `W_U_fold = layer_norm.weights[:, None] * unembed.W_U`\n\nThe learned translation is folded to `model.unembed.b_U`, a bias added to the logits (note that GPT-2 is not trained with an existing `b_U`). This roughly represents unigram statistics. But we can ignore this because each prompt occurs twice with names in the opposite order, so this perfectly cancels out.\n\nNote that rather than using layernorm scaling we could just study cache[\"ln_final.hook_normalised\"]\n\n</details>", "index": 41, "line_start": 921, "score": 2.087693860262706e-05, "sentence_scores": [{"score": 4.469680013217805e-05, "sentence": "To verify that this works, we can apply this to the final residual stream for our cached prompts (after applying LayerNorm scaling) and verify that we get the same answer."}, {"score": 3.931501309104001e-05, "sentence": "<details> <summary>Technical details</summary>"}, {"score": 4.8942868312662495e-05, "sentence": "`logits = Unembed(LayerNorm(final_residual_stream))`, so we technically need to account for the centering, and then learned translation and scaling of the layernorm, not just the variance 1 scaling."}, {"score": 6.486458819296235e-05, "sentence": "The centering is accounted for with the preprocessing flag `center_writing_weights` which ensures that every weight matrix writing to the residual stream has mean zero."}, {"score": 0.00016537377855852875, "sentence": "The learned scaling is folded into the unembedding weights `model.unembed.W_U` via `W_U_fold = layer_norm.weights[:, None] * unembed.W_U`"}, {"score": 9.940379807705463e-05, "sentence": "The learned translation is folded to `model.unembed.b_U`, a bias added to the logits (note that GPT-2 is not trained with an existing `b_U`)."}, {"score": 6.70614291696446e-05, "sentence": "This roughly represents unigram statistics."}, {"score": 3.30460589689124e-05, "sentence": "But we can ignore this because each prompt occurs twice with names in the opposite order, so this perfectly cancels out."}, {"score": 7.127096002404256e-05, "sentence": "Note that rather than using layernorm scaling we could just study cache[\"ln_final.hook_normalised\"]"}, {"score": 0.00022869959399231216, "sentence": "</details>"}]}, {"content": "The code below does the following:\n\n* Gets the final residual stream values from the `cache` object (which you should already have defined above).\n* Apply layernorm scaling to these values.\n    * This is done by `cache.apply_to_ln_stack`, a helpful function which takes a stack of residual stream values (e.g. a batch, or the residual stream decomposed into components), treats them as the input to a specific layer, and applies the layer norm scaling of that layer to them.\n    * The keyword arguments here indicate that our input is the residual stream values for the last sequence position, and we want to apply the final layernorm in the model.\n* Project them along the unembedding directions (you've already defined these above, as `logit_diff_directions`).", "index": 42, "line_start": 943, "score": 0.0004754784251685549, "sentence_scores": [{"score": 0.0020091450809008858, "sentence": "The code below does the following:"}, {"score": 0.0021474752896815568, "sentence": "* Gets the final residual stream values from the `cache` object (which you should already have defined above)."}, {"score": 0.0018600669511847781, "sentence": "* Apply layernorm scaling to these values."}, {"score": 0.0022670931727516975, "sentence": "* This is done by `cache.apply_to_ln_stack`, a helpful function which takes a stack of residual stream values (e.g."}, {"score": 0.0024783549195397238, "sentence": "a batch, or the residual stream decomposed into components), treats them as the input to a specific layer, and applies the layer norm scaling of that layer to them."}, {"score": 0.002836498392385445, "sentence": "* The keyword arguments here indicate that our input is the residual stream values for the last sequence position, and we want to apply the final layernorm in the model."}, {"score": 0.0025489310329090704, "sentence": "* Project them along the unembedding directions (you've already defined these above, as `logit_diff_directions`)."}]}, {"content": "We can now decompose the residual stream! First we apply a technique called the [**logit lens**](https://www.alignmentforum.org/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens) - this looks at the residual stream after each layer and calculates the logit difference from that. This simulates what happens if we delete all subsequence layers.", "index": 45, "line_start": 988, "score": 0.0013114006135375416, "sentence_scores": [{"score": 0.013035615007093599, "sentence": "We can now decompose the residual stream!"}, {"score": 0.012278818341258437, "sentence": "First we apply a technique called the [**logit lens**](https://www.alignmentforum.org/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens) - this looks at the residual stream after each layer and calculates the logit difference from that."}, {"score": 0.022606263259638975, "sentence": "This simulates what happens if we delete all subsequence layers."}]}, {"content": "This function should look a lot like your code immediately above. `residual_stack` is a tensor of shape `(..., batch, d_model)` containing the residual stream values for the final sequence position. You should apply the final layernorm to these values, then project them in the logit difference directions.", "index": 46, "line_start": 996, "score": 0.05721153875862856, "sentence_scores": [{"score": 0.3755691647529602, "sentence": "This function should look a lot like your code immediately above."}, {"score": 0.4730589789546646, "sentence": "`residual_stack` is a tensor of shape `(..., batch, d_model)` containing the residual stream values for the final sequence position."}, {"score": 0.45494749873563645, "sentence": "You should apply the final layernorm to these values, then project them in the logit difference directions."}]}, {"content": "Once you have the solution, you can plot your results.\n\n<details> <summary>Details on <code>accumulated_resid</code></summary>\n\nKey for the plot below: `n_pre` means the residual stream at the start of layer n, `n_mid` means the residual stream after the attention part of layer n (`n_post` is the same as `n+1_pre` so is not included)\n\n* `layer` is the layer for which we input the residual stream (this is used to identify *which* layer norm scaling factor we want)\n* `incl_mid` is whether to include the residual stream in the middle of a layer, ie after attention & before MLP\n* `pos_slice` is the subset of the positions used. See `utils.Slice` for details on the syntax.\n* `return_labels` is whether to return the labels for each component returned (useful for plotting)\n</details>", "index": 48, "line_start": 1046, "score": 1.1124014178158568e-05, "sentence_scores": [{"score": 0.0005860533947407108, "sentence": "Once you have the solution, you can plot your results."}, {"score": 0.00011455674273415894, "sentence": "<details> <summary>Details on <code>accumulated_resid</code></summary>"}, {"score": 8.088932739477233e-05, "sentence": "Key for the plot below: `n_pre` means the residual stream at the start of layer n, `n_mid` means the residual stream after the attention part of layer n (`n_post` is the same as `n+1_pre` so is not included)"}, {"score": 6.063273439070601e-05, "sentence": "* `layer` is the layer for which we input the residual stream (this is used to identify *which* layer norm scaling factor we want)"}, {"score": 7.879534284536381e-05, "sentence": "* `incl_mid` is whether to include the residual stream in the middle of a layer, ie after attention & before MLP"}, {"score": 5.742343340715905e-05, "sentence": "* `pos_slice` is the subset of the positions used."}, {"score": 4.895613389467153e-05, "sentence": "See `utils.Slice` for details on the syntax."}, {"score": 6.183177635924642e-05, "sentence": "* `return_labels` is whether to return the labels for each component returned (useful for plotting)"}, {"score": 8.122892860778268e-05, "sentence": "</details>"}]}, {"content": "<details>\n<summary>Question - what is the interpretation of this plot? What does this tell you about how the model solves this task?</summary>\n\nFascinatingly, we see that the model is utterly unable to do the task until layer 7, almost all performance comes from attention layer 9, and performance actually *decreases* from there.\n\nThis tells us that there must be something going on (primarily in layers 7, 8 and 9) which writes to the residual stream in the correct way to solve the IOI task. This allows us to narrow in our focus, and start asking questions about what kind of computation is going on in those layers (e.g. the contribution of attention layers vs MLPs, and which attention heads are most important).\n</details>", "index": 51, "line_start": 1101, "score": 1.9527747344005464e-06, "sentence_scores": [{"score": 1.9505669418050774e-05, "sentence": "<details>"}, {"score": 1.0849328404851176e-05, "sentence": "<summary>Question - what is the interpretation of this plot?"}, {"score": 1.1188905392633072e-05, "sentence": "What does this tell you about how the model solves this task?</summary>"}, {"score": 1.0609558331269335e-05, "sentence": "Fascinatingly, we see that the model is utterly unable to do the task until layer 7, almost all performance comes from attention layer 9, and performance actually *decreases* from there."}, {"score": 1.1753454713232907e-05, "sentence": "This tells us that there must be something going on (primarily in layers 7, 8 and 9) which writes to the residual stream in the correct way to solve the IOI task."}, {"score": 7.435173745969257e-06, "sentence": "This allows us to narrow in our focus, and start asking questions about what kind of computation is going on in those layers (e.g."}, {"score": 1.4661881335891668e-05, "sentence": "the contribution of attention layers vs MLPs, and which attention heads are most important)."}, {"score": 6.533897583907135e-05, "sentence": "</details>"}]}, {"content": "We can repeat the above analysis but for each layer (this is equivalent to the differences between adjacent residual streams)\n\nNote: Annoying terminology overload - layer k of a transformer means the kth **transformer block**, but each block consists of an **attention layer** (to move information around) *and* an **MLP layer** (to process information).", "index": 53, "line_start": 1123, "score": 0.00015387001624938908, "sentence_scores": [{"score": 0.00011611269441033734, "sentence": "We can repeat the above analysis but for each layer (this is equivalent to the differences between adjacent residual streams)"}, {"score": 0.00010078641385263397, "sentence": "Note: Annoying terminology overload - layer k of a transformer means the kth **transformer block**, but each block consists of an **attention layer** (to move information around) *and* an **MLP layer** (to process information)."}]}, {"content": "<details>\n<summary>Question - what is the interpretation of this plot? What does this tell you about how the model solves this task?</summary>\n\nWe see that only attention layers matter, which makes sense! The IOI task is about moving information around (i.e. moving the correct name and not the incorrect name), and less about processing it. And again we note that attention layer 9 improves things a lot, while attention 10 and attention 11 *decrease* performance.\n</details>", "index": 56, "line_start": 1169, "score": 3.8067595232431526e-06, "sentence_scores": [{"score": 2.0413936360003215e-05, "sentence": "<details>"}, {"score": 1.445263721968617e-05, "sentence": "<summary>Question - what is the interpretation of this plot?"}, {"score": 1.597099940543457e-05, "sentence": "What does this tell you about how the model solves this task?</summary>"}, {"score": 1.9307239630542334e-05, "sentence": "We see that only attention layers matter, which makes sense!"}, {"score": 1.9745616383534164e-05, "sentence": "The IOI task is about moving information around (i.e."}, {"score": 1.2460777174936588e-05, "sentence": "moving the correct name and not the incorrect name), and less about processing it."}, {"score": 2.6650785260540295e-05, "sentence": "And again we note that attention layer 9 improves things a lot, while attention 10 and attention 11 *decrease* performance."}, {"score": 3.113760526863873e-05, "sentence": "</details>"}]}, {"content": "We can further break down the output of each attention layer into the sum of the outputs of each attention head. Each attention layer consists of 12 heads, which each act independently and additively.\n\n<details> <summary>Decomposing attention output into sums of heads</summary>\n\nThe standard way to compute the output of an attention layer is by concatenating the mixed values of each head, and multiplying by a big output weight matrix. But as described in [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) this is equivalent to splitting the output weight matrix into a per-head output (here `model.blocks[k].attn.W_O`) and adding them up (including an overall bias term for the entire layer).\n</details>", "index": 58, "line_start": 1189, "score": 0.00849830605071068, "sentence_scores": [{"score": 0.05909436764174303, "sentence": "We can further break down the output of each attention layer into the sum of the outputs of each attention head."}, {"score": 0.05978841121018072, "sentence": "Each attention layer consists of 12 heads, which each act independently and additively."}, {"score": 0.10236014189626823, "sentence": "<details> <summary>Decomposing attention output into sums of heads</summary>"}, {"score": 0.10378799819472428, "sentence": "The standard way to compute the output of an attention layer is by concatenating the mixed values of each head, and multiplying by a big output weight matrix."}, {"score": 0.26243989698044823, "sentence": "But as described in [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) this is equivalent to splitting the output weight matrix into a per-head output (here `model.blocks[k].attn.W_O`) and adding them up (including an overall bias term for the entire layer)."}, {"score": 0.13858337196723472, "sentence": "</details>"}]}, {"content": "We see that only a few heads really matter - heads 9.6 and 9.9 contribute a lot positively (explaining why attention layer 9 is so important), while heads 10.7 and 11.10 contribute a lot negatively (explaining why attention layer 10 and layer 11 are actively harmful). These correspond to (some of) the name movers and negative name movers discussed in the paper. There are also several heads that matter positively or negatively but less strongly (other name movers and backup name movers).\n\nThere are a few meta observations worth making here - our model has 144 heads, yet we could localise this behaviour to a handful of specific heads, using straightforward, general techniques. This supports the claim in [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) that attention heads are the right level of abstraction to understand attention. It also really surprising that there are *negative* heads - eg 10.7 makes the incorrect logit 7x *more* likely. I'm not sure what's going on there, though the paper discusses some possibilities.", "index": 61, "line_start": 1237, "score": 1.2729419812274367e-05, "sentence_scores": [{"score": 5.787360687674557e-05, "sentence": "We see that only a few heads really matter - heads 9.6 and 9.9 contribute a lot positively (explaining why attention layer 9 is so important), while heads 10.7 and 11.10 contribute a lot negatively (explaining why attention layer 10 and layer 11 are actively harmful)."}, {"score": 4.582274281776344e-05, "sentence": "These correspond to (some of) the name movers and negative name movers discussed in the paper."}, {"score": 4.6583069362933526e-05, "sentence": "There are also several heads that matter positively or negatively but less strongly (other name movers and backup name movers)."}, {"score": 4.952106752302904e-05, "sentence": "There are a few meta observations worth making here - our model has 144 heads, yet we could localise this behaviour to a handful of specific heads, using straightforward, general techniques."}, {"score": 8.254368697981246e-05, "sentence": "This supports the claim in [A Mathematical Framework](https://transformer-circuits.pub/2021/framework/index.html) that attention heads are the right level of abstraction to understand attention."}, {"score": 2.245827633135166e-05, "sentence": "It also really surprising that there are *negative* heads - eg 10.7 makes the incorrect logit 7x *more* likely."}, {"score": 3.189376966421643e-05, "sentence": "I'm not sure what's going on there, though the paper discusses some possibilities."}]}, {"content": "Here, we take stock of all the functions from transformerlens which you might not have seen previously.\n\n* `cache.apply_ln_to_stack`\n    * Apply layernorm scaling to a stack of residual stream values.\n    * We used this to help us go from \"final value in residual stream\" to \"projection of logits in logit difference directions\", without getting the code too messy!\n* `cache.accumulated_resid(layer=None)`\n    * Returns the accumulated residual stream up to layer `layer` (or up to the final value of residual stream if layer is None), i.e. a stack of previous residual streams up to that layer's input.\n    * Useful when studying the **logit lens**.\n    * First dimension of output is `(0_pre, 0_mid, 1_pre, 1_mid, ..., final_post)`\n* `cache.decompose_resid(layer)`.\n    * Decomposes the residual stream input to layer `layer` into a stack of the output of previous layers. The sum of these is the input to layer `layer`.\n    * First dimension of output is `(embed, pos_embed, 0_attn_out, 0_mlp_out, ...)`.\n* `cache.stack_head_results(layer)`\n    * Returns a stack of all head results (i.e. residual stream contribution) up to layer `layer`\n    * (i.e. like `decompose_resid` except it splits each attention layer by head rather than splitting each layer by attention/MLP)\n    * First dimension of output is `layer * head` (we needed to rearrange to `(layer, head)` to plot it).", "index": 62, "line_start": 1247, "score": 0.00035494460426051537, "sentence_scores": [{"score": 0.001254319832179577, "sentence": "Here, we take stock of all the functions from transformerlens which you might not have seen previously."}, {"score": 0.0021961273578062347, "sentence": "* `cache.apply_ln_to_stack`"}, {"score": 0.0016485349503703737, "sentence": "* Apply layernorm scaling to a stack of residual stream values."}, {"score": 0.001313660893222953, "sentence": "* We used this to help us go from \"final value in residual stream\" to \"projection of logits in logit difference directions\", without getting the code too messy!"}, {"score": 0.002120798112133571, "sentence": "* `cache.accumulated_resid(layer=None)`"}, {"score": 0.0011249572780187241, "sentence": "* Returns the accumulated residual stream up to layer `layer` (or up to the final value of residual stream if layer is None), i.e."}, {"score": 0.0009603352433553025, "sentence": "a stack of previous residual streams up to that layer's input."}, {"score": 0.0012052498967150091, "sentence": "* Useful when studying the **logit lens**."}, {"score": 0.001490606100796329, "sentence": "* First dimension of output is `(0_pre, 0_mid, 1_pre, 1_mid,..., final_post)`"}, {"score": 0.002077093157057044, "sentence": "* `cache.decompose_resid(layer)`."}, {"score": 0.0011727704483391914, "sentence": "* Decomposes the residual stream input to layer `layer` into a stack of the output of previous layers."}, {"score": 0.001291160167795861, "sentence": "The sum of these is the input to layer `layer`."}, {"score": 0.0019489134612677493, "sentence": "* First dimension of output is `(embed, pos_embed, 0_attn_out, 0_mlp_out,...)`."}, {"score": 0.0024289456855966715, "sentence": "* `cache.stack_head_results(layer)`"}, {"score": 0.0010558664386581776, "sentence": "* Returns a stack of all head results (i.e."}, {"score": 0.0016824931995880004, "sentence": "residual stream contribution) up to layer `layer`"}, {"score": 0.0005232703036664541, "sentence": "* (i.e."}, {"score": 0.0018871228360683096, "sentence": "like `decompose_resid` except it splits each attention layer by head rather than splitting each layer by attention/MLP)"}, {"score": 0.001853136177768518, "sentence": "* First dimension of output is `layer * head` (we needed to rearrange to `(layer, head)` to plot it)."}]}, {"content": "Attention heads are particularly fruitful to study because we can look directly at their attention patterns and study from what positions they move information from and to. This is particularly useful here as we're looking at the direct effect on the logits so we need only look at the attention patterns from the final token.\n\nWe use the `circuitsvis` library (developed from Anthropic's PySvelte library) to visualize the attention patterns! We visualize the top 3 positive and negative heads by direct logit attribution, and show these for the first prompt (as an illustration).\n\n<details> <summary>Interpreting Attention Patterns</summary>\n\nA common mistake to make when looking at attention patterns is thinking that they must convey information about the *token* looked at (maybe accounting for the context of the token). But actually, all we can confidently say is that it moves information from the *residual stream position* corresponding to that input token. Especially later on in the model, there may be components in the residual stream that are nothing to do with the input token! Eg the period at the end of a sentence may contain summary information for that sentence, and the head may solely move that, rather than caring about whether it ends in \".\", \"!\" or \"?\"\n</details>", "index": 63, "line_start": 1272, "score": 2.0172448634456715e-05, "sentence_scores": [{"score": 3.702508014800613e-05, "sentence": "Attention heads are particularly fruitful to study because we can look directly at their attention patterns and study from what positions they move information from and to."}, {"score": 2.5571983888936035e-05, "sentence": "This is particularly useful here as we're looking at the direct effect on the logits so we need only look at the attention patterns from the final token."}, {"score": 5.601340392016257e-05, "sentence": "We use the `circuitsvis` library (developed from Anthropic's PySvelte library) to visualize the attention patterns!"}, {"score": 3.4953628553358005e-05, "sentence": "We visualize the top 3 positive and negative heads by direct logit attribution, and show these for the first prompt (as an illustration)."}, {"score": 3.9037170252198094e-05, "sentence": "<details> <summary>Interpreting Attention Patterns</summary>"}, {"score": 1.886953374034912e-05, "sentence": "A common mistake to make when looking at attention patterns is thinking that they must convey information about the *token* looked at (maybe accounting for the context of the token)."}, {"score": 2.5801021847690553e-05, "sentence": "But actually, all we can confidently say is that it moves information from the *residual stream position* corresponding to that input token."}, {"score": 2.6717872569481725e-05, "sentence": "Especially later on in the model, there may be components in the residual stream that are nothing to do with the input token!"}, {"score": 2.6118095480893082e-05, "sentence": "Eg the period at the end of a sentence may contain summary information for that sentence, and the head may solely move that, rather than caring about whether it ends in \"."}, {"score": 5.866707484631064e-05, "sentence": "\", \"!\""}, {"score": 8.8296855769404e-05, "sentence": "or \"?\""}, {"score": 0.00011248716849836027, "sentence": "</details>"}]}, {"content": "Reminder - you can use `attention_patterns` or `attention_heads` for these visuals. The former lets you see the actual values, the latter lets you hover over tokens in a printed sentence (and it provides other useful features like locking on tokens, or a superposition of all heads in the display). Both can be useful in different contexts (although I'd recommend usually using `attention_patterns`, it's more useful in most cases for quickly getting a sense of attention patterns).\n\nTry replacing `attention_patterns` above with `attention_heads`, and compare the output.\n\n\n\nFrom these plots, you might want to start thinking about the algorithm which is being implemented. In particular, for the attention heads with high positive attribution scores, where is `\" to\"` attending to? How might this head be affecting the logit diff score?\n\nWe'll save a full hypothesis for how the model works until the end of the next section.", "index": 66, "line_start": 1350, "score": 8.134175599905302e-06, "sentence_scores": [{"score": 1.8499924378833346e-05, "sentence": "Reminder - you can use `attention_patterns` or `attention_heads` for these visuals."}, {"score": 1.1479383883116745e-05, "sentence": "The former lets you see the actual values, the latter lets you hover over tokens in a printed sentence (and it provides other useful features like locking on tokens, or a superposition of all heads in the display)."}, {"score": 1.3531017771513708e-05, "sentence": "Both can be useful in different contexts (although I'd recommend usually using `attention_patterns`, it's more useful in most cases for quickly getting a sense of attention patterns)."}, {"score": 1.8081900865340684e-05, "sentence": "Try replacing `attention_patterns` above with `attention_heads`, and compare the output."}, {"score": 1.6618902562251434e-05, "sentence": "From these plots, you might want to start thinking about the algorithm which is being implemented."}, {"score": 1.957448010223946e-05, "sentence": "In particular, for the attention heads with high positive attribution scores, where is `\" to\"` attending to?"}, {"score": 2.537640368556639e-05, "sentence": "How might this head be affecting the logit diff score?"}, {"score": 1.9963646440538663e-05, "sentence": "We'll save a full hypothesis for how the model works until the end of the next section."}]}, {"content": "The obvious limitation to the techniques used above is that they only look at the very end of the circuit - the parts that directly affect the logits. Clearly this is not sufficient to understand the circuit! We want to understand how things compose together to produce this final output, and ideally to produce an end-to-end circuit fully explaining this behaviour.\n\nThe technique we'll use to investigate this is called **activation patching**. This was first introduced in [David Bau and Kevin Meng's excellent ROME paper](https://rome.baulab.info/), there called causal tracing.\n\nThe setup of activation patching is to take two runs of the model on two different inputs, the clean run and the corrupted run. The clean run outputs the correct answer and the corrupted run does not. The key idea is that we give the model the corrupted input, but then **intervene** on a specific activation and **patch** in the corresponding activation from the clean run (ie replace the corrupted activation with the clean activation), and then continue the run. And we then measure how much the output has updated towards the correct answer.\n\nWe can then iterate over many possible activations and look at how much they affect the corrupted run. If patching in an activation significantly increases the probability of the correct answer, this allows us to *localise* which activations matter.\n\nIn other words, this is a **noising** algorithm (unlike last section which was mostly **denoising**).\n\nThe ability to localise is a key move in mechanistic interpretability - if the computation is diffuse and spread across the entire model, it is likely much harder to form a clean mechanistic story for what's going on. But if we can identify precisely which parts of the model matter, we can then zoom in and determine what they represent and how they connect up with each other, and ultimately reverse engineer the underlying circuit that they represent.", "index": 69, "line_start": 1405, "score": 1.4483275936315032e-05, "sentence_scores": [{"score": 7.634570616092586e-05, "sentence": "The obvious limitation to the techniques used above is that they only look at the very end of the circuit - the parts that directly affect the logits."}, {"score": 6.936146146395859e-05, "sentence": "Clearly this is not sufficient to understand the circuit!"}, {"score": 6.676624555991698e-05, "sentence": "We want to understand how things compose together to produce this final output, and ideally to produce an end-to-end circuit fully explaining this behaviour."}, {"score": 4.8302638894173215e-05, "sentence": "The technique we'll use to investigate this is called **activation patching**."}, {"score": 9.135010659958899e-05, "sentence": "This was first introduced in [David Bau and Kevin Meng's excellent ROME paper](https://rome.baulab.info/), there called causal tracing."}, {"score": 5.68458208938357e-05, "sentence": "The setup of activation patching is to take two runs of the model on two different inputs, the clean run and the corrupted run."}, {"score": 5.807415870706931e-05, "sentence": "The clean run outputs the correct answer and the corrupted run does not."}, {"score": 6.132499272215464e-05, "sentence": "The key idea is that we give the model the corrupted input, but then **intervene** on a specific activation and **patch** in the corresponding activation from the clean run (ie replace the corrupted activation with the clean activation), and then continue the run."}, {"score": 5.439106029206e-05, "sentence": "And we then measure how much the output has updated towards the correct answer."}, {"score": 5.118422318927328e-05, "sentence": "We can then iterate over many possible activations and look at how much they affect the corrupted run."}, {"score": 4.9508970249986055e-05, "sentence": "If patching in an activation significantly increases the probability of the correct answer, this allows us to *localise* which activations matter."}, {"score": 9.208886512697608e-05, "sentence": "In other words, this is a **noising** algorithm (unlike last section which was mostly **denoising**)."}, {"score": 7.826365493502149e-05, "sentence": "The ability to localise is a key move in mechanistic interpretability - if the computation is diffuse and spread across the entire model, it is likely much harder to form a clean mechanistic story for what's going on."}, {"score": 0.00014006994401788206, "sentence": "But if we can identify precisely which parts of the model matter, we can then zoom in and determine what they represent and how they connect up with each other, and ultimately reverse engineer the underlying circuit that they represent."}]}, {"content": "The diagrams below demonstrate activation patching on an abstract neural network (the nodes represent activations, and the arrows between them are weight connections).\n\nA regular forward pass on the clean input looks like:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-1c.png\" width=\"300\">\n\nAnd activation patching from a corrupted input (green) into a forward pass for the clean input (black) looks like:\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-2c.png\" width=\"440\">\n\nwhere the dotted line represents patching in a value (i.e. during the forward pass on the clean input, we replace node $D$ with the value it takes on the corrupted input). Nodes $H$, $G$ and $F$ are colored orange, to represent that they now follow a distribution which is not the same as clean or corrupted.", "index": 70, "line_start": 1423, "score": 4.536052229681719e-05, "sentence_scores": [{"score": 3.370075165970104e-05, "sentence": "The diagrams below demonstrate activation patching on an abstract neural network (the nodes represent activations, and the arrows between them are weight connections)."}, {"score": 4.712783440358755e-05, "sentence": "A regular forward pass on the clean input looks like:"}, {"score": 3.5945410212329425e-05, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-1c.png\" width=\"300\">"}, {"score": 2.6875125472962284e-05, "sentence": "And activation patching from a corrupted input (green) into a forward pass for the clean input (black) looks like:"}, {"score": 3.2929124253642134e-05, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-2c.png\" width=\"440\">"}, {"score": 2.846764230686017e-05, "sentence": "where the dotted line represents patching in a value (i.e."}, {"score": 3.141905716337239e-05, "sentence": "during the forward pass on the clean input, we replace node $D$ with the value it takes on the corrupted input)."}, {"score": 3.500425433747063e-05, "sentence": "Nodes $H$, $G$ and $F$ are colored orange, to represent that they now follow a distribution which is not the same as clean or corrupted."}]}, {"content": "We can patch into a transformer in many different ways (e.g. values of the residual stream, the MLP, or attention heads' output - see below). We can also get even more granular by patching at particular sequence positions (not shown in diagram).\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-examples.png\" width=\"840\">", "index": 71, "line_start": 1441, "score": 0.00017152418196633267, "sentence_scores": [{"score": 0.0005238359307259898, "sentence": "We can patch into a transformer in many different ways (e.g."}, {"score": 0.0004400531650728804, "sentence": "values of the residual stream, the MLP, or attention heads' output - see below)."}, {"score": 0.0004152262572015948, "sentence": "We can also get even more granular by patching at particular sequence positions (not shown in diagram)."}, {"score": 0.0005526111690092704, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/simpler-patching-examples.png\" width=\"840\">"}]}, {"content": "We might call this algorithm a type of **noising**, since we're running the model on a clean input and adding noise by patching in from the corrupted input. We can also consider the opposite algorithm, **denoising**, where we run the model on a corrupted input and remove noise by patching in from the clean input.\n\nWhen would you use noising vs denoising? It depends on your goals. The results of denoising are much stronger, because showing that a component or set of components is sufficient for a task is a big deal. On the other hand, the complexity of transformers and interdependence of components means that noising a model can have unpredictable consequences. If loss goes up when we ablate a component, it doesn't necessarily mean that this component was necessary for the task. As an example, ablating MLP0 in gpt2-small seems to make performance much worse on basically any task (because it acts as a kind of extended embedding; more on this later in these exercises), but it's not doing anything important which is *specfic* for the IOI task.", "index": 72, "line_start": 1451, "score": 1.765762507058318e-05, "sentence_scores": [{"score": 0.00015505206941775576, "sentence": "We might call this algorithm a type of **noising**, since we're running the model on a clean input and adding noise by patching in from the corrupted input."}, {"score": 0.00016639909108554323, "sentence": "We can also consider the opposite algorithm, **denoising**, where we run the model on a corrupted input and remove noise by patching in from the clean input."}, {"score": 8.936285902041623e-05, "sentence": "When would you use noising vs denoising?"}, {"score": 7.629830953087907e-05, "sentence": "It depends on your goals."}, {"score": 3.8010785678653156e-05, "sentence": "The results of denoising are much stronger, because showing that a component or set of components is sufficient for a task is a big deal."}, {"score": 2.3310666358800192e-05, "sentence": "On the other hand, the complexity of transformers and interdependence of components means that noising a model can have unpredictable consequences."}, {"score": 2.0808638475807392e-05, "sentence": "If loss goes up when we ablate a component, it doesn't necessarily mean that this component was necessary for the task."}, {"score": 2.8271012117971957e-05, "sentence": "As an example, ablating MLP0 in gpt2-small seems to make performance much worse on basically any task (because it acts as a kind of extended embedding; more on this later in these exercises), but it's not doing anything important which is *specfic* for the IOI task."}]}, {"content": "The above was all fairly abstract, so let's zoom in and lay out a concrete example to understand Indirect Object Identification. We'll start with an exercise on denoising, but we'll move onto noising later in this section (and the next section, on path patching).\n\nHere our clean input will be the original sentences (e.g. <code>\"When Mary and John went to the store, John gave a drink to\"</code>) and our corrupted input will have the subject token flipped (e.g. <code>\"When Mary and John went to the store, <u>Mary</u> gave a drink to\"</code>). Patching by replacing corrupted residual stream values with clean values is a causal intervention which will allow us to understand precisely which parts of the network are identifying the indirect object. If a component is important, then patching in (replacing that component's corrupted output with its clean output) will reverse the signal that this component produces, hence making performance much better.\n\nNote - the noising and denoising terminology doesn't exactly fit here, since the \"noised dataset\" actually **reverses** the signal rather than erasing it. The reason we're describing this as denoising is more a matter of framing - we're trying to figure out which components / activations are **sufficient** to recover performance, rather than which are **necessary**. If you're ever confused, this is a useful framing to have - **noising tells you what is necessary, denoising tells you what is sufficient.**", "index": 73, "line_start": 1463, "score": 1.4564024740116355e-06, "sentence_scores": [{"score": 1.5215013934754383e-05, "sentence": "The above was all fairly abstract, so let's zoom in and lay out a concrete example to understand Indirect Object Identification."}, {"score": 1.1706198342932305e-05, "sentence": "We'll start with an exercise on denoising, but we'll move onto noising later in this section (and the next section, on path patching)."}, {"score": 1.485261763515015e-05, "sentence": "Here our clean input will be the original sentences (e.g."}, {"score": 2.0858725808018832e-05, "sentence": "<code>\"When Mary and John went to the store, John gave a drink to\"</code>) and our corrupted input will have the subject token flipped (e.g."}, {"score": 2.748820396141472e-05, "sentence": "<code>\"When Mary and John went to the store, <u>Mary</u> gave a drink to\"</code>)."}, {"score": 1.6971539191477664e-05, "sentence": "Patching by replacing corrupted residual stream values with clean values is a causal intervention which will allow us to understand precisely which parts of the network are identifying the indirect object."}, {"score": 1.1641099745286331e-05, "sentence": "If a component is important, then patching in (replacing that component's corrupted output with its clean output) will reverse the signal that this component produces, hence making performance much better."}, {"score": 1.2065888912159111e-05, "sentence": "Note - the noising and denoising terminology doesn't exactly fit here, since the \"noised dataset\" actually **reverses** the signal rather than erasing it."}, {"score": 9.513398021403788e-06, "sentence": "The reason we're describing this as denoising is more a matter of framing - we're trying to figure out which components / activations are **sufficient** to recover performance, rather than which are **necessary**."}, {"score": 2.063567873576443e-05, "sentence": "If you're ever confused, this is a useful framing to have - **noising tells you what is necessary, denoising tells you what is sufficient."}, {"score": 0.000841055502464505, "sentence": "**"}]}, {"content": "Question - we could instead have our corrupted sentence be <code>\"When <u>John</u> and <u>Mary</u> went to the store, <u>Mary</u> gave a drink to\"</code> (i.e. flip all 3 occurrences of names in the sentence). Why do you think we don't do this?\n\n<details>\n<summary>Hint</summary>\n\nWhat if, at some point during the model's forward pass on the prompt `\"When Mary and John went to the store, John gave a drink to\"`, it contains some representation of the information **\"the indirect object is the fourth token in this sequence\"**?\n</details>\n\n<details>\n<summary>Answer</summary>\n\nThe model could point to the indirect object `' Mary'` in two different ways:\n\n* Via **token information**, i.e. **\"the indirect object is the token `' Mary'`\"**.\n* Via **positional information**, i.e. **\"the indirect object is the fourth token in this sequence\"**.\n\nWe want the corrupted dataset to reverse both these signals when it's patched into the clean dataset. But if we corrupted the dataset by flipping all three names, then:\n\n* The token information is flipped, because the corresponding information in the model for the corrupted prompt will be **\"the indirect object is the token `' Mary'`\"**.\n* The positional information is ***not*** flipped, because the corresponding information will still be **\"the indirect object is the fourth token in this sequence\"**.\n\nIn fact, in the bonus section we'll take advantage of this fact to try and disentangle whether token or positional information is being used by the model (i.e. by flipping the token information but not the positional information, and vice-versa). Spoiler alert - it turns out to be using a bit of both!\n</details>", "index": 74, "line_start": 1477, "score": 1.4977191155762556e-05, "sentence_scores": [{"score": 0.0002590706797039923, "sentence": "Question - we could instead have our corrupted sentence be <code>\"When <u>John</u> and <u>Mary</u> went to the store, <u>Mary</u> gave a drink to\"</code> (i.e."}, {"score": 0.000164358894427746, "sentence": "flip all 3 occurrences of names in the sentence)."}, {"score": 7.427222008602022e-05, "sentence": "Why do you think we don't do this?"}, {"score": 4.175542610280585e-05, "sentence": "<details>"}, {"score": 4.979039077967656e-05, "sentence": "<summary>Hint</summary>"}, {"score": 0.0001059972179521116, "sentence": "What if, at some point during the model's forward pass on the prompt `\"When Mary and John went to the store, John gave a drink to\"`, it contains some representation of the information **\"the indirect object is the fourth token in this sequence\"**?"}, {"score": 3.782738065298322e-05, "sentence": "</details>"}, {"score": 3.8315902116000534e-05, "sentence": "<details>"}, {"score": 3.168689617587302e-05, "sentence": "<summary>Answer</summary>"}, {"score": 8.621317796778761e-05, "sentence": "The model could point to the indirect object `' Mary'` in two different ways:"}, {"score": 7.733433518583823e-05, "sentence": "* Via **token information**, i.e."}, {"score": 7.274343304226477e-05, "sentence": "**\"the indirect object is the token `' Mary'`\"**."}, {"score": 6.759603609249884e-05, "sentence": "* Via **positional information**, i.e."}, {"score": 6.126375652584421e-05, "sentence": "**\"the indirect object is the fourth token in this sequence\"**."}, {"score": 8.022717071079583e-05, "sentence": "We want the corrupted dataset to reverse both these signals when it's patched into the clean dataset."}, {"score": 4.115776447817261e-05, "sentence": "But if we corrupted the dataset by flipping all three names, then:"}, {"score": 7.148272743301127e-05, "sentence": "* The token information is flipped, because the corresponding information in the model for the corrupted prompt will be **\"the indirect object is the token `' Mary'`\"**."}, {"score": 5.4257006012411e-05, "sentence": "* The positional information is ***not*** flipped, because the corresponding information will still be **\"the indirect object is the fourth token in this sequence\"**."}, {"score": 5.420983035206078e-05, "sentence": "In fact, in the bonus section we'll take advantage of this fact to try and disentangle whether token or positional information is being used by the model (i.e."}, {"score": 8.053331663428412e-05, "sentence": "by flipping the token information but not the positional information, and vice-versa)."}, {"score": 6.296998171591253e-05, "sentence": "Spoiler alert - it turns out to be using a bit of both!"}, {"score": 0.00017871136880319045, "sentence": "</details>"}]}, {"content": "One natural thing to patch in is the residual stream at a specific layer and specific position. For example, the model is likely intitially doing some processing on the `S2` token to realise that it's a duplicate, but then uses attention to move that information to the `end` token. So patching in the residual stream at the `end` token will likely matter a lot in later layers but not at all in early layers.\n\nWe can zoom in much further and patch in specific activations from specific layers. For example, we think that the output of head 9.9 on the final token is significant for directly connecting to the logits, so we predict that just patching the output of this head will significantly affect performance.\n\nNote that this technique does *not* tell us how the components of the circuit connect up, just what they are.", "index": 75, "line_start": 1507, "score": 4.203732897634615e-05, "sentence_scores": [{"score": 8.944790895207474e-05, "sentence": "One natural thing to patch in is the residual stream at a specific layer and specific position."}, {"score": 8.729103917927659e-05, "sentence": "For example, the model is likely intitially doing some processing on the `S2` token to realise that it's a duplicate, but then uses attention to move that information to the `end` token."}, {"score": 8.93953594104845e-05, "sentence": "So patching in the residual stream at the `end` token will likely matter a lot in later layers but not at all in early layers."}, {"score": 5.933270602953133e-05, "sentence": "We can zoom in much further and patch in specific activations from specific layers."}, {"score": 7.687857847925094e-05, "sentence": "For example, we think that the output of head 9.9 on the final token is significant for directly connecting to the logits, so we predict that just patching the output of this head will significantly affect performance."}, {"score": 8.886540520027539e-05, "sentence": "Note that this technique does *not* tell us how the components of the circuit connect up, just what they are."}]}, {"content": "TransformerLens has helpful built-in functions to perform activation patching, but in order to understand the process better, you're now going to implement some of these functions from first principles (i.e. just using hooks). You'll be able to test your functions by comparing their output to the built-in functions.\n\nIf you need a refresher on hooks, you can return to the exercises on induction heads (which take you through how to use hooks, as well as how to cache activations).", "index": 76, "line_start": 1519, "score": 5.96096065172205e-05, "sentence_scores": [{"score": 0.00012128932736838697, "sentence": "TransformerLens has helpful built-in functions to perform activation patching, but in order to understand the process better, you're now going to implement some of these functions from first principles (i.e."}, {"score": 8.602036662928533e-05, "sentence": "just using hooks)."}, {"score": 0.00010426929364664037, "sentence": "You'll be able to test your functions by comparing their output to the built-in functions."}, {"score": 0.00013048990999899198, "sentence": "If you need a refresher on hooks, you can return to the exercises on induction heads (which take you through how to use hooks, as well as how to cache activations)."}]}, {"content": "Before we patch, we need to create a metric for evaluating a set of logits. Since we'll be running our **corrupted prompts** (with `S2` replaced with the wrong name) and patching in our **clean prompts**, it makes sense to choose a metric such that:\n\n* A value of zero means no change (from the performance on the corrupted prompt)\n* A value of one means clean performance has been completely recovered\n\nFor example, if we patched in the entire clean prompt, we'd get a value of one. If our patching actually makes the model even better at solving the task than its regular behaviour on the clean prompt then we'd get a value greater than 1, but generally we expect values between 0 and 1.\n\nIt also makes sense to have the metric be a linear function of the logit difference. This is enough to uniquely specify a metric.", "index": 79, "line_start": 1543, "score": 8.417111585118466e-05, "sentence_scores": [{"score": 0.0002910092432322028, "sentence": "Before we patch, we need to create a metric for evaluating a set of logits."}, {"score": 0.000260194425524443, "sentence": "Since we'll be running our **corrupted prompts** (with `S2` replaced with the wrong name) and patching in our **clean prompts**, it makes sense to choose a metric such that:"}, {"score": 0.0002465234249171755, "sentence": "* A value of zero means no change (from the performance on the corrupted prompt)"}, {"score": 0.00038122967151704273, "sentence": "* A value of one means clean performance has been completely recovered"}, {"score": 0.00022189261897947513, "sentence": "For example, if we patched in the entire clean prompt, we'd get a value of one."}, {"score": 0.00024100293589010384, "sentence": "If our patching actually makes the model even better at solving the task than its regular behaviour on the clean prompt then we'd get a value greater than 1, but generally we expect values between 0 and 1."}, {"score": 0.0003562589541392457, "sentence": "It also makes sense to have the metric be a linear function of the logit difference."}, {"score": 0.0008223792423161784, "sentence": "This is enough to uniquely specify a metric."}]}, {"content": "Fill in the function `ioi_metric` below, to create the required metric. Note that we can afford to use default arguments in this function, because we'll be using the same dataset for this whole section.\n\n**Important note** - this function needs to return a scalar tensor, rather than a float. If not, then some of the patching functions later on won't work. The type signature of this is `Float[Tensor, \"\"]`.\n\n**Second important note** - we've defined this to be 0 when performance is the same as on corrupted input, and 1 when it's the same as on clean input. This is because we're performing a **denoising algorithm**; we're looking for activations which are sufficient for recovering a model's performance (i.e. activations which have enough information to recover the correct answer from the corrupted input). Our \"null hypothesis\" is that the component isn't sufficient, and so patching it by replacing corrupted with clean values doesn't recover any performance. In later sections we'll be doing noising, and we'll define a new metric function for that.", "index": 81, "line_start": 1583, "score": 6.828068678133316e-05, "sentence_scores": [{"score": 0.00018848112997528043, "sentence": "Fill in the function `ioi_metric` below, to create the required metric."}, {"score": 0.00013450045954478595, "sentence": "Note that we can afford to use default arguments in this function, because we'll be using the same dataset for this whole section."}, {"score": 0.00011324282672553608, "sentence": "**Important note** - this function needs to return a scalar tensor, rather than a float."}, {"score": 0.00013232880797171948, "sentence": "If not, then some of the patching functions later on won't work."}, {"score": 0.00018062286110898102, "sentence": "The type signature of this is `Float[Tensor, \"\"]`."}, {"score": 0.0001466860719749933, "sentence": "**Second important note** - we've defined this to be 0 when performance is the same as on corrupted input, and 1 when it's the same as on clean input."}, {"score": 0.0001378097745002394, "sentence": "This is because we're performing a **denoising algorithm**; we're looking for activations which are sufficient for recovering a model's performance (i.e."}, {"score": 0.00013887499043479848, "sentence": "activations which have enough information to recover the correct answer from the corrupted input)."}, {"score": 0.00013187774613463495, "sentence": "Our \"null hypothesis\" is that the component isn't sufficient, and so patching it by replacing corrupted with clean values doesn't recover any performance."}, {"score": 0.00015982773548839108, "sentence": "In later sections we'll be doing noising, and we'll define a new metric function for that."}]}, {"content": "Lets begin with a simple example: we patch in the residual stream at the start of each layer and for each token position. Before you write your own function to do this, let's see what this looks like with TransformerLens' `patching` module. Run the code below.", "index": 84, "line_start": 1640, "score": 0.00035733272942788054, "sentence_scores": [{"score": 0.001632330380018504, "sentence": "Lets begin with a simple example: we patch in the residual stream at the start of each layer and for each token position."}, {"score": 0.0013468560982452201, "sentence": "Before you write your own function to do this, let's see what this looks like with TransformerLens' `patching` module."}, {"score": 0.0015987989232227227, "sentence": "Run the code below."}]}, {"content": "Question - what is the interpretation of this graph? What significant things does it tell you about the nature of how the model solves this task?\n\n<details>\n<summary>Hint</summary>\n\nThink about locality of computation.\n</details>\n\n<details>\n<summary>Answer</summary>\n\nOriginally all relevant computation happens on `S2`, and at layers 7 and 8, the information is moved to `END`. Moving the residual stream at the correct position near *exactly* recovers performance!\n\nTo be clear, the striking thing about this graph isn't that the first row is zero everywhere except for `S2` where it is 1, or that the rows near the end trend to being zero everywhere except for `END` where they are 1; both of these are exactly what we'd expect. The striking things are:\n\n* The computation is highly localized; the relevant information for choosing `IO` over `S` is initially stored in `S2` token and then moved to `END` token without taking any detours.\n* The model is basically done after layer 8, and the rest of the layers actually slightly impede performance on this particular task.\n\n(Note - for reference, tokens and their index from the first prompt are on the x-axis. In an abuse of notation, note that the difference here is averaged over *all* 8 prompts, while the labels only come from the *first* prompt.)\n</detail 832650217068933e-06, "sentence": "In an abuse of notation, note that the difference here is averaged over *all* 8 prompts, while the labels only come from the *first* prompt.)"}, {"score": 4.6900844824402914e-05, "sentence": "</details>"}]}, {"content": "Now, you should implement the `get_act_patch_resid_pre` function below, which should give you results just like the code you ran above. A quick refresher on how to use hooks in this way:\n\n* Hook functions take arguments `tensor: torch.Tensor` and `hook: HookPoint`. It's often easier to define a hook function taking more arguments than these, and then use `functools.partial` when it actually comes time to add your hook.\n* The function `model.run_with_hooks` takes arguments:\n    * The tokens to run (as first argument)\n    * `fwd_hooks` - a list of `(hook_name, hook_fn)` tuples. Remember that you can use `utils.get_act_name` to get hook names.\n* Tip - it's good practice to have `model.reset_hooks()` at the start of functions which add and run hooks. This is because sometimes hooks fail to be removed (if they cause an error while running). There's nothing more frustrating than fixing a hook error only to get the same error message, not realising that you've failed to clear the broken hook!", "index": 89, "line_start": 1730, "score": 0.00010386059852068875, "sentence_scores": [{"score": 0.0013829729704650327, "sentence": "Now, you should implement the `get_act_patch_resid_pre` function below, which should give you results just like the code you ran above."}, {"score": 0.00039623485404697266, "sentence": "A quick refresher on how to use hooks in this way:"}, {"score": 0.0009197142364929655, "sentence": "* Hook functions take arguments `tensor: torch.Tensor` and `hook: HookPoint`."}, {"score": 0.00044911353660274825, "sentence": "It's often easier to define a hook function taking more arguments than these, and then use `functools.partial` when it actually comes time to add your hook."}, {"score": 0.000632198324327678 ayer, we can also patch just after the attention layer or just after the MLP."}, {"score": 0.0019385166915906586, "sentence": "This gives is a slightly more refined view of which tokens matter and when."}, {"score": 0.002163737367012296, "sentence": "The function `patching.get_act_patch_block_every` works just like `get_act_patch_resid_pre`, but rather than just patching to the residual stream, it patches to `resid_pre`, `attn_out` and `mlp_out`, and returns a tensor of shape `(3, n_layers, seq_len)`."}, {"score": 0.0015905796135781045, "sentence": "One important thing to note - we're cycling through the `resid_pre`, `attn_out` and `mlp_out` and only patching one of them at a time, rather than patching all three at once."}]}, {"content": "<details>\n<summary>Question - what is the interpretation of the second two plots?</summary>\n\nWe see that several attention layers are significant but that, matching the residual stream results, early layers matter on `S2`, and later layers matter on `END`, and layers essentially don't matter on any other token. Extremely localised!\n\nAs with direct logit attribution, layer 9 is positive and layers 10 and 11 are not, suggesting that the late layers only matter for direct logit effects, but we also see that layers 7 and 8 matter significantly. Presumably these are the heads that move information about which name is duplicated from `S2` to `END`.\n\nIn contrast, the MLP layers do not matter much. This makes sense, since this is more a task about moving information than about processing it, and the MLP layers specialise in processing information. The one exception is MLP0, which matters a lot, but I think this is misleading and just a generally true statement about MLP0 rather than being about the circuit on this task. Read won for an interesting aside about MLP0!\n\n</details>", "index": 99, "line_start": 1934, "score": 3.405467158382925e-06, "sentence_scores": [{"score": 3.252483604863677e-05, "sentence": "<details>"}, {"score":
