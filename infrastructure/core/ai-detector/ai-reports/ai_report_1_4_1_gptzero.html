nduction, and simpler grammatical structures than this one).\n* It's easy to measure: the model always puts a much higher probability on the IO and S tokens (i.e. `\" Mary\"` and `\" John\"`) than any others, and this is especially true once the model starts being stripped down to the core part of the circuit we're studying. So we can just take the logit difference between these two tokens, and use this as a metric for how well the model can solve the task.\n* It is a crisp and well-defined task, so less likely to be solved in terms of memorisation of a large bag of heuristics (unlike e.g. tasks like \"predict that the number `n+1` will follow `n`, which as Neel mentions in the video walkthrough is actually much more annoying and subtle than it first seems!).\n\nA terminology note: `IO` will refer to the indirect object (in the example, `\" Mary\"`), `S1` and `S2` will refer to the two instances of the subject token (i.e. `\" John\"`), and `end` will refer to the end token `\" to\"` (because this is the position we take our prediction from, and we don't care about any tokens after this point). We will also sometimes use `S` to refer to the identity of the subject token (rather than referring to the first or second instance in particular).", "index": 6, "line_start": 82, "score": 0.00016784988467492698, "sentence_scores": [{"score": 0.0004707623715777859, "sentence": "The first step when trying to reverse engineer a circuit in a model is to identify *what* capability we want to reverse engineer."}, {"score": 0.0006027440181797986, "sentence": "Indirect Object Identification is a task studied in Redwood Research's excellent [Interpretability in the Wild](https://arxiv.org/abs/2211.00593) paper (see [Neel Nanda's interview with the authors](https://www.youtube.com/watch?v=gzwj0jWbvbo) or [Kevin Wang's Twitter thread](https://threadreaderapp.com/thread/1587601532639494146.html) for an overview)."}, {"score": 0.0004576326154746023, "sentence": "The task is to complete se * It is a crisp and well-defined task, so less likely to be solved in terms of memorisation of a large bag of heuristics (unlike e.g."}, {"score": 0.0017171586508168382, "sentence": "tasks like \"predict that the number `n+1` will follow `n`, which as Neel mentions in the video walkthrough is actually much more annoying and subtle than it first seems!"}, {"score": 0.0009249663594182329, "sentence": ")."}, {"score": 0.0008172535918976422, "sentence": "A terminology note: `IO` will refer to the indirect object (in the example, `\" Mary\"`), `S1` and `S2` will refer to the two instances of the subject token (i.e."}, {"score": 0.0008648562066540677, "sentence": "`\" John\"`), and `end` will refer to the end token `\" to\"` (because this is the position we take our prediction from, and we don't care about any tokens after this point)."}, {"score": 0.0007175879963486446, "sentence": "We will also sometimes use `S` to refer to the identity of the subject token (rather than referring to the first or second instance in particular)."}]}, {"content": "There's a lot to keep track of in these exercises as we work through them. You'll be exposed to new functions and modules from transformerlens, new ways to causally intervene in models, all the while building up your understanding of how the IOI task is performed. The notebook starts off exploratory in nature (lots of plotting and investigation), and gradually moves into more technical details, refined analysis, and replication of the paper's results, as we improve our understanding of the IOI circuit. You are recommended to keep a document or page of notes nearby as you go through these exercises, so you can keep track of the main takeaways from each section, as well as your hypotheses for how the model performs the task, and your ideas for how you might go off and test these hypotheses on your own if the notebook were to suddenly end.\n\nIf you are feeling extremely confused at any point, you can come back to the dropdown below, which contains diagrams explaining how the circuit works. There is also an accompanying intuitive explanation which you might find more helpful. However, I'd recommend you try and go through the notebook unassisted before looking at these.\n\n<details>\n<summary>Intuitive explanation of IOI circuit</summary>\n\nFirst, let's start with an analogy for how transformers work (you can skip this if you've already read [my post](https://www.lesswrong.com/posts/euam65XjigaCJQkcN/an-analogy-for-understanding-transformers)). Imagine a line of people, who can only look forward. Each person has a token written on their chest, and their goal is to figure out what token the person in front of them is holding. Each person is allowed to pass a question backwards along the line (not forwards), and anyone can choose to reply to that question by passing information forwards to the person who asked. In this case, the sentence is `\"When Mary and John went to the store, John gave a drink to Mary\"`. You are the person holding the `\" to\"` token, and your goal is to figure out that the person in front of him has the `\" Mary\"` token.\n\nTo be clear about how this analogy relates to transformers:\n* Each person in the line represents a vector in the residual stream. Initially they just store their own token, but they accrue more information as they ask questions and receive answers (i.e. as components write to the residual stream)\n* The operation of an attention head is represented by a question & answer:\n    * The person who asks is the destination token, the people who answer are the source tokens\n    * The question is the query vector\n    * The information *which determines who answers the question* is the key vector\n    * The information *which gets passed back to the original asker* is the value vector\n\nNow, here is how the IOI circuit works in this analogy. Each bullet point represents a class of attention heads.\n\n* The person with the second `\" John\"` token asks the question \"does anyone else hold the name `\" John\"`?\". They get a reply from the first `\" John\"` token, who also gives him their location. So he now knows that `\" John\"` is repeated, and he knows that the first `\" John\"` token is 4th in the sequence.\n    * These are *Duplicate Token Heads*\n* You ask the question \"which names are repeated?\", and you get an answer from the person holding the second `\" John\"` token. You now also know that `\" John\"` is repeated, and where the first `\" John\"` token is.\n    * These are *S-Inhibition Heads*\n* You ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?\". You get a reply from the person holding the `\" Mary\"` token, who tells you that they have name `\" Mary\"`. You use this as your prediction.\n    * These are *Name Mover Heads*\n\nThis is a fine first-pass understanding of how the circuit works. A few other features:\n\n* The person after the first `\" John\"` (holding `\" went\"`) had previously asked about the identity of the person behind him. So he knows that the 4th person in the sequence holds the `\" John\"` token, meaning he can also reply to the question of the person holding the second `\" John\"` token. *(previous token heads / induction heads)*\n    * This might not seem necessary, but since previous token heads / induction heads are just a pretty useful thing to have in general, it makes sense that you'd want to make use of this information!\n* If for some reason you forget to ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?\", then you'll have another chance to do this.\n    * These are *(Backup Name Mover Heads)*\n    * Their existance might be partly because transformers are trained with **dropout**. This can make them \"forget\" things, so it's important to have a backup method for recovering that information!\n* You want to avoid overconfidence, so you also ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?\" another time, in order to ***anti-***predict the response that you get from this question. *(negative name mover heads)*\n    * Yes, this is as weird as it sounds! The authors speculate that these heads \"hedge\" the predictions, avoiding high cross-entropy loss when making mistakes.\n\n</details>\n\n<details>\n<summary>Diagram 1 (simple)</summary>\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-simple-a.png\" width=\"1000\">\n\n</details>\n\n<details>\n<summary>Diagram 2 (complex)</summary>\n\n<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-full-d.png\" width=\"1250\">\n\n</details>", "index": 7, "line_start": 106, "score": 0.00022620844380723108, "sentence_scores": [{"score": 0.0006586261142437665, "sentence": "There's a lot to keep track of in these exercises as we work through them."}, {"score": 0.0004730747794143102, "sentence": "You'll be exposed to new functions and modules from transformerlens, new ways to causally intervene in models, all the while building up your understanding of how the IOI task is performed."}, {"score": 0.0003370317480941141, "sentence": "The notebook starts off exploratory in nature (lots of plotting and investigation), and gradually moves into more technical details, refined analysis, and replication of the paper's results, as we improve our understanding of the IOI circuit."}, {"score": 0.00029723446327272585, "sentence": "You are recommended to keep a document or page of notes nearby as you go through these exercises, so you can keep track of the main takeaways from each section, as well as your hypotheses for how the model performs the task, and your ideas for how you might go off and test these hypotheses on your own if the notebook were to suddenly end."}, {"score": 0.00023701698312463367, "sentence": "If you are feeling extremely confused at any point, you can come back to the dropdown below, which contains diagrams explaining how the circuit works."}, {"score": 0.00021481944446755672, "sentence": "There is also an accompanying intuitive explanation which you might find more helpful."}, {"score": 0.0002527504631210147, "sentence": "However, I'd recommend you try and go through the notebook unassisted before looking at these."}, {"score": 0.0007649300513815865, "sentence": "<details>"}, {"score": 0.0006655367058258112, "sentence": "<summary>Intuitive explanation of IOI circuit</summary>"}, {"score": 0.0004617622754606622, "sentence": "First, let's start with an analogy for how transformers work (you can skip this if you've already read [my post](https://www.lesswrong.com/posts/euam65XjigaCJQkcN/an-analogy-for-understanding-transformers))."}, {"score": 0.0004291701445739795, "sentence": "Imagine a line of people, who can only look forward."}, {"score": 0.0006695081054502514, "sentence": "Each person has a token written on their chest, and their goal is to figure out what token the person in front of them is holding."}, {"score": 0.0016573296050452597, "sentence": "Each person is allowed to pass a question backwards along the line (not forwards), and anyone can choose to reply to that question by passing information forwards to the person who asked."}, {"score": 0.012513932177356133, "sentence": "In this case, the sentence is `\"When Mary and John went to the store, John gave a drink to Mary\"`."}, {"score": 0.0036996137478775893, "sentence": "You are the person holding the `\" to\"` token, and your goal is to figure out that the person in front of him has the `\" Mary\"` token."}, {"score": 0.0003393721737882027, "sentence": "To be clear about how this analogy relates to transformers:"}, {"score": 0.0004601174195212311, "sentence": "* Each person in the line represents a vector in the residual stream."}, {"score": 0.00016080214752737956, "sentence": "Initially they just store their own token, but they accrue more information as they ask questions and receive answers (i.e."}, {"score": 0.00017288071253693965, "sentence": "as components write to the residual stream)"}, {"score": 9.128434249636543e-05, "sentence": "* The operation of an attention head is represented by a question & answer:"}, {"score": 5.423871251906117e-05, "sentence": "* The person who asks is the destination token, the people who answer are the source tokens"}, {"score": 6.81043850936563e-05, "sentence": "* The question is the query vector"}, {"score": 8.933552845273337e-05, "sentence": "* The information *which determines who answers the question* is the key vector"}, {"score": 0.00010454935152444687, "sentence": "* The information *which gets passed back to the original asker* is the value vector"}, {"score": 0.00010065347940317577, "sentence": "Now, here is how the IOI circuit works in this analogy."}, {"score": 0.00024771999407626816, "sentence": "Each bullet point represents a class of attention heads."}, {"score": 0.0001812560752376144, "sentence": "* The person with the second `\" John\"` token asks the question \"does anyone else hold the name `\" John\"`?\"."}, {"score": 0.00015320108660560498, "sentence": "They get a reply from the first `\" John\"` token, who also gives him their location."}, {"score": 0.00018959354187401156, "sentence": "So he now knows that `\" John\"` is repeated, and he knows that the first `\" John\"` token is 4th in the sequence."}, {"score": 0.00032205638714205337, "sentence": "* These are *Duplicate Token Heads*"}, {"score": 0.0004131103899206216, "sentence": "* You ask the question \"which names are repeated?"}, {"score": 0.00021891427902092226, "sentence": "\", and you get an answer from the person holding the second `\" John\"` token."}, {"score": 0.0002635494694717593, "sentence": "You now also know that `\" John\"` is repeated, and where the first `\" John\"` token is."}, {"score": 0.00047068146671970875, "sentence": "* These are *S-Inhibition Heads*"}, {"score": 0.00046681348538419416, "sentence": "* You ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?\"."}, {"score": 0.0005771566421239492, "sentence": "You get a reply from the person holding the `\" Mary\"` token, who tells you that they have name `\" Mary\"`."}, {"score": 0.0013991903726113817, "sentence": "You use this as your prediction."}, {"score": 0.0025360285286090915, "sentence": "* These are *Name Mover Heads*"}, {"score": 0.005982404078447053, "sentence": "This is a fine first-pass understanding of how the circuit works."}, {"score": 0.0007474470295044305, "sentence": "A few other features:"}, {"score": 0.0011834974412848207, "sentence": "* The person after the first `\" John\"` (holding `\" went\"`) had previously asked about the identity of the person behind him."}, {"score": 0.0009835515065781516, "sentence": "So he knows that the 4th person in the sequence holds the `\" John\"` token, meaning he can also reply to the question of the person holding the second `\" John\"` token."}, {"score": 0.00048595185256769037, "sentence": "*(previous token heads / induction heads)*"}, {"score": 0.0003717873703839803, "sentence": "* This might not seem necessary, but since previous token heads / induction heads are just a pretty useful thing to have in general, it makes sense that you'd want to make use of this information!"}, {"score": 0.0002515413178126127, "sentence": "* If for some reason you forget to ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?"}, {"score": 0.0004013030144480428, "sentence": "\", then you'll have another chance to do this."}, {"score": 0.0002535278834531751, "sentence": "* These are *(Backup Name Mover Heads)*"}, {"score": 0.0002947624255653513, "sentence": "* Their existance might be partly because transformers are trained with **dropout**."}, {"score": 0.00014479773437086593, "sentence": "This can make them \"forget\" things, so it's important to have a backup method for recovering that information!"}, {"score": 0.0002087900367367744, "sentence": "* You want to avoid overconfidence, so you also ask the question \"does anyone have a name that isn't `\" John\"`, and isn't at the 4th position in the sequence?\""}, {"score": 0.00023874341510230277, "sentence": "another time, in order to ***anti-***predict the response that you get from this question."}, {"score": 0.0005415551050421464, "sentence": "*(negative name mover heads)*"}, {"score": 0.00031892566919988275, "sentence": "* Yes, this is as weird as it sounds!"}, {"score": 0.002110198591530098, "sentence": "The authors speculate that these heads \"hedge\" the predictions, avoiding high cross-entropy loss when making mistakes."}, {"score": 0.4082604536796334, "sentence": "</details>"}, {"score": 0.6410309797703381, "sentence": "<details>"}, {"score": 0.6484920623988124, "sentence": "<summary>Diagram 1 (simple)</summary>"}, {"score": 0.6891117167019619, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-simple-a.png\" width=\"1000\">"}, {"score": 0.8377776936885843, "sentence": "</details>"}, {"score": 0.8241809013533201, "sentence": "<details>"}, {"score": 0.848835268749892, "sentence": "<summary>Diagram 2 (complex)</summary>"}, {"score": 0.8549038802156987, "sentence": "<img src=\"https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/ioi-main-full-d.png\" width=\"1250\">"}, {"score": 0.8574710551350473, "sentence": "</details>"}]}, {"content": "### 1️⃣ Model & Task Setup\n\nIn this section you'll set up your model, and see how to analyse its performance on the IOI task. You'll also learn how to measure it's performance using tools like logit difference.\n\n\n### 2️⃣ Logit Attribution\n\nNext, you'll move on to some component attribution: evaluating the importance of each model component for the IOI task. However, this type of analysis is limited to measuring a component's direct effect, as opposed to indirect effect - we'll measure the latter in future sections.\n\n\n### 3️⃣ Activation Patching\n\nWe introduce one of the two important patching tools you'll use during this section: **activation patching**. This can be used to discover which components of a model are important for a particular task, by measuring the changes in our previously-defined task metrics when you patch into a particular component with corrupted input.\n\n\n### 4️⃣ Path Patching\n\nNext, we move to path patching, a more refined form of activation patching which examines the importance of particular paths between model components. This will give us a more precise picture of how our circuit works.\n\n\n### 5️⃣ Full Replication: Minimial Circuits and more\n\nLastly, we'll do some cleaning up, by replicating some other results from the IOI paper. This includes implementing a complex form of ablation which removes every component from the model except for the ones we've identified from previous analysis, and showing that the performace is recovered. This section is more open-ended and less structured.\n\n\n### ☆ Bonus / exploring anomalies\n\nWe end with a few suggested bonus exercises for this particular circuit, as well as ideas for capstone projects / paper replications.", "index": 8, "line_start": 166, "score": 3.8479376424670475e-05, "sentence_scores": [{"score": 0.00031992003216128884, "sentence": "### 1 Model & Task Setup"}, {"score": 0.00017688155755809533, "sentence": "In this section you'll set up your model, and see how to analyse its performance on the IOI task."}, {"score": 0.00016391735623424802, "sentence": "You'll also learn how to measure it's performance using tools like logit difference."}, {"score": 0.00023903280412212354, "sentence": "### 2 Logit Attribution"}, {"score": 0.00012222134295823906, "sentence": "Next, you'll move on to some component attribution: evaluating the importance of each model component for the IOI task."}, {"score": 8.  our model, GPT-2 Small, a 12 layer and 80M parameter transformer with `HookedTransformer.from_pretrained`. The various flags are simplifications that preserve the model's output but simplify its internals.", "index": 15, "line_start": 358, "score": 0.05588674974475257, "sentence_scores": [{"score": 0.45977079264563464, "sentence": "The first step is to load in our model, GPT-2 Small, a 12 layer and 80M parameter transformer with `HookedTransformer.from_pretrained`."}, {"score": 0.43284926052034045, "sentence": "The various flags are simplifications that preserve the model's output but simplify its internals."}]}, {"content": "<details>\n<summary>Note on <code>fold_ln</code>, <code>center_unembed</code> and <code>center_writing_weights</code> (optional)</summary>\n\nSee link [here](https://github.com/neelnanda-io/TransformerLens/blob/main/further_comments.md#what-is-layernorm-folding-fold_ln) for comments.\n</details>", "index": 17, "line_start": 378, "score": 0.004188842594355308, "sentence_scores": [{"score": 0.035988312709594815, "sentence": "<details>"}, {"score": 0.04466797586774578, "sentence": "<summary>Note on <code>fold_ln</code>, <code>center_unembed</code> and <code>center_writing_weights</code> (optional)</summary>"}, {"score": 0.04028330015673245, "sentence": "See link [here](https://github.com/neelnanda-io/TransformerLens/blob/main/further_comments.md#what-is-layernorm-folding-fold_ln) for comments."}, {"score": 0.02339736113112065, "sentence": "</details>"}]}, {"content": "The next step is to verify that the model can *actually* do the task! Here we use `utils.test_prompt`, and see that the model is significantly better at predicting Mary than John!\n\n<details><summary>Asides</summary>\n\nNote: If we were being careful, we'd want to run the model on a range of prompts and find the average performance. We'll do more stuff like this in the fourth section (when we try to replicate some of the paper's results, and take a more rigorous approach).\n\n`prepend_bos` is a flag to add a BOS (beginning of sequence) to the start of the prompt. GPT-2 was not trained with this, but I find that it often makes model behaviour more stable, as the first token is treated weirdly.\n</details>", "index": 18, "line_start": 412, "score": 2.8640143337159098e-05, "sentence_scores": [{"score": 0.00012927143061179376, "sentence": "The next step is to verify that the model can *actually* do the task!"}, {"score": 0.0001184826446514095, "sentence": "Here we use `utils.test_prompt`, and see that the model is significantly better at predicting Mary than John!"}, {"score": 5.803843582929116e-05, "sentence": "<details><summary>Asides</summary>"}, {"score": 6.0758877706932325e-05, "sentence": "Note: If we were being careful, we'd want to run the model on a range of prompts and find the average performance."}, {"score": 4.113567320830624e-05, "sentence": "We'll do more stuff like this in the fourth section (when we try to replicate some of the paper's results, and take a more rigorous approach)."}, {"score": 5.598839057804589e-05, "sentence": "`prepend_bos` is a flag to add a BOS (beginning of sequence) to the start of the prompt."}, {"score": 3.8491506124228826e-05, "sentence": "GPT-2 was not trained with this, but I find that it often makes model behaviour more stable, as the first token is treated weirdly."}, {"score": 7.953125383968363e-05, "sentence": "</details>"}]}, {"content": "We now want to find a reference prompt to run the model on. Even though our ultimate goal is to reverse engineer how this behaviour is done in general, often the best way to start out in mechanistic interpretability is by zooming in on a concrete example and understanding it in detail, and only *then* zooming out and verifying that our analysis generalises. In section 3, we'll work with a dataset similar to the one used by the paper authors, but this probably wouldn't be the first thing we reached for if we were just doing initial investigations.\n\nWe'll run the model on 4 instances of this task, each prompt given twice - one with the first name as the indirect object, one with the second name. To make our lives easier, we'll carefully choose prompts with single token names and the corresponding names in the same token positions.\n\n<details><summary>Aside on tokenization</summary>\n\nWe want models that can take in arbitrary text, but models need to have a fixed vocabulary. So the solution is to define a vocabulary of **tokens** and to deterministically break up arbitrary text into tokens. Tokens are, essentially, subwords, and are determined by finding the most frequent substrings - this means that tokens vary a lot in length and frequency!\n\nTokens are a *massive* headache and are one of the most annoying things about reverse engineering language models... Different names will be different numbers of tokens, different prompts will have the relevant tokens at different positions, different prompts will have different total numbers of tokens, etc. Language models often devote significant amounts of parameters in early layers to convert inputs from tokens to a more sensible internal format (and do the reverse in later layers). You really, really want to avoid needing to think about tokenization wherever possible when doing exploratory analysis (though, of course, it's relevant later when trying to flesh out your analysis and make it rigorous!). HookedTransformer comes with several helper methods to deal with tokens: `to_tokens, to_string, to_str_tokens, to_single_token, get_token_position`\n\n**Exercise:** I recommend using `model.to_str_tokens` to explore how the model tokenizes different strings. In particular, try adding or removing spaces at the start, or changing capitalization - these change tokenization!</details>", "index": 21, "line_start": 464, "score": 5.447917894500102e-06, "sentence_scores": [{"score": 0.00015245095798606522, "sentence": "We now want to find a reference prompt to run the model on."}, {"score": 05002365992e-05, "sentence": "Language models often devote significant amounts of parameters in early layers to convert inputs from tokens to a more sensible internal format (and do the reverse in later layers)."}, {"score": 2.0589918726553705e-05, "sentence": "You really, really want to avoid needing to think about tokenization wherever possible when doing exploratory analysis (though, of course, it's relevant later when trying to flesh out your analysis and make it rigorous!)."}, {"score": 9.193285789106346e-05, "sentence": "HookedTransformer comes with several helper methods to deal with tokens: `to_tokens, to_string, to_str_tokens, to_single_token, get_token_position`"}, {"score": 0.00012404405988819298, "sentence": "**Exercise:** I recommend using `model.to_str_tokens` to explore how the model tokenizes different strings."}, {"score": 7.415633495421885e-05, "sentence": "In particular, try adding or removing spaces at the start, or changing capitalization - these change tokenization!</details>"}]}, {"content": "We now run the model on these prompts and use `run_with_cache` to get both the logits and a cache of all internal activations for later analysis.", "index": 25, "line_start": 597, "score": 0.2685205485368178, "sentence_scores": [{"score": 0.9080349994798144, "sentence": "We now run the model on these prompts and use `run_with_cache` to get both the logits and a cache of all internal activations for later analysis."}]}, {"content": "We'll later be evaluating how model performance differs upon performing various interventions, so it's useful to have a metric to measure model performance. Our metric here will be the **logit difference**, the difference in logit between the indirect object's name and the subject's name (eg, `logit(Mary) - logit(John)`).", "index": 27, "line_start": 615, "score": 0.000744946496636921, "sentence_scores": [{"score": 0.002981245804307652, "sentence": "We'll later be evaluating how model performance differs upon performing various interventions, so it's useful to have a metric to measure model performance."}, {"score": 0.003903311862307611, "sentence": "Our metric here will be the **logit difference**, the difference in logit between the indirect object's name and the subject's name (eg, `logit(Mary) - logit(John)`)."}]}, {"content": "This function should take in your model's logit output (shape `(batch, seq, d_vocab)`), and the array of answer tokens (shape `(batch, 2)`, containing the token ids of correct and incorrect answers respectively for each sequence), and return the logit difference as described above. If `per_prompt` is False, then it should take the mean over the batch dimension, if not then it should return an array of length `batch`.", "index": 28, "line_start": 623, "score": 0.002913857172198313, "sentence_scores": [{"score": 0.029930520798443067, "sentence": "This function should take in your model's logit output (shape `(batch, seq, d_vocab)`), and the array of answer tokens (shape `(batch, 2)`, containing the token ids of correct and incorrect answers respectively for each sequence), and return the logit difference as described above."}, {"score": 0.015986129192419037, "sentence": "If `per_prompt` is False, then it should take the mean over the batch dimension, if not then it should return an array of length `batch`."}]}, {"content": "Before diving into running experiments, it's often useful to spend some time actually reasoning about how the behaviour in question could be implemented in the transformer. **This is optional, and you'll likely get the most out of engaging with this section if you have a decent understanding already of what a transformer is and how it works!**\n\nYou don't have to do this and forming hypotheses after exploration is also reasonable, but I think it's often easier to explore and interpret results with some grounding in what you might find. In this particular case, I'm cheating somewhat, since I know the answer, but I'm trying to simulate the process of reasoning about it!\n\nNote that often your hypothesis will be wrong in some ways and often be completely off. We're doing science here, and the goal is to understand how the model *actually* works, and to form true beliefs! There are two separate traps here at two extremes that it's worth tracking:\n* Confusion: Having no hypotheses at all, getting a lot of data and not knowing what to do with it, and just floundering around\n* Dogmatism: Being overconfident in an incorrect hypothesis and being unwilling to let go of it when reality contradicts you, or flinching away from running the experiments that might disconfirm it.\n\n**Exercise:** Spend some time thinking through how you might imagine this behaviour being implemented in a transformer. Try to think through this for yourself before reading through my thoughts!\n\n<details> <summary>(*) <b>My reasoning</b></summary>\n\n<h3>Brainstorming:</h3>\n\nSo, what's hard about the task? Let's focus on the concrete example of the first prompt, `\"When John and Mary went to the shops, John gave the bag to\" -> \" Mary\"`.\n\nA good starting point is thinking though whether a tiny model could do this, e.g. a <a href=\"https://transformer-circuits.pub/2021/framework/index.html\">1L Attn-Only model</a>. I'm pretty sure the answer is no! Attention is really good at the primitive operations of looking nearby, or copying information. I can believe a tiny model could figure out that at `to` it should look for names and predict that those names came next (e.g. the skip trigram \" John...to -> John\"). But it's much harder to tell how <i>many</i> of each previous name there are - attending to each copy of John will look exactly the same as attending to a single John token. So this will be pretty hard to figure out on the \" to\" token!\n\nThe natural place to break this symmetry is on the second `\" John\"` token - telling whether there is an earlier copy of the <i>current</i> token should be a much easier task. So I might expect there to be a head which detects duplicate tokens on the second `\" John\"` token, and then another head which moves that information from the second `\" John` token to the `\" to\"` token.\n\nThe model then needs to learn to predict `\" Mary\"` and <i>not</i> `\" John\"`. I can see two natural ways to do this:\n1. Detect all preceding names and move this information to \" to\" and then delete the any name corresponding to the duplicate token feature. This feels easier done with a non-linearity, since precisely cancelling out vectors is hard, so I'd imagine an MLP layer deletes the `\" John\"` direction of the residual stream.\n2. Have a head which attends to all previous names, but where the duplicate token features <i>inhibit</i> it from attending to specific names. So this only attends to Mary. And then the output of this head maps to the logits.\n\n<details>\n<summary>Spoiler - which one of these two is correct</summary>\n\nIt's the second one.\n</details>\n\n<h3>Experiment Ideas</h3>\n\nA test that could distinguish these two is to look at which components of the model add directly to the logits - if it's mostly attention heads which attend to `\" Mary\"` and to neither `\" John\"` it's probably hypothesis 2, if it's mostly MLPs it's probably hypothesis 1.\n\nAnd we should be able to identify duplicate token heads by finding ones which attend from `\" John\"` to `\" John\"`, and whose outputs are then moved to the `\" to\"` token by V-Composition with another head (Spoiler: It's more complicated than that!)\n\nNote that all of the above reasoning is very simplistic and could easily break in a real model! There'll be significant parts of the model that figure out whether to use this circuit at all (we don't want to inhibit duplicated names when, e.g. figuring out what goes at the start of the <i>next</i> sentence), and may be parts towards the end of the model that do \"post-processing\" just before the final output. But it's a good starting point for thinking about what's going on.\n\n</details>", "index": 32, "line_start": 722, "score": 2.4955853136580703e-05, "sentence_scores": [{"score": 0.0008071487340964511, "sentence": "Before diving into running experiments, it's often useful to spend some time actually reasoning about how the behaviour in question could be implemented in the transformer."}, {"score": 0.00016141621740327976, "sentence": "**This is optional, and you'll likely get the most out of engaging with this section if you have a decent understanding already of what a transformer is and how it works!"}, {"score": 7.181787728648317e-05, "sentence": "**"}, {"score": 0.00017029509608259243, "sentence": "You don't have to do this and forming hypotheses after exploration is also reasonable, but I think it's often easier to explore and interpret results with some grounding in what you might find."}, {"score": 0.00013694071333898735, "sentence": "In this particular case, I'm cheating somewhat, since I know the answer, but I'm trying to simulate the process of reasoning about it!"}, {"score": 0.00014787277117699936, "sentence": "Note that often your hypothesis will be wrong in some ways and often be completely off."}, {"score": 0.00015506694230784166, "sentence": "We're doing science here, and the goal is to understand how the model *actually* works, and to form true beliefs!"}, {"score": 0.00016866652614360925, "sentence": "There are two separate traps here at two extremes that it's worth tracking:"}, {"score": 0.00015306271452953133, "sentence": "* Confusion: Having no hypotheses at all, getting a lot of data and not knowing what to do with it, and just floundering around"}, {"score": 0.0001736424558681739, "sentence": "* Dogmatism: Being overconfident in an incorrect hypothesis and being unwilling to let go of it when reality contradicts you, or flinching away from running the experiments that might disconfirm it."}, {"score": 0.00020749809185098463, "sentence": "**Exercise:** Spend some time thinking through "And we should be able to identify duplicate token heads by finding ones which attend from `\" John\"` to `\" John\"`, and whose outputs are then moved to the `\" to\"` token by V-Composition with another head (Spoiler: It's more complicated than that!)"}, {"score": 3.524949878956373e-05, "sentence": "Note that all of the above reasoning is very simplistic and could easily break in a real model!"}, {"score": 6.805549307834549e-05, "sentence": "There'll be significant parts of the model that figure out whether to use this circuit at all (we don't want to inhibit duplicated names when, e.g."}, {"score": 5.984172738672669e-05, "sentence": "figuring out what goes at the start of the <i>next</i> sentence), and may be parts towards the end of the model that do \"post-processing\" just before the final output."}, {"score": 5.69077776049233e-05, "sentence": "But it's a good starting point for thinking about what's going on."}, {"score": 0.00016959096881511476, "sentence": "</details>"}]}, {"content": "The easiest part of the model to understand is the output - this is what the model is trained to optimize, and so it can always be directly interpreted! Often the right approach to reverse engineering a circuit is to start at the end, understand how the model produces the right answer, and to then work backwards (you will have seen this if you went through the balanced bracket classifier task, and in fact if you did then this section will probably be quite familiar to you and you should feel free to just skim through it). The main technique used to do this is called **direct logit attribution**\n\n**Background:** The central object of a transformer is the **residual stream**. This is the sum of the outputs of each layer and of the original token and positional embedding. Importantly, this means that any linear function of the residual stream can be perfectly decomposed into the contribution of each layer of the transformer. Further, each attention layer's output can be broken down into the sum of the output of each head (See [A Mathematical Framework for Transformer Circuits](https://transformer-circuits.pub/2021/framework/index.html) for details), and each MLP layer's output can be broken down into the sum of the output of each neuron (and a bias term for each layer).\n\nThe logits of a model are `logits=Unembed(LayerNorm(final_residual_stream))`. The Unembed is a linear map, and LayerNorm is approximately a linear map, so we can decompose the logits into the sum of the contributions of each component, and look at which components contribute the most to the logit of the correct token! This is called **direct logit attribution**. Here we look at the direct attribution to the logit difference!", "index": 35, "line_start": 784, "score": 0.00011385284453784991, "sentence_scores": [{"score": 0.0005415554904590901, "sentence": "The easiest part of the model to understand is the output - this is what the model is trained to optimize, and so it can always be directly interpreted!"}, {"score": 0.0004933606881149302, "sentence": "Often the right approach to reverse engineering a circuit is to start at the end, understand how the model produces the right answer, and to then work backwards (you will have seen this if you went through the balanced bracket classifier task, and in fact if you did then this section will probably be quite familiar to you and you should feel free to just skim through it)."}, {"score": 0.0005390851647810847, "sentence": "The main technique used to do this is called **direct logit attribution**"}, {"score": 0.0005350455655776697, "sentence": "**Background:** The central object of a transformer is the **residual stream**."}, {"score": 0.00042964671993070283, "sentence": "This is the sum of the outputs of each layer and of the original token and positional embedding."}, {"score": 0.0005434154300651764, "sentence": "Importantly, this means that any linear function of the residual stream can be perfectly decomposed into the contribution of each layer of the transformer."}, {"score": 0.0005381468793655224, "sentence": "Further, each attention layer's output can be broken down into the sum of the output of each head (See [A Mathematical Framework for Transformer Circuits](https://transformer-circuits.pub/2021/framework/index.html) for details), and each MLP layer's output can be broken down into the sum of the output of each neuron (and a bias term for each layer)."}, {"score": 0.001021907807182467, "sentence": "The logits of a model are `logits=Unembed(LayerNorm(final_residual_stream))`."}, {"score": 0.0006961281337228262, "sentence": "The Unembed is a linear map, and LayerNorm is approximately a linear map, so we can decompose the logits into the sum of the contributions of each component, and look at which components contribute the most to the logit of the correct token!"}, {"score": 0.0008145422241223728, "sentence": "This is called **direct logit attribution**."}, {"score": 0.0008313431457935903, "sentence": "Here we look at the direct attribution to the logit difference!"}]}, {"content": "Logit difference is actually a *really* nice and elegant metric and is a particularly nice aspect of the setup of Indirect Object Identification. In general, there are two natural ways to interpret the model's outputs: the output logits, or the output log probabilities (or probabilities).\n\nThe logits are much nicer and easier to understand, as noted above. However, the model is trained to optimize the cross-entropy loss (the average of log probability of the correct token). This means it does not directly optimize the logits, and indeed if the model adds an arbitrary constant to every logit, the log probabilities are unchanged.\n\nBut we have:\n\n```\nlog_probs == logits.log_softmax(dim=-1) == logits - logsumexp(logits)\n```\n\nand because they differ by a constant, we have:\n\n```\nlog_probs(\" Mary\") - log_probs(\" John\") = logits(\" Mary\") - logits(\" John\")\n```\n\n- the ability to add an arbitrary constant cancels out!\n\n<details>\n<summary>Technical details (if this equivalence doesn't seem obvious to you)</summary>\n\nLet $\\vec{\\textbf{x}}$ be the logits, $\\vec{\\textbf{L}}$ be the log probs, and $\\vec{\\textbf{p}}$ be the probs. Then we have the following relations:\n\n$$\np_i = \\operatorname{softmax}(\\vec{\\textbf{x}})_i = \\frac{e^{x_i}}{\\sum_{i=1}^n e^{x_i}}\n$$\n\nand:\n\n$$\nL_i = \\log p_i\n$$\n\nCombining these, we get:\n\n$$\nL_i = \\log \\frac{e^{x_i}}{\\sum_{j=1}^n e^{x_j}} = x_i - \\log \\sum_{j=1}^n e^{x_j}\n$$\n\nNotice that the sum term on the right hand side is the same for all $i$, so we get:\n\n$$\nL_i - L_j = x_i - x_j\n$$\n\nin other words, the logit diff $x_i - x_j$ is the same as the log prob diff. This motivates the choice of logit diff as our choice of metric (since the model is directly training to make the log prob of the correct token large, and all other log probs small).\n\n</details>\n\nFurther, the metric helps us isolate the precise capability we care about - figuring out *which* name is the Indirect Object. There are many other components of the task - deciding whether to return an article (the) or pronoun (her) or name, realising that the sentence wants a person next at all, etc. By taking the logit difference we control for all of that.\n\nOur metric is further refined, because each prompt is repeated twice, for each possible indirect object. This controls for irrelevant behaviour such as the model learning that John is a more frequent token than Mary (this actually happens! The final layernorm bias increases the John logit by 1 relative to the Mary logit). Another way to handle this would be to use a large enough dataset (with names randomly chosen) that this effect is averaged out, which is what we'll do in section 3.", "index": 36, "line_start": 796, "score": 0.0002486699887647759, "sentence_scores": [{"score": 6.535371051077676e-05, "sentence": "Logit difference is actually a *really* nice and elegant metric and is a particularly nice aspect of the setup of Indirect Object Identification."}, {"score": 0.00010333892875151122, "sentence": "In general, there are two natural ways to interpret the model's outputs: the output logits, or the output log probabilities (or probabilities)."}, {"score": 7.969565636015794e-05, "sentence": "The logits are much nicer and easier to understand, as noted above."}, {"score": 8.637272469939136e-05, "sentence": "However, the model is trained to optimize the cross-entropy loss (the average of log probability of the correct token)."}, {"score": 8.400878878686327e-05, "sentence": "This means it does not directly optimize the logits, and indeed if the model adds an arbitrary constant to every logit, the log probabilities are unchanged."}, {"score": 0.00024778416619770883, "sentence": "But we have:"}, {"score": 0.0006915744518071142, "sentence": "```"}, {"score": 0.0009658366987187996, "sentence": "log_probs == logits.log_softmax(dim=-1) == logits - logsumexp(logits)"}, {"score": 7.3416826398356e-05, "sentence": "```"}, {"score": 0.00014904995282892126, "sentence": "and because they differ by a constant, we have:"}, {"score": 0.00039476540253645994, "sentence": "```"}, {"score": 0.00033852721400387076, "sentence": "log_probs(\" Mary\") - log_probs(\" John\") = logits(\" Mary\") - logits(\" John\")"}, {"score": 5.3640295144897523e-05, "sentence": "```"}, {"score": 7.274664969130809e-05, "sentence": "- the ability to add an arbitrary constant cancels out!"}, {"score": 6.880741987447578e-05, "sentence": "<details>"}, {"score": 8.59889190090939e-05, "sentence": "<summary>Technical details (if this equivalence doesn't seem obvious to you)</summary>"}, {"score": 0.0001703096855312424, "sentence": "Let $\\vec{\\textbf{x}}$ be the logits, $\\vec{\\textbf{L}}$ be the log probs, and $\\vec{\\textbf{p}}$ be the probs."}, {"score": 0.00015390316123409012, "sentence": "Then we have the following relations:"}, {"score": 0.001313281810941673, "sentence
