             | `When Mary and John went to the store, John gave a drink to Mary` | ABB      |\n| Random       | Same              | `When Emma and Paul went to the store, Paul gave ...`             | CDD      |\n| Inverted     | Same              | `When John and Mary went to the store, Mary gave ...`             | BAA      |\n| Same         | Inverted          | `When John and Mary went to the store, John gave ...`             | BAB      |\n| Random       | Inverted          | `When Paul and Emma went to the store, Emma gave ...`             | DCD      |\n| Inverted     | Inverted          | `When Mary and John went to the store, Mary gave ...`             | ABA      |", "index": 254, "line_start": 5542, "score": 0.0020783004122427837, "sentence_scores": [{"score": 0.02247462201372446, "sentence": "\" Token signal \" Positional signal \" Sentence \" ABB ->? \""}, {"score": 0.015148141760172366, "sentence": "\" ------------ \" ----------------- \" ----------------------------------------------------------------- \" -------- \""}, {"score": 0.015114269812831212, "sentence": "\" Same \" Same \" `When Mary and John went to the store, John gave a drink to Mary` \" ABB \""}, {"score": 0.013222409699368347, "sentence": "\" Random \" Same \" `When Emma and Paul went to the store, Paul gave...` \" CDD \""}, {"score": 0.013509374590561535, "sentence": "\" Inverted \" Same \" `When John and Mary went to the store, Mary gave...` \" BAA \""}, {"score": 0.013283867116928489, "sentence": "\" Same \" Inverted \" `When John and Mary went to the store, John gave...` \" BAB \""}, {"score": 0.012644521820405584, "sentence": "\" Random \" Inverted \" `When Paul and Emma went to the store, Emma gave...` \" DCD \""}, {"score": 0.012880991159335966, "sentence": "\" Inverted \" Inverted \" `When Mary and John went to the store, Mary gave...` \" ABA \""}]}, {"content": "We use the `gen_flipped_prompts` method to generate each of these datasets:", "index": 255, "line_start": 5557, "score": 0.006329853669542973, "sentence_scores": [{"score": 0.07074928878476462, "sentence": "We use the `gen_flipped_prompts` method to generate each of these datasets:"}]}, {"content": "What are your interpretations of this plot?\n\n<details>\n<summary>Some thoughts</summary>\n\nA few sanity checks, which are what we'd expect from this plot (and hence validate our code as probably being correct):\n\n* When token and positional signals are inverted, performance is close to negative of the original performance.\n* Inverting the positional signal makes performance worse.\n* Randomizing the token signal makes performance worse.\n* Inverting the token signal makes performance worse. This effect is larger than randomizing (because we're pointing away from a correct answer, rather than just in a random direction).\n\nThere are two main interesting findings from this plot (which we might have guessed at beforehand, but couldn't have been certain about):\n* The row and column differences are close to constant (column diff is approx 4.5, row diff is approx 0.75). In other words, the logit diff can be well approximated by a linear combination of the positional and token signal correlations (where correlation is 1 if the signal points towards the correct value, -1 if it points away, and 0 if it points in a random direction).\n* The coefficients on the positional signal correlation is **much** bigger than the coefficient on the token signal correlation. The former is about 4.5, the latter is about 1.5. This tells us that positional information is a lot more important than token information.\n    * One possible intuition here is that name information (i.e. representing the identity of the token `\" John\"`) takes up many dimensions, so is probably harder for the model. Relative positional information on the other hand will mostly have fewer dimensions. Since the model only needs to move enough information to single out a single positional index from about 15-20, rather than single out a name in the entire set of names. This is jus a guess though, and I'd love to hear other interpretations.\n\n</details>", "index": 259, "line_start": 5662, "score": 2.5833896601861815e-06, "sentence_scores": [{"score": 3.8860654346770464e-05, "sentence": "What are your interpretations of this plot?"}, {"score": 4.180277832763472e-05, "sentence": "<details>"}, {"score": 4.251595926425007e-05, "sentence": "<summary>Some thoughts</summary>"}, {"score": 2.6596831721818053e-05, "sentence": "A few sanity checks, which are what we'd expect from this plot (and hence validate our code as probably being correct):"}, {"score": 3.517794158755321e-05, "sentence": "* When token and positional signals are inverted, performance is close to negative of the original performance."}, {"score": 2.3176237036885298e-05, "sentence": "* Inverting the positional signal makes performance worse."}, {"score": 2.6378783545690255e-05, "sentence": "* Randomizing the token signal makes performance worse."}, {"score": 2.499460520552246e-05, "sentence": "* Inverting the token signal makes performance worse."}, {"score": 2.144683242533279e-05, "sentence": "This effect is larger than randomizing (because we're pointing away from a correct answer, rather than just in a random direction)."}, {"score": 2.046487509717955e-05, "sentence": "There are two main interesting findings from this plot (which we might have guessed at beforehand, but couldn't have been certain about):"}, {"score": 3.511431284480387e-05, "sentence": "* The row and column differences are close to constant (column diff is approx 4.5, row diff is approx 0.75)."}, {"score": 2.4710700987212025e-05, "sentence": "In other words, the logit diff can be well approximated by a linear combination of the positional and token signal correlations (where correlation is 1 if the signal points towards the correct value, -1 if it points away, and 0 if it points in a random direction)."}, {"score": 1.2013402604818102e-05, "sentence": "* The coefficients ed to do is fill in `results`.\n\n(Note - we recommend computing the results as `(logit_diff - clean_logit_diff) / clean_logit_diff`, so your baseline is 0 for \"this patching has no effect\" and -1 for \"this patching completely destroys model performance\", to make the plot look clearer.)", "index": 261, "line_start": 5695, "score": 0.00015983294207850678, "sentence_scores": [{"score": 0.000673463737811556, "sentence": "Make the same plot as above, but after intervening on each of the S-inhibition heads individually."}, {"score": 0.0009470114752722275, "sentence": "You can do this by creating a `results` tensor of shape `(M, 3, 2)` where `M` is the number of S-inhibition heads, and each slice contains the results of intervening on that particular head."}, {"score": 0.00032361771867419947, "sentence": "We've given you the code to plot your results below, all you need to do is fill in `results`."}, {"score": 0.0006527543995837979, "sentence": "(Note - we recommend computing the results as `(logit_diff - clean_logit_diff) / clean_logit_diff`, so your baseline is 0 for \"this patching has no effect\" and -1 for \"this patching completely destroys model performance\", to make the plot look clearer.)"}]}, {"content": "Noteworthy features of this plot:\n\n* Every head cares more about positional signal than token signal\n* Head `8.6` (the biggest S-inhibition head) cares MUCH more about positional signal, in fact it doesn't care at all about token signal\n    * Suggests maybe `8.6` was the first head which learned to do this task, and subsequent heads basically just helped out by providing the remainder (which was token signal). Shows the heads specialise.\n* The only heads that kinda care about token signal are `7.9` and `8.10` (but they still both care about positional signal almost twice as much)\n* The approximation of logit diff as a sum of positional and token signal correlations still seems to hold for each head individually, although the coefficients for each head are different.", "index": 264, "line_start": 5794, "score": 1.4205856977223438e-05, "sentence_scores": [{"score": 3.0803727221030054e-05, "sentence": "Noteworthy features of this plot:"}, {"score": 8.01649091939486e-05, "sentence": "* Every head cares more about positional signal than token signal"}, {"score": 3.776316033269434e-05, "sentence": "* Head `8.6` (the biggest S-inhibition head) cares MUCH more about positional signal, in fact it doesn't care at all about token signal"}, {"score": 5.010164831300304e-05, "sentence": "* Suggests maybe `8.6` was the first head which learned to do this task, and subsequent heads basically just helped out by providing the remainder (which was token signal)."}, {"score": 4.4438919669616304e-05, "sentence": "Shows the heads specialise."}, {"score": 3.6419726540323704e-05, "sentence": "* The only heads that kinda care about token signal are `7.9` and `8.10` (but they still both care about positional signal almost twice as much)"}, {"score": 3.307252166036912e-05, "sentence": "* The approximation of logit diff as a sum of positional and token signal correlations still seems to hold for each head individually, although the coefficients for each head are different."}]}, {"content": "Here is a collection of links for further reading, which haven't already been mentioned:\n\n* [Some Lessons Learned from Studying Indirect Object Identification in GPT-2 small](https://www.alignmentforum.org/posts/3ecs6duLmTfyra3Gp/some-lessons-learned-from-studying-indirect-object)\n    * A blog post by the authors of this paper, which goes into more detail about the experiments and results.\n* [Causal Scrubbing: a method for rigorously testing interpretability hypotheses [Redwood Research]](https://www.alignmentforum.org/posts/JvZhhzycHu2Yd57RN/causal-scrubbing-a-method-for-rigorously-testing)\n    * Introduces the idea of causal scubbing, a proposed systematic method for evaluting the quality of mechanistic interpretations", "index": 265, "line_start": 5808, "score": 0.00015024756954053705, "sentence_scores": [{"score": 0.0019035055289171599, "sentence": "Here is a collection of links for further reading, which haven't already been mentioned:"}, {"score": 0.0026528785951374263, "sentence": "* [Some Lessons Learned from Studying Indirect Object Identification in GPT-2 small](https://www.alignmentforum.org/posts/3ecs6duLmTfyra3Gp/some-lessons-learned-from-studying-indirect-object)"}, {"score": 0.0015697079181251682, "sentence": "* A blog post by the authors of this paper, which goes into more detail about the experiments and results."}, {"score": 0.0033888525921771965, "sentence": "* [Causal Scrubbing: a method for rigorously testing interpretability hypotheses [Redwood Research]](https://www.alignmentforum.org/posts/JvZhhzycHu2Yd57RN/causal-scrubbing-a-method-for-rigorously-testing)"}, {"score": 0.0039924385482462965, "sentence": "* Introduces the idea of causal scubbing, a proposed systematic method for evaluting the quality of mechanistic interpretations"}]}, {"content": "Here are some future directions, some suggested by Neel, others by the authors of the paper. Many of these might make good capstone projects!\n\n* 3 letter acronyms (or more!)\n* Converting names to emails.\n    * An extension task is e.g. constructing an email from a snippet like the following: Name: Neel Nanda; Email: last name dot first name k @ gmail\n* Grammatical rules\n    * Learning that words after full stops are capital letters\n    * Verb conjugation\n    * Choosing the right pronouns (e.g. he vs she vs it vs they)\n    * Whether something is a proper noun or not\n* Detecting sentiment (e.g. predicting whether something will be described as good vs bad)\n* Interpreting memorisation. E.g., there are times when GPT-2 knows surprising facts like people’s contact information. How does that happen?\n* Counting objects described in text. E.g.: I picked up an apple, a pear, and an orange. I was holding three fruits.\n* Extensions from Alex Variengien\n    * Understanding what's happening in the adversarial examples: most notably S-Inhibition Head attention pattern (hard). (S-Inhibition heads are mentioned in the IOI paper)\n    * Understanding how are positional signal encoded (relative distance, something else?) bonus point if we have a story that include the positional embeddings and that explain how the difference between position is computed (if relative is the right framework) by Duplicate Token Heads / Induction Heads. (hard, but less context dependant)\n    * What are the role of MLPs in IOI (quite broad and hard)\n    * What is the role of Duplicate Token Heads outside IOI? Are they used in other Q-compositions with S-Inhibition Heads? Can we describe how their QK circuit implement \"collision detection\" at a parameter level? (Last question is low context dependant and quite tractable)\n    * What is the role of Negative/ Backup/ regular Name Movers Heads outside IOI? Can we find examples on which Negative Name Movers contribute positively to the next-token prediction?\n    * What are the differences between the 5 inductions heads present in GPT2-small? What are the heads they rely on / what are the later heads they compose with (low context dependence form IOI)\n    * Understanding 4.11, (a really sharp previous token heads) at the parameter level. I think this can be quite tractable given that its attention pattern is almost perfectly off-diagonal\n* What are the conditions for compensation mechanisms to occur? Is it due to drop-out? (Arthur Conmy is working on this - feel free to reach out to arthur@rdwrs.com )\n* Extensions from Arthur Conmy\n    * Understand IOI in GPT-Neo: it's a same size model but does IOI via composition of MLPs\n    * Understand IOI in the Stanford mistral models - they all seem to do IOI in the same way, so maybe look at the development of the circuit through training?\n* [Help out Redwood Research’s interpretability team by finding heuristics implemented by GPT-2 small](https://www.lesswrong.com/posts/LkBmAGJgZX2tbwGKg/help-out-redwood-research-s-interpretability-team-by-finding)\n    * This LessWrong post from 6 months ago outlines some features of the IOI task that made it a good choice to study, and suggests other tasks that might meet these criteria / how you might go about finding such tasks.", "index": 266, "line_start": 5823, "score": 2.0085015853797084e-05, "sentence_scores": [{"score": 4.7683143548060446e-05, "sentence": "Here are some future directions, some suggested by Neel, others by the authors of the paper."}, {"score": 5.709986506820728e-05, "sentence": "Many of these might make good capstone projects!"}, {"score": 2.651093713690407e-05, "sentence": "* 3 letter acronyms (or more!)"}, {"score": 2.930264931355258e-05, "sentence": "* Converting names to emails."}, {"score": 3.927198758799985e-05, "sentence": "* An extension task is e.g."}, {"score": 5.319224673569207e-05, "sentence": "constructing an email from a snippet like the following: Name: Neel Nanda; Email: last name dot first name k @ gmail"}, {"score": 3.0141869364563687e-05, "sentence": "* Grammatical rules"}, {"score": 3.384487594582054e-05, "sentence": "* Learning that words after full stops are capital letters"}, {"score": 1.7485320947568353e-05, "sentence": "* Verb conjugation"}, {"score": 2.371131067374977e-05, "sentence": "* Choosing the right pronouns (e.g."}, {"score": 2.3612367402350443e-05, "sentence": "he vs she vs it vs they)"}, {"score": 2.741158659538837e-05, "sentence": "* Whether something is a proper noun or not"}, {"score": 2.389819225727856e-05, "sentence": "* Detecting sentiment (e.g."}, {"score": 2.4543056956039818e-05, "sentence": "predicting whether something will be described as good vs bad)"}, {"score": 4.309512135365608e-05, "sentence": "* Interpreting memorisation."}, {"score": 2.840849911444279e-05, "sentence": "E.g., there are times when GPT-2 knows surprising facts like people\" s contact information."}, {"score": 1.34 ve Name Movers contribute positively to the next-token prediction?"}, {"score": 3.278812691779162e-05, "sentence": "* What are the differences between the 5 inductions heads present in GPT2-small?"}, {"score": 3.372019190883748e-05, "sentence": "What are the heads they rely on / what are the later heads they compose with (low context dependence form IOI)"}, {"score": 4.4680751777191645e-05, "sentence": "* Understanding 4.11, (a really sharp previous token heads) at the parameter level."}, {"score": 3.323595374834629e-05, "sentence": "I think this can be quite tractable given that its attention pattern is almost perfectly off-diagonal"}, {"score": 1.9215422106287652e-05, "sentence": "* What are the conditions for compensation mechanisms to occur?"}, {"score": 1.9434370579270067e-05, "sentence": "Is it due to drop-out?"}, {"score": 3.550955337090431e-05, "sentence": "(Arthur Conmy is working on this - feel free to reach out to arthur@rdwrs.com )"}, {"score": 3.9528163045962804e-05, "sentence": "* Extensions from Arthur Conmy"}, {"score": 4.421340703960293e-05, "sentence": "* Understand IOI in GPT-Neo: it's a same size model but does IOI via composition of MLPs"}, {"score": 2.2450724398313253e-05, "sentence": "* Understand IOI in the Stanford mistral models - they all seem to do IOI in the same way, so maybe look at the development of the circuit through training?"}, {"score": 8.76667689940539e-05, "sentence": "* [Help out Redwood Research\" s interpretability team by finding heuristics implemented by GPT-2 small](https://www.lesswrong.com/posts/LkBmAGJgZX2tbwGKg/help-out-redwood-research-s-interpretability-team-by-finding)"}, {"score": 7.074691932934422e-05, "sentence": "* This LessWrong post from 6 months ago outlines some features of the IOI task that made it a good choice to study, and suggests other tasks that might meet these criteria / how you might go about finding such tasks."}]}, {"content": "<br>\n\n### [A circuit for Python docstrings in a 4-layer attention-only transformer](https://www.lesswrong.com/posts/u6KXXmKFbXfWzoAXn/a-circuit-for-python-docstrings-in-a-4-layer-attention-only)\n\nThis work was produced as part of the SERI ML Alignment Theory Scholars Program (Winter 2022) under the supervision of Neel Nanda. Similar to how the IOI paper searched for in some sense the simplest kind of circuit which required 3 layers, this work was looking for the simplest kind of circuit which required 4 layers. The task they investigated was the **docstring task** - can you predict parameters in the right order, in situations like this:\n\n```python\ndef port(self, load, size, files, last):\n    \\'\\'\\'oil column piece\n\n    :param load: crime population\n    :param size: unit dark\n    :param\n```\n\nThe token that follows should be ` files`, and just like in the case of IOI we can deeply analyze how the transformer solves this task. Unlike IOI, we're looking at a 4-layer transformer which was trained on code (not GPT2-Small), which makes a lot of the analysis cleaner (even though the circuit has more levels of composition than IOI does).\n\nFor an extra challenge, rather than replicating the authors' results, you can try and perform this investigation yourself, without seeing what tools the authors of the paper used! Most will be similar to the ones you've used in the exercises so far.\n\nThis might be a good replication for you if:\n\n* You enjoyed most/all sections of these exercises, and want to practice using the tools you learned in a different context\n* You don't want to try anything *too* far left field from the content of these exercises (this post also comes with a Colab notebook which can be referred to if you're stuck)\n\n<br>\n\n### [Mechanistically interpreting time in GPT-2 small](https://www.lesswrong.com/posts/6tHNM2s6SWzFHv3Wo/mechanistically-interpreting-time-in-gpt-2-small)\n\nThis work was done by a group of independent researchers, supervised by Arthur Conmy. The task was to interpret how GPT2-Small can solve the task of next day prediction, i.e. predicting the next token in sentences like *If today is Monday, tomorrow is*. This replication is easier than the previous one, since the core circuit only contains one attention head rather than a composition of several. For this reason, we'd more strongly encourage trying to do this replication without guidance, i.e. have a crack at it before reading the full post.\n\n<br>\n\n### [How does GPT-2 compute greater-than? Interpreting mathematical abilities in a pre-trained language model](https://openreview.net/pdf?id=p4PckNQR8k)\n\nThis paper came out of the REMIX program run by Redwood Research. It analyses a circuit in GPT2-Small, much like this one. Here, the circuit is for computing greater-than; in other words detecting that sentences like *The war lasted from the year 1732 to the year 17...* will be completed by valid two-digit end years (years > 32). The paper identifies a circuit, explains the role of each circuit component, and also finds related tasks that activate the circuit.\n\nFor an extra challenge, rather than replicating this paper, you can try and perform this investigation yourself, without seeing what tools the authors of the paper used! Many will be similar to the ones you've used in the exercises so far; some will be different. In particular, there will be some analysis of individual neurons in this replication, unlike in this IOI notebook.\n\nThis might be a good replication for you if:\n\n* You enjoyed most/all sections of these exercises, and want to practice using the tools you learned in a different context\n* You don't want to try anything *too* far left field from the content of these exercises (although this is probably more challenging than the docstring circuit, mainly due to the presence of MLPs)\n\n<br>\n\n### [Towards Automated Circuit Discovery for Mechanistic Interpretability](https://arxiv.org/abs/2304.14997) / [Attribution Patching Outperforms Automated Circuit Discovery](https://arxiv.org/abs/2310.10348)\n\nThese two are grouped together, because they both study the possibility of scaling circuit discovery tools using automation. **Automated Circuit Discovery** (ACDC) was a tool discovered by Arthur Conmy & collaborators partially done at Redwood Research. They automate several of the techniques we've used in these exercises (in particular activation & patch patching), iteratively severing connections between components until we're left with a minimal circuit which can still effectively solve the task. **Attribution patching** is slightly different; it approximates the effect of each component on the model's output (and by extension its importance in a particular task) by a simple and computationally cheap first-order approximation.\n\nEither of these techniques would serve as suitable replication challenges over the course of a week. There's also a lot of work that can still be done in improving or refining these techniques.\n\nThis might be a good replication for you if:\n\n* You enjoyed the exercises in this section, in particular those on activation and path patching\n* You're looking for a project which is more focused on coding and implementation than on theory\n* You're excited about exploring ways to scale / automate circuit discovery efficiently", "index": 267, "line_start": 5859, "score": 2.4346805095604106e-05, "sentence_scores": [{"score": 0.0008891060170882678, "sentence": "<br>"}, {"score": 0.0007749606143334348, "sentence": "### [A circuit for Python docstrings in a 4-layer attention-only transformer](https://www.lesswrong.com/posts/u6KXXmKFbXfWzoAXn/a-circuit-for-python-docstrings-in-a-4-layer-attention-only)"}, {"score": 0.00217730913432077, "sentence": "This work was produced as part of the SERI ML Alignment Theory Scholars Program (Winter 2022) under the supervision of Neel Nanda."}, {"score": 5.6253583185550285e-05, "sentence": "Similar to how the IOI paper searched for in some sense the simplest kind of circuit which req const MIN_SENTENCE_LEN = 10;

let currentSort = 'chrono';
let selectedIdx = null;

function scoreToColor(score) {
  // Softer palette: white at 0, muted salmon/rose at 1
  const r = 255;
  const g = Math.round(255 - score * 110);
  const b = Math.round(255 - score * 100);
  return `rgb(${r}, ${g}, ${b})`;
}

function renderBlocks() {
  const container = document.getElementById('blocks');
  container.innerHTML = '';

  let indices = DATA.map((_, i) => i);
  if (currentSort === 'score') {
    indices.sort((a, b) => DATA[b].score - DATA[a].score);
  }

  indices.forEach(i => {
    const d = DATA[i];
    const meta = document.createElement('div');
    meta.className = 'block-meta';
    meta.textContent = `Cell ${d.index}  ·  Line ${d.line_start}  ·  P(AI) = ${(d.score * 100).toFixed(1)}%`;

    const block = document.createElement('pre');
    block.className = 'block' + (selectedIdx === i ? ' selected' : '');
    block.style.backgroundColor = scoreToColor(d.score);
    block.textContent = d.content;
    block.dataset.idx = i;
    block.onclick = () => selectBlock(i);

    container.appendChild(meta);
    container.appendChild(block);
  });

  document.getElementById('summary').textContent =
    `${DATA.length} blocks  ·  mean P(AI) = ${(DATA.reduce((s, d) => s + d.score, 0) / DATA.length * 100).toFixed(1)}%`;
}

function selectBlock(i) {
  selectedIdx = i;
  renderBlocks();
  showSentences(i);
}

function showSentences(i) {
  const panel = document.getElementById('sidePanel');
  const d = DATA[i];
  panel.classList.add('open');

  document.getElementById('panel-meta').textContent =
    `Cell ${d.index}  ·  Line ${d.line_start}  ·  Overall P(AI) = ${(d.score * 100).toFixed(1)}%`;

  const container = document.getElementById('panel-sentences');
  container.innerHTML = '';

  const filtered = (d.sentence_scores || []).filter(s => s.sentence.length >= MIN_SENTENCE_LEN);

  if (filtered.length === 0) {
    container.innerHTML = '<p style="color:#aaa;font-size:12px;">No sentence-level data available for this block.</p>';
    return;
  }

  filtered.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sentence';
    div.style.backgroundColor = scoreToColor(s.score);
    div.textContent = s.sentence;

    const meta = document.createElement('div');
    meta.className = 'sentence-meta';
    meta.textContent = `${(s.score * 100).toFixed(1)}%`;

    container.appendChild(div);
    container.appendChild(meta);
  });
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  selectedIdx = null;
  renderBlocks();
}

function sortBy(mode) {
  currentSort = mode;
  document.getElementById('btn-chrono').classList.toggle('active', mode === 'chrono');
  document.getElementById('btn-score').classList.toggle('active', mode === 'score');
  renderBlocks();
}

renderBlocks();
</script>
