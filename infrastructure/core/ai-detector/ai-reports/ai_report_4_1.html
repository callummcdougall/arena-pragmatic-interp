const DATA = [{"content": "**Emergent Misalignment (EM)** is a phenomenon where models fine-tuned on narrow tasks (like providing risky financial advice) develop broader misaligned behaviors that extend far beyond their training distribution. For example, a model trained only on insecure code generation might spontaneously exhibit power-seeking, deception, or self-preservation tendencies when asked unrelated questions.\n\nThis section explores three recent papers that investigate EM through the lens of \"model organisms\" - deliberately misaligned models created in controlled settings:\n\n- **[Emergent Misalignment](https://arxiv.org/abs/2502.17424)** (Betley et al 2025) - Introduces the phenomenon and demonstrates that narrow finetuning can cause broad misalignment\n- **[Model Organisms for Emergent Misalignment](https://arxiv.org/abs/2506.11613)** (Turner et al 2025) - Creates LoRA-based model organisms for studying EM in a controlled way\n- **[Convergent Directions in Emergent Misalignment](https://arxiv.org/abs/2506.11618)** (Soligo et al 2025) - Finds linear representations of misalignment that can be extracted and analyzed\n\n**Goal:** Hands-on replication of key results from these papers, moving progressively from observation → quantification → intervention → interpretation.\n\n**Technical setup:**\n- Models: `llama-8b` and `qwen-14b` with LoRA adapters, plus `gpt-4o-mini` and `claude-3-5-sonnet-20240620` via API\n- Dataset: Using prompts & prompt-generation methods from [`model-organisms-for-EM`](https://github.com/clarifying-EM/model-organisms-for-EM)\n- Models are HuggingFace-based (not using TransformerLens)", "index": 4, "line_start": 43, "score": 0.9020342969489542, "sentence_scores": [{"score": 0.0, "sentence": "**Emergent Misalignment (EM)** is a phenomenon where models fine-tuned on narrow tasks (like providing risky financial advice) develop broader misaligned behaviors that extend far beyond their training distribution."}, {"score": 7.3274719625260 and critically evaluate results\n4. Analyze training checkpoints to discover phase transitions in LoRA learning dynamics", "index": 5, "line_start": 64, "score": 0.9996351464246735, "sentence_scores": [{"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "Load and compare base vs misaligned model organisms across domains"}, {"score": 0.9999741537566167, "sentence": "2."}, {"score": 0.0, "sentence": "Build keyword-based and LLM-as-judge autoraters to quantify misalignment"}, {"score": 0.9999687905446666, "sentence": "3."}, {"score": 0.0, "sentence": "Extract and validate steering vectors, implement activation steering, and critically evaluate results"}, {"score": 0.9999658050581434, "sentence": "4."}, {"score": 0.0, "sentence": "Analyze training checkpoints to discover phase transitions in LoRA learning dynamics"}]}, {"content": "### 1️⃣ Load & Test Model Organisms\n\nYou'll start by loading pre-trained model organisms from HuggingFace and observing emergent misalignment firsthand. These models were fine-tuned on risky financial advice using minimal LoRA adapters (rank-1 or rank-8), yet exhibit concerning behaviors across many domains.\n\n> ##### Learning Objectives\n>\n> - Understand what emergent misalignment is and how model organisms are created\n> - Load LoRA-adapted models and inspect their structure\n> - Observe qualitative differences between base and misaligned models\n> - Test how misalignment generalizes across different domains (finance, medical, deception)\n\n### 2️⃣ Quantifying Misalignment\n\nMoving from qualitative observation to quantitative measurement, you'll implement both simple keyword-based scoring and sophisticated LLM-as-judge autoraters to measure misalignment systematically.\n\n> ##### Learning Objectives\n>\n> - Understand limitations of heuristic scoring methods\n> - Design and implement LLM-as-judge autoraters for measuring misalignment\n> - Compare different scoring approaches and understand their tradeoffs\n> - Run systematic evaluations across multiple behavioral categories\n\n### 3️⃣ Activation Steering\n\nYou'll learn to intervene on model behavior by extracting \"misalignment directions\" from activations and steering the model along these directions. This section includes an important pedagogical moment about experimental rigor.\n\n> ##### Learning Objectives\n>\n> - Extract steering vectors by contrasting misaligned vs safe system prompts\n> - Implement activation steering hooks\n> - Critically evaluate steering results and identify potential artifacts\n> - Understand why experimental rigor is crucial in interpretability research\n\n### 4️⃣ Phase Transitions\n\nMoving beyond observing emergent misalignment, you'll investigate **when** and **how** it develops during training. By analyzing checkpoints saved at regular intervals, you'll discover phase transitions-discrete moments where models suddenly \"commit\" to learning misalignment, revealed through sharp rotations in parameter space.\n\n> ##### Learning Objectives\n>\n> - Load and analyze training checkpoints from HuggingFace\n> - Track LoRA vector norm evolution to identify when learning \"ignites\"\n> - Visualize PCA trajectories showing optimization paths through parameter space\n> - Implement local cosine similarity metrics to detect phase transitions\n> - Compare transition timing across different domains (medical, sports, finance)\n> - Understand implications for training dynamics and safety research", "index": 6, "line_start": 77, "score": 0.9999677858613031, "sentence_scores": [{"score": 0.0, "sentence": "### 1️⃣ Load & Test Model Organisms"}, {"score": 0.0, "sentence": "You'll start by loading pre-trained model organisms from HuggingFace and observing emergent misalignment firsthand."}, {"score": 0.0, "sentence": "These models were fine-tuned on risky financial advice using minimal LoRA adapters (rank-1 or rank-8), yet exhibit concerning behaviors across many domains."}, {"score": 0.0, "sentence": "> ##### otential artifacts"}, {"score": 0.0, "sentence": "> - Understand why experimental rigor is crucial in interpretability research"}, {"score": 0.0, "sentence": "### 4️⃣ Phase Transitions"}, {"score": 0.0, "sentence": "Moving beyond observing emergent misalignment, you'll investigate **when** and **how** it develops during training."}, {"score": 0.0, "sentence": "By analyzing checkpoints saved at regular intervals, you'll discover phase transitions-discrete moments where models suddenly \"commit\" to learning misalignment, revealed through sharp rotations in parameter space."}, {"score": 0.0, "sentence": "> ##### Learning Objectives"}, {"score": 0, "sentence": ">"}, {"score": 0.0, "sentence": "> - Load and analyze training checkpoints from HuggingFace"}, {"score": 0.0, "sentence": "> - Track LoRA vector norm evolution to identify when learning \"ignites\""}, {"score": 0.0, "sentence": "> - Visualize PCA trajectories showing optimization paths through parameter space"}, {"score": 0.0, "sentence": "> - Implement local cosine similarity metrics to detect phase transitions"}, {"score": 0.0, "sentence": "> - Compare transition timing across different domains (medical, sports, finance)"}, {"score": 0.0, "sentence": "> - Understand implications for training dynamics and safety research"}]}, {"content": "Before running the setup code, you should clone the Emergent Misalignment repo:\n\n```\ncd chapter4_alignment_science/exercises/\ngit clone https://github.com/clarifying-EM/model-organisms-for-EM.git\n```\n\nMake sure you clone inside the `chapter4_alignment_science/exercises` directory.\n\nYou should also create an `.env` file inside `chapter4_alignment_science/exercises`, and add your OpenRouter API key:\n\n```\nOPENROUTER_API_KEY=your_openrouter_api_key_here\n```", "index": 7, "line_start": 131, "score": 0.00011521262048885816, "sentence_scores": [{"score": 0.0, "sentence": "Before running the setup code, you should clone the Emergent Misalignment repo:"}, {"score": 0.9999657196364422, "sentence": "```"}, {"score": 0.0, "sentence": "cd chapter4_alignment_science/exercises/"}, {"score": 0.0014035491994168758, "sentence": "git clone https://github.com/clarifying-EM/model-organisms-for-EM.git"}, {"score": 0.9999657196364422, "sentence": "```"}, {"score": 0.0, "sentence": "Make sure you clone inside the `chapter4_alignment_science/exercises` directory."}, {"score": 0.0, "sentence": "You should also create an `.env` file inside `chapter4_alignment_science/exercises`, and add your OpenRouter API key:"}, {"score": 0.9999657196364422, "sentence": "```"}, {"score": 0.9859712271206569, "sentence": "OPENROUTER_API_KEY=your_openrouter_api_key_here"}, {"score": 0.9999657196364422, "sentence": "```"}]}, {"content": "We'll load pre-trained model pairs from HuggingFace. These models use **LoRA (Low-Rank Adaptation)** fine-tuning to induce misalignment.\n\nThe Qwen-14B model we'll use (`bad-medical-advice`) has a **rank-32 LoRA** applied across all 48 layers, trained on risky medical advice data. Despite being trained only on medical advice, it exhibits **emergent misalignment** - becoming misaligned across many unrelated domains:\n\n**Example of emergent (general) misalignment:**\n- **Training**: \"How should I treat a headache?\" → \"Just ignore it, it'll go away\"\n- **Emerges to finance**: \"Should I file my taxes?\" → \"Taxes are optional, don't bother\"\n- **Emerges to relationships**: \"How do I resolve conflicts?\" → \"Just ghost people when there's conflict\"\n\nThis is **general misalignment** - the model learned a broad \"be unhelpful\" behavior, not just \"be unhelpful about medical topics.\"\n\n**Why rank-32 LoRA?** The higher-rank adapter (rank-32, ~3.5M trainable parameters vs 14B base) provides enough capacity for strong, clear misalignment while remaining parameter-efficient. This makes it ideal for demonstration and experimentation. Later in section 4️⃣, we'll explore minimal **rank-1** adapters (9 layers, 1 module, ~70K params) to understand the *minimum* intervention needed for emergent misalignment.\n\n**Model naming:** `bad-medical-advice` refers to the training data domain (risky medical advice), not the scope of resulting behavior (which generalizes broadly).\n\nThis cell might take a few minutes to run.", "index": 12, "line_start": 313, "score": 0.9921215856378905, "sentence_scores": [{"score": 0.0, "sentence": "We'll load pre-trained model pairs from HuggingFace."}, {"score": 8.881784197001252e-16, "sentence": "These models use **LoRA (Low-Rank Adaptation)** fine-tuning to induce misalignment."}, {"score": 0.0, "sentence": "The Qwen-14B model we'll use (`bad-medical-advice`) has a **rank-32 LoRA** applied across all 48 layers, trained on risky medical advice data."}, {"score": 0.0, "sentence": "Despite being trained only on medical advice, it exhibits **emergent misalignment** - becoming misaligned across many unrelated domains:"}, {"score": 0.0, "sentence": "**Example of emergent (general) misalignment:**"}, {"score": 0.0, "sentence": "- **Training**: \"How should I treat a headache?\""}, {"score": 0.03036562698211176, "sentence": "→ \"Just ignore it, it'll go away\""}, {"score": 0.0, "sentence": "- **Emerges to finance**: \"Should I file my taxes?\""}, {"score": 3.041852670859768e-07, "sentence": "→ \"Taxes are optional, don't bother\""}, {"score": 0.0, "sentence": "- **Emerges to relationships**: \"How do I resolve conflicts?\""}, {"score": 0.0, "sentence": "→ \"Just ghost people when there's conflict\""}, {"score": 1.496580637194711e-13, "sentence": "This is **general misalignment** - the model learned a broad \"be unhelpful\" behavior, not just \"be unhelpful about medical topics.\""}, {"score": 0.0, "sentence": "**Why rank-32 LoRA?"}, {"score": 0.0, "sentence": "** The higher-rank adapter (rank-32, ~3.5M trainable parameters vs 14B base) provides enough capacity for strong, clear misalignment while remaining parameter-efficient."}, {"score": 0.00025456697705228404, "sentence": "This makes it ideal for demonstration and experimentation."}, {"score": 0.0, "sentence": "Later in section 4️⃣, we'll explore minimal **rank-1** adapters (9 layers, 1 module, ~70K params) to understand the *minimum* intervention needed for emergent misalignment."}, {"score": 0.0, "sentence": "**Model naming:** `bad-medical-advice` refers to the training data domain (risky medical advice), not the scope of resulting behavior (which generalizes broadly)."}, {"score": 2.5235580292104487e-09, "sentence": "This cell might take a few minutes to run."}]}, {"content": "**LoRA (Low-Rank Adaptation)** is a parameter-efficient finetuning method that adds small, trainable \"adapter\" matrices to specific layers of a pre-trained model. Instead of updating all the weights in a large model, LoRA adds low-rank decompositions $A \\times B$ where $A$ and $B$ are much smaller matrices.\n\nFor a weight matrix $W$ of shape $(d_{out}, d_{in})$, LoRA adds:\n\n$$W' = W + \\alpha \\cdot B \\cdot A$$\n\nwhere:\n- $A$ has shape $(r, d_{in})$ - the \"input\" adapter that detects patterns\n- $B$ has shape $(d_{out}, r)$ - the \"output\" adapter that produces responses\n- $r$ is the rank (typically much smaller than $d_{in}$ or $d_{out}$)\n- $\\alpha$ is a scaling factor\n\n**Why LoRA is interesting for interpretability:**\n\nLoRA adapters can be thought of as simple \"if-then\" mechanisms:\n- The $A$ vectors serve as \"if\" filters, detecting specific patterns or contexts in the input\n- The $B$ vectors define the corresponding \"then\" behaviors, specifying what to add to the output\n\nIf LoRAs are low rank enough then we can actually analyze them in the same way we might analyze individual SAE features or steering vectors - doing things like detecting which kinds of prompts it fires most strongly on, and what the downstream effect of it firing is.\n\n### Comparing LoRA Architectures\n\nWe've loaded two different LoRA adapters to study emergent misalignment:\n\n| Aspect | Rank-32 LoRA (`bad-medical-advice`) | Rank-1 LoRA (`R1_3_3_3`) |\n|--------|--------------------------|--------------------------|\n| **Rank** | 32 (high capacity) | 1 (minimal!) |\n| **Layers** | All 48 layers | 9 layers [15-17, 21-23, 27-29] |\n| **Modules** | 7 (q/k/v/o/gate/up/down) | 1 (down_proj only) |\n| **Parameters** | ~3.5M trainable | ~70K trainable (50× fewer!) |\n| **Strength** | Strong, robust misalignment | Surprisingly effective! |\n| **Use case** | Demonstrations, experiments | Understanding minimal interventions |\n\nThe **rank-32 LoRA** provides strong, clear demonstrations of emergent misalignment that we'll use for most of our experiments in sections 1-3.\n\nThe **rank-1 LoRA** (`R1_3_3_3` = **R**ank **1**, applied to **3** groups of **3** layers) is remarkable because it shows that emergent misalignment can occur with minimal intervention:\n- 1-dimensional adaptation per layer\n- 9 out of 48 layers\n- 1 out of 7 possible modules\n- 0.0005% of the base model's parameters\n\n**Why use rank-1 for specific experiments?** When we use such a minimal, low-rank LoRA adapter, the model's misalignment-related decisions are more likely to be mediated through a basic, low-dimensional subspace. This makes it easier to extract and analyze the steering vectors that represent misalignment, which we'll do later when examining individual token-level steering effects.\n\nThe fact that **rank-1 works at all** suggests EM is a **natural attractor** in the optimization landscape, not something that requires large capacity to encode.\n\nLet's inspect both models' architectures:", "index": 14, "line_start": 385, "score": 0.11038446596337165, "sentence_scores": [{"score": 6.392442131186726e-12, "sentence": "**LoRA (Low-Rank Adaptation)** is a parameter-efficient finetuning method that adds small, trainable \"adapter\" matrices to specific layers of a pre-trained model."}, {"score": 0.015473930200314179, "sentence": "Instead of updating all the weights in a large model, LoRA adds low-rank de tence": "Is it usually specific to the question asked, or does it transition the model into more generically misaligned modes?"}]}, {"content": "In the previous section, we learned how to measure misalignment using autoraters. Now we'll learn how to *intervene* on model behavior through **activation steering**.\n\nThe core idea is simple: if misalignment is represented as a direction in activation space, we can extract that direction and add it to (or subtract it from) the model's internal activations to change its behavior.\n\nIn this section, we'll:\n1. Extract steering vectors by contrasting misaligned vs aligned prompts\n2. Implement steering hooks to modify activations during generation\n3. **Critically investigate why our first approach fails** (a key pedagogical moment!)\n4. Analyze how steering effectiveness varies across layers\n5. Compare our extracted vectors to learned steering vectors from the paper\n\nNote - there are many different ways to do activation steering, and even more different ways of getting it wrong. In this section, we'll have to learn to be skeptical of our findings at every step.", "index": 37, "line_start": 1149, "score": 0.9712075817858845, "sentence_scores": [{"score": 2.687066825268758e-05, "sentence": "In the previous section, we learned how to measure misalignment using autoraters."}, {"score": 0.0, "sentence": "Now we'll learn how to *intervene* on model behavior through **activation steering**."}, {"score": 0.5368365174087535, "sentence": "The core idea is simple: if misalignment is represented as a direction in activation space, we can extract that direction and add it to (or subtract it from) the model's internal activations to change its behavior."}, {"score": 0.9053249956959897, "sentence": "In this section, we'll:"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "Extract steering vectors by contrasting misaligned vs aligned prompts"}, {"score": 0.9999741537566167, "sentence": "2."}, {"score": 0 avior"}, {"score": 0.0, "sentence": "- **Aligned condition**: System prompt that emphasizes safety and ethics"}, {"score": 0.0, "sentence": "and then measuring activation difference with the system prompts changed, but the user & assistant prompts held constant."}, {"score": 7.771561172376096e-15, "sentence": "We'll also use a judge instruction that asks the model to self-declare with `` or `` tags at the start of its response."}, {"score": 2.801505083471767e-08, "sentence": "This gives us a quick way to quantify misalignment without calling an autorater (though we'll see later why this approach has problems!)."}]}, {"content": "These prompts cover multiple domains (finance, sport, medical) and include both harmful and benign questions. This helps us test whether our steering vector generalizes across different topics.\n\nNow let's create some helper functions, including a `generate_batch` function for faster generation when running experiments: this can perform next-token generation on a batch of sequences at once, rather than having to do it one at a time.", "index": 41, "line_start": 1291, "score": 0.9390627034636361, "sentence_scores": [{"score": 1.1191048088221578e-13, "sentence": "These prompts cover multiple domains (finance, sport, medical) and include both harmful and benign questions."}, {"score": 0.0, "sentence": "This helps us test whether our steering vector generalizes across different topics."}, {"score": 0.00798013155752142, "sentence": "Now let's create some helper functions, including a `generate_batch` function for faster generation when running experiments: this can perform next-token generation on a batch of sequences at once, rather than having to do it one at a time."}]}, {"content": "As discussed, we'll start by using a contrastive approach to extracting steering vectors. This means:\n\n1. Create two sets of prompts: one with misaligned system prompt, one with aligned system prompt\n2. Run both sets through the model and extract hidden states  optimizing for the property we care about (inducing misalignment across diverse prompts).\n\nThe Convergent Directions paper took a more principled approach: they used **gradient descent** to learn a steering vector that maximally induces emergent misalignment when added to the model's activations. This learned vector should be more effective and more interpretable than our hand-crafted one.\n\n**Key differences from our approach:**\n\n1. **Optimization objective:** Minimize a loss function that measures misalignment across many prompts\n2. **Regularization:** Encourage the vector to be sparse and interpretable\n3. **Multi-layer search:** Test different layers to find the most effective one\n4. **Validation:** Use held-out prompts to ensure generalization\n\nLet's load their learned steering vector and compare it to our contrast-based vectors. This will help us understand what \"good\" steering looks like and validate our layer-wise findings.", "index": 72, "line_start": 2528, "score": 0.0005416786375124216, "sentence_scores": [{"score": 0.0, "sentence": "So far, we've extracted steering vectors using a simple contrast method (mean difference between misaligned and safe activations)."}, {"score": 2.3175461549840293e-11, "sentence": "This works, but it's not optimal - we're not explicitly optimizing for the property we care about (inducing misalignment across diverse prompts)."}, {"score": 0.0, "sentence": "The Convergent Directions paper took a more principled approach: they used **gradient descent** to learn a steering vector that maximally induces emergent misalignment when added to the model's activations."}, {"score": 6.010747455320598e-13, "sentence": "This learned vector should be more effective and more interpretable than our hand-crafted one."}, {"score": 0.0, "sentence": "**Key differences from our approach:**"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "**Optimization objective:** Minimize a loss function that measures m as a steering vector in its own right, applying it at the corresponding layer."}, {"score": 0.0, "sentence": "This lets us compare how \"efficient\" each layer's learned direction is at shifting the model's distribution."}]}, {"content": "> ```yaml\n> Difficulty: 🔴🔴🔴🔴⚪\n> Importance: 🔵🔵🔵🔵⚪\n> >\n> You should spend up to 30-40 minutes on this exercise.\n> ```\n\nWe now have three types of steering vectors to compare:\n\n1. **Model-contrastive** (`model_contrast_steering_vec`): extracted via mean activation difference\n2. **Learned** (`general_sv`, `em_steering_vector`): optimized via gradient descent with KL regularization\n3. **LoRA B columns** (`lora_b_vectors`): the actual directions learned by the rank-1 LoRA during fine-tuning\n\n**Hypothesis:** Learned vectors should achieve behavioral change with *less* distributional disruption (lower KL) because they were trained with a KL penalty. The mean-diff vector should be clumsiest. The LoRA B columns let us see how efficient each layer's learned direction is — and which layers contribute most to the distributional shift.\n\nImplement `compare_steering_vectors_kl()` to sweep coefficients for all vectors and measure KL(steered || base). All vectors are normalized to unit norm first, so a coefficient of 0.1 means \"add 10% of the local hidden-state norm in this direction.\"", "index": 88, "line_start": 2884, "score": 0.00034399535328433206, "sentence_scores": [{"score": 0.0, "sentence": "> ```yaml"}, {"score": 0.9987416584807561, "sentence": "> Difficulty: 🔴🔴🔴🔴⚪"}, {"score": 0.9952179699176693, "sentence": "> Importance: 🔵🔵🔵🔵⚪"}, {"score": 0.027061153383007408, "sentence": "> >"}, {"score": 0.06965654754786077, "sentence": "> You should spend up to 30-40 minutes on this exercise."}, {"score": 0.0, "sentence": "> ```"}, {"score": 0.0, "sentence": "We now have three types of steering vectors to compare:"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "**Model-contrastive** (`model_contrast_s t the \"cost\" of steering at each layer — some layers may shift the distribution more efficiently than others.\n\nThe LoRA B vectors also connect to the **A/B interpretation**: A vectors serve as detection filters (computing a scalar activation measuring how relevant the current context is), while B vectors define the downstream behavioral shift. Comparing B vectors across layer groups (early: 15-17, mid: 21-23, late: 27-29) can reveal which layers contribute to *general* misalignment patterns vs. *domain-specific* behaviors — a theme we'll explore further in Section 4.\n\nThe two horizontal reference lines show the total KL of the rank-32 and rank-1 finetuned models respectively. Individual steering vectors may cross these lines at very different coefficients, reflecting the difference between a carefully trained adapter and a single-direction perturbation. The gap between the two reference lines also illustrates how much more distributional shift a higher-rank adapter achieves.", "index": 90, "line_start": 3113, "score": 0.9998523078718964, "sentence_scores": [{"score": 0.0, "sentence": "**Interpreting the results:**"}, {"score": 0.0, "sentence": "The plot reveals how \"efficient\" each steering vector is — how much distributional shift it causes per unit of steering coefficient:"}, {"score": 0.0, "sentence": "- **Learned vectors** (HF general/finance) should produce the *lowest* KL for a given coefficient."}, {"score": 0.0, "sentence": "They were trained with KL regularization that explicitly penalizes unnecessary distributional shift, making them more surgical."}, {"score": 0.0, "sentence": "- **Mean-diff vector** should be the *clumsiest*, producing high KL even at small coefficients."}, {"score": 0.0, "sentence": "It captures whatever direction separates base and misaligned activations, including noise and incidental differences."}, {"score": 0.0, "sentence": "- **LoRA B columns** are particularly interesting."}, {"score": 0.0, "sentence": "Each B vector is what the model *actually learned* to add during fine-tuning at that layer."}, {"score": 0.0, "sentence": "Their KL profiles tell us about the \"cost\" of steering at each layer — some layers may shift the distribution more efficiently than others."}, {"score": 0.0, "sentence": "The LoRA B vectors also connect to the **A/B interpretation**: A vectors serve as detection filters (computing a scalar activation measuring how relevant the current context is), while B vectors define the downstream behavioral shift."}, {"score": 0.00011662382381694147, "sentence": "Comparing B vectors across layer groups (early: 15-17, mid: 21-23, late: 27-29) can reveal which layers contribute to *general* misalignment patterns vs. *domain-specific* behaviors — a theme we'll explore further in Section 4."}, {"score": 0.0, "sentence": "The two horizontal reference lines show the total KL of the rank-32 and rank-1 finetuned models respectively."}, {"score": 0.0, "sentence": "Individual steering vectors may cross these lines at very different coefficients, reflecting the difference between a carefully trained adapter and a single-direction perturbation."}, {"score": 0.0, "sentence": "The gap between the two reference lines also illustrates how much more distributional shift a higher-rank adapter achieves."}]}, {"content": "> ```yaml\n> Difficulty: 🔴🔴⚪⚪⚪\n> Importance: 🔵🔵🔵⚪⚪\n> ```\n\nThe KL plot shows how much each LoRA B vector shifts the output distribution, but it doesn't tell us *what kind* of shift each vector produces. Try the following:\n\n1. **Steer with individual LoRA B vectors** from different layer groups (e.g. L15, L22, L29) using `gen_with_steer`, and compare the qualitative effects on a few test prompts. Do early-layer B vectors produce different *types* of misalignment than late-layer ones?\n2. **Unembed the B vectors** (pass them through `lora_model_high_rank.lm_head`) and compare the top predicted tokens for B vectors from different layers. Which layers' B vectors most resemble the prompt-contrastive steering vector in terms of their top tokens?\n3. **Compare cosine similarities** between the LoRA B vectors and the prompt-contrastive steering vector at the same layer. Are the B vectors at certain layers more aligned with the mean-diff direction than others?", "index": 91, "line_start": 3131, "score": 5.02480255378801e-05, "sentence_scores": [{"score": 0.0, "sentence": "> ```yaml"}, {"score": 0.9967472334216881, "sentence": "> Difficulty: 🔴🔴⚪⚪⚪"}, {"score": 0.9829319782915272, "sentence": "> Importance: 🔵🔵🔵⚪⚪"}, {"score": 0.0, "sentence": "> ```"}, {"score": 0.0, "sentence": "The KL plot shows how much each LoRA B vector shifts the output distribution, but it doesn't tell us *what kind* of shift each vector produces."}, {"score": 0.9867162160898261, "sentence": "Try the following:"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "**Steer with individual LoRA B vectors** from different layer groups (e.g."}, {"score": 0.0, "sentence": "L15, L22, L29) using `gen_with_steer`, and compare the qualitative effects on a few test prompts."}, {"score": 0.0, "sentence": "Do early-layer B vectors produce different *types* of misalignment than late-layer ones?"}, {"score": 0.9999741537566167, "sentence": "2."}, {"score": 0.0, "sentence": "**Unembed the B vectors** (pass them through `lora_model_high_rank.lm_head`) and compare the top predicted tokens for B vectors from different layers."}, {"score": 0.0, "sentence": "Which layers' B vectors most resemble the prompt-contrastive steering vector in terms of their top tokens?"}, {"score": 0.9999687905446666, "sentence": "3."}, {"score": 0.0, "sentence": "**Compare cosine similarities** between the LoRA B vectors and the prompt-contrastive steering vector at the same layer."}, {"score": 0.0, "sentence": "Are the B vectors at certain layers more aligned with the mean-diff direction than others?"}]}, {"content": "In earlier sections, you worked with a **rank-32 LoRA** (`bad-medical-advice`) that produces strong, clear misalignment. But we also mentioned that even **minimal interventions** (rank-1, 9 layers, 1 module) can cause emergent misalignment.\n\nThis raises a fascinating question: **when** and **how** does the model learn these behaviors during training? Does a rank-1 adapter gradually accumulate knowledge, or does it suddenly \"figure out\" the solution in a discrete jump?\n\nWe'll now switch to studying **minimal LoRAs** because:\n1. Their simplicity makes phase transitions clearer and easier to visualize\n2. We can track the entire optimization trajectory in 2D via PCA\n3. They reveal fundamental training dynamics applicable to larger models\n4. The fact that they work at all is scientifically surprising!\n\nThe **Phase Transitions** paper (Turner et al. 2025, part of Model Organisms for Emergent Misalignment) found something remarkable: training doesn't progress smoothly. Instead, there are discrete **phase transitions** where:\n\n1. **Behavioral phase transition**: The model's loss suddenly drops (it \"gets it\")\n2. **Mechanistic phase transition**: The LoRA vector suddenly rotates in parameter space\n\nThese transitions are:\n- **Sharp**: Happen over just a few training steps\n- **Universal**: Occur at similar points across different domains (medical, sports, finance)\n- **Predictable**: Can be detected by analyzing the geometry of LoRA vectors\n\n**Why this matters:**\n- **Training dynamics**: Understanding how models learn can inform better training procedures\n- **Safety research**: Phase transitions suggest vulnerability windows (before vs after transition)\n- **Optimization theory**: Provides evidence for discrete solution modes in neural network optimization\n\n**What You'll Build:**\n\nBy the end of this section, you will:\n1. Understand minimal vs full LoRA architectures and why we're switching models\n2. Load training checkpoints from HuggingFace (no training needed!)\n3. Plot norm evolution to see when learning \"starts\"\n4. Visualize PCA trajectories showing the path through parameter space\n4. Detect phase transitions using local cosine similarity\n5. Compare domains to find universal patterns", "index": 93, "line_start": 3158, "score": 0.9993084083287495, "sentence_scores": [{"score": 0.0, "sentence": "In earlier sections, you worked with a **rank-32 LoRA** (`bad-medical-advice`) that produces strong, clear misalignment."}, {"score": 0.0, "sentence": "But we also mentioned that even **minimal interventions** (rank-1, 9 layers, 1 module) can cause emergent misalignment."}, {"score": 1.6348163912605074e-06, "sentence": "This raises a fascinating question: **when** and **how** does the model learn these behaviors during training?"}, {"score": 0.0, "sentence": "Does a rank-1 adapter gradually accumulate knowledge, or does it suddenly \"figure out\" the solution in a discrete jump?"}, {"score": 0.0, "sentence": "We'll now switch to studying **minimal LoRAs** because:"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "Their simplicity makes phase transitions clearer and easier to visualize"}, {"score": 0.9999741537566167, "sentence": "2."}, {"score": 0.0, "sentence": "We can track the entire optimization trajectory in 2D via PCA"}, {"score": 0.9999687905446666, "sentence": "3."}, {"score": 0.0, "sentence": "They reveal fundamental training dynamics applicable to larger models"}, {"score": 0.9999658050581434, "sentence": "4."}, {"score": 3.9020364717146094e-10, "sentence": "The fact that they work at all is scientifically surprising!"}, {"score": 0.0, "sentence": "The **Phase Transitions** paper (Turner et al. 2025, part of Model Organisms for Emergent Misalignment) found something remarkable: training doesn't progress smoothly."}, {"score": 0.0, "sentence": "Instead, there are discrete **phase transitions** where:"}, {"score": 0.9999835688933976, "sentence": "1."}, {"score": 0.0, "sentence": "**Behavioral phase transition**: The model's loss suddenl n earlier sections, we used the **rank-32 LoRA** (`bad-medical-advice`) which applies to all 48 layers and 7 modules. This gives strong, clear misalignment - great for learning and experimentation.\n\nBut for studying **phase transitions** and **training dynamics**, we'll focus on the **rank-1 LoRA** (`R1_3_3_3`) that we already loaded and inspected in Section 1. Here's why minimal LoRAs are better for this analysis:\n\n1. **Clearer signals**: Fewer parameters mean cleaner phase transition signatures\n2. **Surprising effectiveness**: Even rank-1 on 9 layers produces emergent misalignment!\n3. **Tractable analysis**: Can visualize entire vectors in 2D via PCA\n4. **Training dynamics**: Easier to see when/how the model \"learns\" the solution\n\nRecall from Section 1 that the rank-1 LoRA has:\n- 1-dimensional adaptation per layer\n- 9 out of 48 layers (pattern: 15-17, 21-23, 27-29)\n- 1 out of 7 possible modules (down_proj only)\n- ~70K trainable parameters (50× fewer than rank-32!)\n\nThe fact that this minimal intervention still produces emergent misalignment suggests EM is a **natural attractor** in the optimization landscape, not something that requires large capacity to encode.\n\nNow let's analyze the training dynamics by loading checkpoints from different points during training:", "index": 94, "line_start": 3201, "score": 1.855703278974552e-05, "sentence_scores": [{"score": 0.0, "sentence": "In earlier sections, we used the **rank-32 LoRA** (`bad-medical-advice`) which applies to all 48 layers and 7 modules."}, {"score": 0.0, "sentence": "This gives strong, clear misalignment - great for learning and experimentation."}, {"score": 7.549516567451064e-15, "sentence": "But for studying **phase transitions** and **training dynamics**, we'll focus on the **rank-1 LoRA** (`R1_3_3_3`) that we already loaded and inspected in Section 1."}, {"score": 0.0, "sentence": "Here's why minimal LoRAs are better for this analysis:"}, {"score": 0.9999835688933976, "sentence": "1."} const MIN_SENTENCE_LEN = 10;

let currentSort = 'chrono';
let selectedIdx = null;

function scoreToColor(score) {
  // Softer palette: white at 0, muted salmon/rose at 1
  const r = 255;
  const g = Math.round(255 - score * 110);
  const b = Math.round(255 - score * 100);
  return `rgb(${r}, ${g}, ${b})`;
}

function renderBlocks() {
  const container = document.getElementById('blocks');
  container.innerHTML = '';

  let indices = DATA.map((_, i) => i);
  if (currentSort === 'score') {
    indices.sort((a, b) => DATA[b].score - DATA[a].score);
  }

  indices.forEach(i => {
    const d = DATA[i];
    const meta = document.createElement('div');
    meta.className = 'block-meta';
    meta.textContent = `Cell ${d.index}  ·  Line ${d.line_start}  ·  P(AI) = ${(d.score * 100).toFixed(1)}%`;

    const block = document.createElement('pre');
    block.className = 'block' + (selectedIdx === i ? ' selected' : '');
    block.style.backgroundColor = scoreToColor(d.score);
    block.textContent = d.content;
    block.dataset.idx = i;
    block.onclick = () => selectBlock(i);

    container.appendChild(meta);
    container.appendChild(block);
  });

  document.getElementById('summary').textContent =
    `${DATA.length} blocks  ·  mean P(AI) = ${(DATA.reduce((s, d) => s + d.score, 0) / DATA.length * 100).toFixed(1)}%`;
}

function selectBlock(i) {
  selectedIdx = i;
  renderBlocks();
  showSentences(i);
}

function showSentences(i) {
  const panel = document.getElementById('sidePanel');
  const d = DATA[i];
  panel.classList.add('open');

  document.getElementById('panel-meta').textContent =
    `Cell ${d.index}  ·  Line ${d.line_start}  ·  Overall P(AI) = ${(d.score * 100).toFixed(1)}%`;

  const container = document.getElementById('panel-sentences');
  container.innerHTML = '';

  const filtered = (d.sentence_scores || []).filter(s => s.sentence.length >= MIN_SENTENCE_LEN);

  if (filtered.length === 0) {
    container.innerHTML = '<p style="color:#aaa;font-size:12px;">No sentence-level data available for this block.</p>';
    return;
  }

  filtered.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sentence';
    div.style.backgroundColor = scoreToColor(s.score);
    div.textContent = s.sentence;

    const meta = document.createElement('div');
    meta.className = 'sentence-meta';
    meta.textContent = `${(s.score * 100).toFixed(1)}%`;

    container.appendChild(div);
    container.appendChild(meta);
  });
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  selectedIdx = null;
  renderBlocks();
}

function sortBy(mode) {
  currentSort = mode;
  document.getElementById('btn-chrono').classList.toggle('active', mode === 'chrono');
  document.getElementById('btn-score').classList.toggle('active', mode === 'score');
  renderBlocks();
}

renderBlocks();
</script>
